        BomListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/Bom" } }, message: { const: ok } }
        BomCategoryListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/BomCategory" } }, message: { const: ok } }
        BomStructureApplyResultEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/BomStructureApplyResult" }, message: { const: ok } }
        BomStructureCategoryCreatedEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/BomStructureCategoryCreated" }, message: { const: ok } }
        BomStockEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/BomStockMap" }, message: { const: ok } }
        BomStockMap:
            type: object
            description: bomCode → 当前库存余量
            additionalProperties: { type: integer }
        BomStockLedgerEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/BomStockLedger" }, message: { const: ok } }
        BomStockLedger:
            type: object
            description: 单个 BOM 的出入库流水；flows 按业务日升序，stockQty 与末笔 balance 一致
            properties:
                bomCode: { type: string }
                stockQty: { type: integer }
                flows:
                    type: array
                    items: { $ref: "#/components/schemas/StockFlowRow" }
        StockFlowRow:
            type: object
            properties:
                type: { type: string, enum: [in, out, adjust] }
                no: { type: string }
                date: { type: string, format: date }
                qty: { type: integer, description: 有符号数量（入 +、出 −、调整 ±） }
                balance: { type: integer, description: 该笔完成后余量 }
                operator: { type: string }
                remark: { type: string }
                customer: { type: string, description: 仅出库行：订单建档时的客户名称快照；入库/调整行省略 }
        InboundEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/InboundRow" }, message: { const: ok } }
        InboundListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/InboundRow" } }, message: { const: ok } }
        StockAdjustmentEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/StockAdjustmentRow" }, message: { const: ok } }
        StockAdjustmentListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/StockAdjustmentRow" } }, message: { const: ok } }
        OutboundEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/OutboundRow" }, message: { const: ok } }
        OutboundListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/OutboundRow" } }, message: { const: ok } }
        UserEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/WbUser" }, message: { const: ok } }
        UserListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/WbUser" } }, message: { const: ok } }
        RoleListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/RoleDef" } }, message: { const: ok } }
        RoleGrantEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/RoleGrant" }, message: { const: ok } }
        GrantMapEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: object, additionalProperties: { $ref: "#/components/schemas/RoleGrant" } }, message: { const: ok } }
        GrantLogListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/GrantLogEntry" } }, message: { const: ok } }
        PermissionCatalogListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/PermissionCatalogEntry" } }, message: { const: ok } }
        PermissionCatalogEntryEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/PermissionCatalogEntry" }, message: { const: ok } }
        ProtectionLogListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/GrantLogEntry" } }, message: { const: ok } }
        RelationsEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/RelationsData" }, message: { const: ok } }
        RelationsData:
            type: object
            required: [schemaVersion, asOf, generatedAt, filters, nodes, edges, counts, typeCounts, summary]
            properties:
                schemaVersion: { type: integer, const: 1 }
                asOf: { type: string, format: date, description: 当前北京业务日 }
                generatedAt: { type: string, format: date-time }
                filters:
                    type: object
                    required: [status, start, end, types, orderNo, bomCode, customerCode]
                    properties:
                        status: { type: string, enum: [open, completed, archived, all] }
                        start: { type: [string, 'null'], format: date }
                        end: { type: [string, 'null'], format: date }
                        types: { type: array, items: { $ref: "#/components/schemas/RelationType" } }
                        orderNo: { type: [string, 'null'] }
                        bomCode: { type: [string, 'null'] }
                        customerCode: { type: [string, 'null'] }
                nodes: { type: array, items: { $ref: "#/components/schemas/RelationNode" } }
                edges: { type: array, items: { $ref: "#/components/schemas/RelationEdge" } }
                counts:
                    type: object
                    required: [open, completed, archived, all]
                    properties:
                        open: { type: integer, minimum: 0 }
                        completed: { type: integer, minimum: 0 }
                        archived: { type: integer, minimum: 0 }
                        all: { type: integer, minimum: 0 }
                typeCounts:
                    type: object
                    required: [bom, customer, order, inbound, outbound, person]
                    additionalProperties: { type: integer, minimum: 0 }
                summary:
                    type: object
                    required: [orderCount, overdueOrderIds, quantitiesByUnit]
                    properties:
                        orderCount: { type: integer, minimum: 0 }
                        overdueOrderIds: { type: array, items: { type: string }, description: 有待交量且交期早于当前北京日的订单 ID }
                        quantitiesByUnit:
                            type: array
                            items:
                                type: object
                                required: [unit, ordered, shipped, pending]
                                properties:
                                    unit: { type: string }
                                    ordered: { type: number }
                                    shipped: { type: number, description: 所选订单全生命周期有效出库净额 }
                                    pending: { type: number, description: 所选未归档订单当前待交量 }
        RelationType:
            type: string
            enum: [bom, customer, order, inbound, outbound, person]
        RelationNode:
            type: object
            required: [id, type, name, properties, facts]
            properties:
                id: { type: string, description: '类型前缀:数据库ID；ID 使用十进制字符串，不转 JS number。' }
                type: { $ref: "#/components/schemas/RelationType" }
                name: { type: string }
                properties: { type: object, additionalProperties: { type: string }, description: 中文展示字段，计算请使用 facts }
                voided: { type: boolean, description: 仅已作废单据为 true }
                facts:
                    oneOf:
                        - $ref: "#/components/schemas/RelationBomFacts"
                        - $ref: "#/components/schemas/RelationCustomerFacts"
                        - $ref: "#/components/schemas/RelationOrderFacts"
                        - $ref: "#/components/schemas/RelationInboundFacts"
                        - $ref: "#/components/schemas/RelationOutboundFacts"
                        - $ref: "#/components/schemas/RelationPersonFacts"
                    discriminator: { propertyName: type }
        RelationEdge:
            type: object
            required: [source, target, relation, kind]
            properties:
                source: { type: string }
                target: { type: string }
                relation: { type: string, enum: [下单, 订购, 入库, 发货, 建档, 负责客户, 创建订单, 归档, 检验入库, 登记发货] }
                kind: { type: string, enum: [business, person] }
        RelationBomFacts:
            type: object
            required: [type, code, unit, stock, createdById]
            properties:
                type: { const: bom }
                code: { type: string }
                unit: { type: string }
                stock: { type: number, description: v_bom_stock 当前净库存，不按日期截断 }
                createdById: { type: string }
        RelationCustomerFacts:
            type: object
            required: [type, code, ownerId]
            properties:
                type: { const: customer }
                code: { type: string }
                ownerId: { type: string }
        RelationOrderFacts:
            type: object
            required: [type, no, date, due, qty, shipped, unshippedQty, pendingQty, archived, unit, bomId, customerId, createdById, archivedById]
            properties:
                type: { const: order }
                no: { type: string }
                date: { type: string, format: date }
                due: { type: string, format: date }
                qty: { type: number }
                shipped: { type: number, description: v_order_outbound_qty 全生命周期净额 }
                unshippedQty: { type: number, description: max(0, qty - shipped)，归档单也保留 }
                pendingQty: { type: number, description: 归档为0，其他等于 unshippedQty }
                archived: { type: boolean }
                unit: { type: string }
                bomId: { type: string }
                customerId: { type: string }
                createdById: { type: string }
                archivedById: { type: [string, 'null'] }
        RelationInboundFacts:
            type: object
            required: [type, no, date, qty, voided, unit, bomId, operatorId]
            properties:
                type: { const: inbound }
                no: { type: string }
                date: { type: string, format: date }
                qty: { type: number, description: 当前单据登记数量，作废后无库存贡献 }
                voided: { type: boolean }
                unit: { type: string }
                bomId: { type: string }
                operatorId: { type: string }
        RelationOutboundFacts:
            type: object
            required: [type, no, date, qty, voided, unit, bomId, orderId, operatorId]
            properties:
                type: { const: outbound }
                no: { type: string }
                date: { type: string, format: date }
                qty: { type: number, description: originalQty；作废后有效贡献为0，计算时排除 voided=true }
                voided: { type: boolean }
                unit: { type: string }
                bomId: { type: string }
                orderId: { type: string }
                operatorId: { type: string }
        RelationPersonFacts:
            type: object
            required: [type, role]
            properties:
                type: { const: person }
                role: { type: string }
        WorkbenchOverviewEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/WorkbenchData" }, message: { const: ok } }
        SystemLogPageEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/SystemLogPage" }, message: { const: ok } }
        SystemLogPage:
            type: object
            required: [items, nextCursor]
            properties:
                items: { type: array, items: { $ref: "#/components/schemas/SystemLogEntry" } }
                nextCursor:
                    oneOf:
                        - $ref: "#/components/schemas/SystemLogCursor"
                        - value: { type: "null" }
                    description: 取本批末条；还有下一批时非空，否则 null
        SystemLogCursor:
            type: object
            required: [at, id]
            properties:
                at: { type: string, description: 末条 occurredAt（ISO 时刻） }
                id: { type: string, pattern: '^[0-9]+$', description: 末条来源行雪花 id（十进制串） }
        SystemLogEntry:
            type: object
            required: [id, occurredAt, actor, domain, action, targetCode, targetName, changes, reason]
            properties:
                id: { type: string, pattern: '^[0-9]+$', description: 来源行雪花 id（十进制串） }
                occurredAt: { type: string, format: date-time }
                actor:
                    type: object
                    required: [name, role]
                    properties:
                        name: { type: string, description: 操作人姓名（op_log 来源为快照；其余来源为当前姓名） }
                        role: { type: string, description: 角色 code（super/admin/warehouse/sales/staff） }
                domain: { type: string, enum: [customer, order, bom, bom_structure, inbound, outbound] }
                action: { type: string, enum: [create, edit, transfer, archive, unarchive, delete, void, ship, adjust] }
                targetCode: { type: string, description: 订单号/客户编码/BOM 编码/单号 }
                targetName: { type: [string, "null"], description: 目标名称快照；无名称路径的事件为 null }
                changes:
                    type: [array, "null"]
                    items: { $ref: "#/components/schemas/SystemLogChange" }
                    description: 字段级变更（before=null 表示新建记录）；无变更语义的事件为 null
                reason: { type: [string, "null"], description: 操作原因（未填为 null） }
        SystemLogChange:
            type: object
            required: [label, before, after]
            properties:
                key: { type: string, description: 语义源字段名（bomCode/orderNo 等），前端据此渲染可点击编号链接 }
                label: { type: string, description: 中文标签（订单数量/交货日期等） }
                before: { type: [string, "null"] }
                after: { type: [string, "null"] }
        WorkbenchData:
            type: object
            required: [asOf, unit, products, orders, movements]
            properties:
                asOf: { type: string, format: date, description: 业务截至日（北京日） }
                unit: { type: string, description: 全部 BOM 单位一致时取该值，混合时为“多单位” }
                products: { type: array, items: { $ref: "#/components/schemas/WorkbenchProduct" } }
                orders: { type: array, items: { $ref: "#/components/schemas/WorkbenchOrder" } }
                movements: { type: array, items: { $ref: "#/components/schemas/WorkbenchMovement" } }
        WorkbenchProduct:
            type: object
            required: [code, category, model, spec, unit, stock]
            properties:
                code: { type: string }
                category: { type: string }
                spec: { type: string, description: “组名：物料名 ×N” 摘要，按冻结 position 排序 }
                unit: { type: string }
                stock: { type: integer, description: v_bom_stock 口径，无流水 BOM 为 0 }
        WorkbenchOrder:
            type: object
            required: [no, customerCode, customer, bomCode, date, due, qty, shipped]
            properties:
                no: { type: string }
                customerCode: { type: string }
                customer: { type: string }
                bomCode: { type: string }
                date: { type: string, format: date, description: 下单日期 }
                due: { type: string, format: date, description: 交货日期 }
                qty: { type: integer, minimum: 1 }
                shipped: { type: integer, minimum: 0, description: 有效出库净额（v_order_outbound_qty） }
                archived: { type: boolean, description: 仅已归档订单携带 }
        WorkbenchMovement:
            type: object
            required: [date, bomCode, inbound, outbound]
            properties:
                date: { type: string, format: date, description: 业务日期 }
                bomCode: { type: string }
                inbound: { type: integer, minimum: 0, description: 有效检验入库合计 }
                outbound: { type: integer, description: 出库净额（含作废冲销，跨日冲销当天可能为负） }
        HealthStatus:
            type: object
            required: [status]
            properties:
                status: { type: string, const: ok, description: 存活/就绪状态 }
        HealthEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/HealthStatus" }, message: { const: ok } }
        AiDocsManifestEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/AiDocsManifest" }, message: { const: ok } }
        AiDocsManifest:
            type: object
            required: [root, topics]
            properties:
                root: { type: string, description: 根文档 markdown 正文（常驻注入 system prompt） }
                topics: { type: array, items: { $ref: "#/components/schemas/AiDocTopicMeta" } }
        AiDocTopicMeta:
            type: object
            required: [id, title, whenToUse]
            properties:
                id: { type: string, enum: [endpoints, operations, process, roles, analytics] }
                title: { type: string }
                whenToUse: { type: string, description: 何时读这篇（任务路由提示） }
        AiDocContentEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/AiDocContent" }, message: { const: ok } }
        AiDocContent:
            type: object
            required: [id, title, markdown]
            properties:
                id: { type: string }
                title: { type: string }
                markdown: { type: string }
        AiVoidedInboundPageEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/AiVoidedInboundPage" }, message: { const: ok } }
        AiVoidedInboundPage:
            type: object
            required: [items, total]
            properties:
                items: { type: array, items: { $ref: "#/components/schemas/AiVoidedInboundItem" } }
                total: { type: integer, description: 筛选条件下的作废总数（不受 limit 截断） }
        AiVoidedInboundItem:
            type: object
            required: [id, entryNo, bomCode, bomName, qty, businessDate, remark, status, voidedBy, voidedAt, voidReason]
            properties:
                id: { type: string, pattern: "^[0-9]+$" }
                entryNo: { type: string }
                bomCode: { type: string }
                bomName: { type: string, description: 品类名（bom.category.name） }
                qty: { type: integer, minimum: 1 }
                businessDate: { type: string, format: date }
                remark: { type: string }
                status: { type: string, const: voided }
                voidedBy: { type: string, description: 作废人姓名（最后一条 VOID 日志操作人） }
                voidedAt: { type: string, format: date-time }
                voidReason: { type: [string, "null"], description: 作废原因（无 VOID 日志时为 null） }
        AiVoidedOutboundPageEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/AiVoidedOutboundPage" }, message: { const: ok } }
        AiVoidedOutboundPage:
            type: object
            required: [items, total]
            properties:
                items: { type: array, items: { $ref: "#/components/schemas/AiVoidedOutboundItem" } }
                total: { type: integer }
        AiVoidedOutboundItem:
            type: object
            required: [id, shipmentNo, orderNo, customerName, bomCode, bomName, qty, businessDate, status, voidedBy, voidedAt, voidReason]
            properties:
                id: { type: string, pattern: "^[0-9]+$" }
                shipmentNo: { type: string }
                orderNo: { type: string }
                customerName: { type: string, description: 下单时冻结的客户名快照 }
                bomCode: { type: string }
                bomName: { type: string, description: 下单时冻结的成品名快照 }
                qty: { type: integer, minimum: 1, description: 出库数量（original_qty） }
                businessDate: { type: string, format: date }
                status: { type: string, const: voided }
                voidedBy: { type: string }
                voidedAt: { type: string, format: date-time }
                voidReason: { type: [string, "null"] }
        AiDeletedPageEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/AiDeletedPage" }, message: { const: ok } }
        AiDeletedPage:
            type: object
            required: [items, nextCursor]
            properties:
                items: { type: array, items: { $ref: "#/components/schemas/AiDeletedRecordItem" } }
                nextCursor:
                    oneOf:
                        - $ref: "#/components/schemas/SystemLogCursor"
                        - value: { type: "null" }
                    description: 取本批末条；还有下一批时非空，否则 null（与 /system-logs 同款复合游标）
        AiDeletedRecordItem:
            type: object
            required: [id, occurredAt, action, domain, targetCode, operator, detail]
            properties:
                id: { type: string, pattern: "^[0-9]+$" }
                occurredAt: { type: string, format: date-time }
                action: { type: string, enum: [delete_order, delete_inbound, delete_outbound, delete_bom, delete_customer, delete_bom_category] }
                domain: { type: string, enum: [customer, order, bom, bom_structure, inbound, outbound] }
                targetCode: { type: string, description: 订单号/单号/编码 }
                operator:
                    type: object
                    required: [name, role]
                    properties:
                        name: { type: string, description: 操作人姓名快照 }
                        role: { type: string, description: 角色 code 快照 }
                detail: { description: 删除前全量快照（结构因动作而异，见 src/domain/snapshots.ts；不含手机号明文） }
        AiChatInput:
            type: object
            required: [messages]
            properties:
                messages:
                    type: array
                    minItems: 1
                    maxItems: 20
                    items:
                        type: object
                        required: [role, content]
                        properties:
                            role: { type: string, enum: [system, user, assistant] }
                            content: { type: string, minLength: 1, maxLength: 16000 }
        AiChatResultEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/AiChatResult" }, message: { const: ok } }
        AiChatResult:
            type: object
            required: [content, model, finishReason, usage]
            properties:
                content: { type: string }
                model: { type: string }
                finishReason: { type: [string, "null"] }
                usage: { $ref: "#/components/schemas/AiChatUsage" }
        AiChatUsage:
            type: object
            required: [promptTokens, completionTokens, totalTokens]
            properties:
                promptTokens: { type: integer, minimum: 0 }
                completionTokens: { type: integer, minimum: 0 }
                totalTokens: { type: integer, minimum: 0 }
        AiStatusEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/AiStatus" }, message: { const: ok } }
        AiStatus:
            type: object
            required: [enabled, configured, model]
            properties:
                enabled: { type: boolean }
                configured: { type: boolean, description: baseUrl 与 apiKey 均已配置 }
                model: { type: string }
        AiSettingsViewEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/AiSettingsView" }, message: { const: ok } }
        AiSettingsView:
            type: object
            required: [baseUrl, model, enabled, apiKeySet, apiKeyMasked, updatedAt, updatedByName]
            properties:
                baseUrl: { type: string }
                model: { type: string }
                enabled: { type: boolean }
                apiKeySet: { type: boolean, description: 是否已配置 key }
                apiKeyMasked: { type: [string, "null"], description: 脱敏（如 sk-••••abcd）；未配置为 null }
                updatedAt: { type: [string, "null"], format: date-time }
                updatedByName: { type: [string, "null"] }
        AiSettingsUpdateInput:
            type: object
            description: 部分更新——省略保持原值；apiKey 空串=清除；首次配置 baseUrl+apiKey 必填
            properties:
                baseUrl: { type: string, minLength: 1, maxLength: 255, pattern: "^https?://", description: OpenAI 兼容上游服务地址（http/https） }
                apiKey: { type: string, minLength: 0, maxLength: 512 }
                model: { type: string, minLength: 1, maxLength: 64 }
                enabled: { type: boolean }
        AiTestResultEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/AiTestResult" }, message: { const: ok } }
        AiTestResult:
            type: object
            required: [ok, latencyMs, message, model]
            properties:
                ok: { type: boolean }
                latencyMs: { type: integer, minimum: 0 }
                message: { type: string }
                model: { type: [string, "null"] }
        AiUsageSummaryEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/AiUsageSummary" }, message: { const: ok } }
        AiUsageSummary:
            type: object
            required: [from, to, totals, users, byDay]
            properties:
                from: { type: string, format: date-time, description: 窗口起点（UTC 时刻，北京日界换算） }
                to: { type: string, format: date-time, description: 窗口终点（不含） }
                totals:
                    type: object
                    required: [requests, successRequests, errorRequests, promptTokens, completionTokens, totalTokens]
                    properties:
                        requests: { type: integer, minimum: 0 }
                        successRequests: { type: integer, minimum: 0 }
                        errorRequests: { type: integer, minimum: 0 }
                        promptTokens: { type: integer, minimum: 0 }
                        completionTokens: { type: integer, minimum: 0 }
                        totalTokens: { type: integer, minimum: 0 }
                users: { type: array, items: { $ref: "#/components/schemas/AiUsageUserRow" } }
                byDay: { type: array, items: { $ref: "#/components/schemas/AiUsageDayRow" } }
        AiUsageUserRow:
            type: object
            required: [userId, account, name, role, requests, promptTokens, completionTokens, totalTokens, lastUsedAt]
            properties:
                userId: { type: string, pattern: "^[0-9]+$" }
                account: { type: string }
                name: { type: string }
                role: { type: string }
                requests: { type: integer, minimum: 0 }
                promptTokens: { type: integer, minimum: 0 }
                completionTokens: { type: integer, minimum: 0 }
                totalTokens: { type: integer, minimum: 0 }
                lastUsedAt: { type: [string, "null"], format: date-time }
        AiUsageDayRow:
            type: object
            required: [date, requests, totalTokens]
            properties:
                date: { type: string, description: 北京日期 yyyy-MM-dd }
                requests: { type: integer, minimum: 0 }
                totalTokens: { type: integer, minimum: 0 }
