openapi: 3.1.0
info:
    title: 众茂生产系统 API
    version: 0.2.0
    description: |
        后端实现基线。修改接口时必须同步 `src/api/types.ts` 与本文件。

        ## 鉴权与授权
        - 登录以账号和密码换取 JWT。JWT 本身不存数据库，后端用密钥验证签名、有效期、签发者和受众。
        - JWT 至少包含 `sub`（用户 id 字符串）、`ver`（签发时的 token_version）、`iat`、`exp`、`jti`。
        - 除登录和幂等退出外，每次请求均按 `sub` 查询当前 `sys_user`，校验启用状态及 `ver=token_version`，并使用数据库中的当前角色和实时授权；不得信任旧角色 claim。
        - 改密、停用和角色变更会递增 token_version。改密成功后旧 JWT 立即失效，客户端清除 token 并重新登录。
        - 每个端点都校验其描述中的权限码；前端菜单和按钮隐藏不是安全边界。

        ## 数据一致性
        - 响应统一为 `{code, data, message}`；成功 `code=0`，失败 code 与 HTTP 4xx/5xx 一致。
        - 创建、归档、删除、作废与库存调整类 POST 必须携带 `Idempotency-Key`。同一用户、操作和 key 的相同请求重放原成功响应；请求体不同返回 409。
        - 可变资源使用 `expectedVersion` 做乐观锁；版本或并发业务状态冲突返回 409。
        - 业务编码由后端通过 `biz_sequence` 事务取号，禁止使用 `MAX(code)+1`。
        - 库存 = 有效入库合计 + 库存调整合计 - 有效出库净额。出库登记、作废与订单归档/删除按固定顺序加行锁并在一个事务提交。
        - 业务日期使用 `yyyy-MM-dd`；系统时间使用带时区 ISO 8601，数据库保存 UTC。
        - 工作台数据由 `/workbench/overview` 聚合端点统一供给（订单/台账契约当前无分页，仍返回完整计算窗口）；后续启用服务端分页时，不能以分页局部数据在派生侧计算全局库存。
servers:
    - url: /api
      description: Vite 代理或 MSW
security:
    - bearerAuth: []

tags:
    - name: auth
      description: JWT 会话与个人资料
    - name: orders
      description: 销售订单、归档与删除
    - name: customers
      description: 客户档案与负责人候选
    - name: boms
      description: 成品/BOM 档案与后端规格目录
    - name: bom-structure
      description: BOM 结构在线维护（仅超管；品类/分区/分组/物料树的隐藏、排序、规则与新建品类，只影响之后新建的 BOM）
    - name: inbound
      description: 成品入库、当天修正和库存调整
    - name: outbound
      description: 出库登记与作废
    - name: users
      description: 系统用户与离岗移交
    - name: roles
      description: 固定角色、实时授权与授权日志
    - name: permissions
      description: 权限目录与受保护开关（读 permissions:view；切换仅 super 角色）
    - name: workbench
      description: 工作台经营总览聚合
    - name: system
      description: 应用内数据库备份/恢复（默认仅超管，可解锁下放；含恢复任务查询）
    - name: system-logs
      description: 系统日志时间线聚合（默认仅超管，可在角色与权限授予其他角色）
    - name: ai
      description: AI 助手——agent 只读查询与按需文档、对话代理（后端转发+按人 token 记账）、AI 工作台配置与用量（受保护 menu:ai-workbench，默认仅超管，可解锁下放）
    - name: health
      description: 存活/就绪探针（无鉴权，供编排系统与冒烟脚本）

paths:
    /auth/login:
        post:
            tags: [auth]
            operationId: login
            summary: 账号密码登录
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/LoginInput" }
            responses:
                "200":
                    description: 登录成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/LoginEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }

    /auth/logout:
        post:
            tags: [auth]
            operationId: logout
            summary: 幂等退出
            description: JWT 不在数据库保存；端点始终允许客户端完成本地 token 清理，即使 token 已过期也返回成功。
            security: []
            responses:
                "200": { $ref: "#/components/responses/SuccessWithoutData" }

    /auth/password:
        put:
            tags: [auth]
            operationId: changePassword
            summary: 自助修改密码
            description: 修改密码不是首次登录强制操作。服务端验证旧密码，更新强哈希并递增 token_version；成功后当前及其他旧 JWT 全部失效，用户重新登录。
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/ChangePasswordInput" }
            responses:
                "200": { $ref: "#/components/responses/SuccessWithoutData" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "401": { $ref: "#/components/responses/Unauthorized" }

    /auth/profile:
        get:
            tags: [auth]
            operationId: getProfile
            summary: 当前用户与实时角色授权
            description: 姓名、角色、状态等资料为管理员域，本人只读；修改姓名走用户管理接口 PUT /users/{account}。protectedCodes 为当前受保护权限码（运行时真源，解锁/加锁后随刷新变化），供侧边栏「超管专属」标签等展示口径使用。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ProfileEnvelope" }
                "401": { $ref: "#/components/responses/Unauthorized" }

    /orders:
        get:
            tags: [orders]
            operationId: listOrders
            summary: 销售订单列表
            description: 权限 `orders:view`。归档订单仍返回用于历史审计。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OrderListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [orders]
            operationId: createOrder
            summary: 新建销售订单
            description: 权限 `orders:create`。客户名称和 BOM 快照由服务端查询；订单号按 orderDate 每日事务取号。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateOrderInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OrderEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /orders/{orderNo}:
        put:
            tags: [orders]
            operationId: updateOrder
            summary: 修改销售订单
            description: 权限 `orders:edit`。未发货订单可改数量/交货日期/备注，新数量不得小于该订单有效出库净额；已发货（有效出库净额 > 0）订单数量与交货日期锁定，仅可修改备注；已归档订单不可修改。客户与 BOM 仅在净出库为 0 且无任何未删除出库单（含已作废，与删除同口径）时可改：换 BOM 按新档案重冻名称/型号/规格快照，换客户刷新名称快照；同值上送视为未变更（不触发守卫、不重冻快照）。下单日期计入订单号不可改。删除走专用端点 POST /orders/{orderNo}/delete，归档走 POST /orders/{orderNo}/archive。
            parameters:
                - $ref: "#/components/parameters/OrderNo"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateOrderInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OrderEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /orders/{orderNo}/archive:
        post:
            tags: [orders]
            operationId: archiveOrder
            summary: 归档订单（终态）
            description: 受保护权限 `orders:archive`，默认仅 super（super 可解锁后授予其他角色）。收尾已完成或部分发货的订单使其退出活跃视图：归档后订单从销售订单页移入归档订单页，仅供查询，不可修改/删除，剩余欠量（若有）不再安排交付。一件未发的订单不可归档（手误单走删除）；存在未作废出库单时归档直接放行，已发数量保留。归档期间冻结依赖链：该订单的出库单不可作废/删除（审计依据），被引用 BOM 不可删除；归档后仅归档操作人本人可经 unarchiveOrder 回退。归档人、归档时间与备注（选填）随行落库并写 change_log ARCHIVE 事件与 op_log 供审计。幂等（Idempotency-Key）。
            parameters:
                - $ref: "#/components/parameters/OrderNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/ArchiveOrderInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OrderEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /orders/{orderNo}/unarchive:
        post:
            tags: [orders]
            operationId: unarchiveOrder
            summary: 回退归档订单
            description: 受保护权限 `orders:unarchive`，默认仅 super（super 可解锁后授予其他角色），且仅归档操作人本人（服务端按 `archived_by` 判等，超管同样受限；非归档人 403）。把误归档的订单退回 ACTIVE：订单返回销售订单页，恢复编辑/发货/删除，出库单恢复可作废/删除，可发量重新纳入该订单；归档三要素（archived_at/archived_by/archive_reason）随回退清空（DB CHECK 强制），归档与回退语境由 ARCHIVE/UNARCHIVE 变更日志快照保留。回退备注（选填）随行落库；写 change_log UNARCHIVE 事件与 op_log（unarchive_order）供审计。再次归档时新归档人接替回退权。幂等（Idempotency-Key）。
            parameters:
                - $ref: "#/components/parameters/OrderNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UnarchiveOrderInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OrderEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /orders/{orderNo}/delete:
        post:
            tags: [orders]
            operationId: deleteOrder
            summary: 删除净发货为零且无可见出库单的销售订单
            description: 受保护权限 `orders:delete`，默认仅 super（super 可解锁后授予其他角色）。累计已发必须为 0，且无任何出库单；仍存在的已作废出库单也会阻止删除。成功后订单及其变更日志同事务物理删除并立即退出列表和待交统计，`op_log` 保存删除前快照。删除与出库登记竞争同一订单锁。
            parameters:
                - $ref: "#/components/parameters/OrderNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/DeleteOrderInput" }
            responses:
                "200": { $ref: "#/components/responses/SuccessWithoutData" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /customers:
        get:
            tags: [customers]
            operationId: listCustomers
            summary: 客户档案列表
            description: 权限 `customers:view`，仅 super/admin/sales。手机号只返回掩码；合作状态按近 6 个日历月的活动订单派生。完整手机号仅 GET /customers/{code}/phone 提供。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/CustomerListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [customers]
            operationId: createCustomer
            summary: 新建客户档案
            description: 权限 `customers:create`。负责人必须是启用中的销售；客户编码全局事务取号。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateCustomerInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/CustomerEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /customers/{code}/phone:
        get:
            tags: [customers]
            operationId: revealCustomerPhone
            summary: 获取客户完整手机号
            description: 权限 `customers:view`，且仅超级管理员或客户当前负责人（销售）可获取，其余角色 403。完整手机号只用于复制场景，不随列表/详情返回，页面展示一律掩码。
            parameters:
                - $ref: "#/components/parameters/CustomerCode"
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/CustomerPhoneEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }

    /customers/{code}:
        put:
            tags: [customers]
            operationId: updateCustomer
            summary: 编辑客户档案
            description: 权限 `customers:edit`。负责人变化写历史。phone 为空表示保留原号码。删除走专用端点 POST /customers/{code}/delete。
            parameters:
                - $ref: "#/components/parameters/CustomerCode"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateCustomerInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/CustomerEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /customers/{code}/delete:
        post:
            tags: [customers]
            operationId: deleteCustomer
            summary: 删除无销售订单的客户档案
            description: 受保护权限 `customers:delete`，默认仅 super（super 可解锁后授予其他角色）。用于清理手误建档：客户不得有任何销售订单（进行中/已归档均算引用；已删除订单物理删除、视同无订单），否则返回 409。删除为物理移除：负责人移交历史与客户行同事务删除（外键要求先清子行），`op_log` 记 delete_customer 事件与删除前档案快照（手机号不落明文），是删除后唯一残留。删除与订单新建竞争同一客户行锁与外键 RESTRICT，先提交者生效。幂等（Idempotency-Key）。
            parameters:
                - $ref: "#/components/parameters/CustomerCode"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/DeleteCustomerInput" }
            responses:
                "200": { $ref: "#/components/responses/SuccessWithoutData" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /customer-owner-options:
        get:
            tags: [customers]
            operationId: listCustomerOwnerOptions
            summary: 客户负责人候选
            description: 权限 `customers:view`。仅返回启用中销售与超级管理员的 name/account，不暴露用户管理信息。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/CustomerOwnerOptionListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /bom-categories:
        get:
            tags: [boms]
            operationId: listBomCategories
            summary: 后端权威 BOM 品类与物料目录（全量含停用标记）
            description: "权限 `bom:view`。品类集合 = 7 个启用品类 + xk3-wire/xk3-plug 两个停用目录容器（status=false 下发供合并目录）；品类内节点/物料全量下发——停用节点/物料带 `status: false` 标记（启用省略），仅供管理页展示与历史归属匹配（bomComposition），新建 BOM 的可选集由前端按「自身∧祖先启用」过滤、后端建档校验仍以启用目录为权威。每品类携带 rowVersion（目录整树乐观锁，结构维护保存时比对）。跌倒开关、旋转XK3 品类额外下发 childCategories 标记（建档时传子品类 key，该子品类完整物料目录并入校验，不引用任何已建 BOM）；前端不得自行决定有效品类、目录结构或编码前缀。"
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BomCategoryListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /boms:
        get:
            tags: [boms]
            operationId: listBoms
            summary: BOM/成品档案列表
            description: 权限 `bom:view`。明细与摘要全部取自建档冻结快照，不依赖当前目录。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BomListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [boms]
            operationId: createBom
            summary: 新建唯一 BOM（品类 + 选中物料集合）
            description: 权限 `bom:create`。服务端按品类目录校验（ids 非空、去重、归属且品类/分区/分组/物料启用、单选组最多 1 项）；品类标记 childCategories 时 childCategory 必填（如跌倒开关选微动开关类型），该子品类的完整物料目录并入校验范围。判重指纹为 `[品类 id, [[物料 id, 数量]...], 备注]` 三元素 JSON（物料 id BigInt 十进制规范化、去重、按 id 数值升序，数字不加引号、备注为 trim 后原文）的 SHA-256，命中相同品类即 409 并返回已有 bomCode，输入顺序与重复 id 不影响指纹。同幂等键同请求摘要重放原成功响应，同键异内容 409。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateBomInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BomEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /boms/{code}/delete:
        post:
            tags: [boms]
            operationId: deleteBom
            summary: 删除未被引用的 BOM
            description: 受保护权限 `bom:delete`，默认仅 super（super 可解锁后授予其他角色）。用于清理手误建档：不得被任何销售订单引用（含已归档订单），且不得存在入库或库存调整流水，否则返回 409。删除为物理移除：明细行与 BOM 行同事务删除，`op_log` 记录 delete_bom 事件与删除前档案快照；删除后档案不再出现在列表中。删除与订单新建、入库登记竞争同一 BOM 行锁，先提交者生效。BOM 建档后不可修改，无乐观锁版本，请求体为空。
            parameters:
                - $ref: "#/components/parameters/BomCode"
                - $ref: "#/components/parameters/IdempotencyKey"
            responses:
                "200": { $ref: "#/components/responses/SuccessWithoutData" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /bom-structure/apply:
        post:
            tags: [bom-structure]
            operationId: applyBomStructure
            summary: 维护既有品类的目录结构（新增/隐藏/恢复/排序/规则/改名/移动/删除）
            description: 受保护权限 `bom-structure:manage`，默认仅 super（super 可解锁后授予其他角色）。携带期望版本 expectedRowVersion 做乐观锁（与品类当前 row_version 不一致即 409「品类结构已被他人修改」）；服务端锁定本品类及结构伙伴品类（正/反向 child_categories 引用，id 升序）后重读校验：全树层级/无环/唯一性（分区与分组共享名称命名空间；层级 = 分支可见层数含物料层最多 5 层，分组可嵌套挂分组/分区/品类根）、复合目录伙伴 groupKey 冲突、编码前缀不涉及。operations 为顺序应用的操作序列（十态，草稿节点用 tempId 关联），单次至多 200 条且必须产生实际变更。v2 新增 rename 改名 / move 跨父移动（分组换分区、分组或根——移入自身或其后代静默忽略；物料换分组，均追加到目标末位） / remove 删除（分区/分组连带其下整支），受冻结边界引用守卫约束：被既有 BOM 明细引用（bom_item.material_id / group_key）的物料不能删除、改名、换组，被引用分组不能改名——400 带行数提示，请改走隐藏；分区名不进冻结快照，改名不受限。生效口径：结构变更只影响保存后新建的 BOM；已保存 BOM 及关联订单、出入库记录不会自动补充或修改（隐藏/删除不影响旧档案，旧 BOM 需要增加物料时请另建 BOM）。本次隐藏的物料仍被既有 BOM 明细引用时响应附带 hiddenUsageCount 行数提示（不阻断）。同幂等键同请求摘要重放原成功响应，同键异内容 409。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/ApplyBomStructureInput" }
            responses:
                "200":
                    description: 成功（新版本号）
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BomStructureApplyResultEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /bom-structure/categories:
        post:
            tags: [bom-structure]
            operationId: createBomCategory
            summary: 新建品类（名称 + 编码前缀 + 整棵草稿树，可选下属类型）
            description: 受保护权限 `bom-structure:manage`，默认仅 super（super 可解锁后授予其他角色）。事务内锁定 bom_category 全部既有行（id 升序）串行化创建：校验品类名/编码前缀唯一，且前缀不得与既有前缀构成「前缀 + 纯数字尾差」的数字延长关系（XK2 与 XK21 拒绝；KW/KWO、XK3/XK3W 字母尾差合法——序列 padStart 不截断，数字延长会拼出相同 BOM 编码）。categoryKey 与分组 groupKey 由后端生成（分组键依次派生 g1..；存量数据中的 model 键仅为旧数据兼容，无维护语义）。v2 新增可选 types（下属类型，至多 12 个，各带名称与前缀、同样参与唯一/数字延长校验）：创建后主品类登记 child_categories 成为复合品类，类型为停用的目录容器品类（永不取号、不进建档下拉），与既有 焊线/插线、新/老微动跌倒 容器同构。仍不开放品类改名、改 key/前缀、复合关系编辑与品类级停用。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateBomCategoryInput" }
            responses:
                "200":
                    description: 成功（新品类）
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BomStructureCategoryCreatedEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /bom-structure/categories/{categoryKey}/delete:
        post:
            tags: [bom-structure]
            operationId: deleteBomCategory
            summary: 删除品类（整支级联，危险操作）
            description: 受保护权限 `bom-structure:manage`，默认仅 super（super 可解锁后授予其他角色）。事务内锁定全部品类行后级联删除品类自身、其下属类型容器、目录树（分区/分组/物料）、名下全部 BOM 档案与取号序列；被复合品类引用为下属类型时 409，名下任一 BOM 已被订单/出入库/库存调整引用时 409 并逐个列出 BOM 编码。同幂等键重放返回原响应。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
                - name: categoryKey
                  in: path
                  required: true
                  schema: { type: string, maxLength: 40 }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [deleted, key]
                                properties:
                                    deleted: { type: boolean, const: true }
                                    key: { type: string }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /bom-stocks:
        get:
            tags: [boms]
            operationId: listBomStocks
            summary: BOM 当前库存余量聚合
            description: 权限 `bom:view`。口径同 v_bom_stock：有效入库 + 库存调整 − 全部出库单的台账事件（作废单正向+冲销行等额相抵）；仅返回存在流水的 bomCode，无流水者由前端按 0 展示。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BomStockEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /bom-stocks/{code}/ledger:
        get:
            tags: [boms]
            operationId: getBomStockLedger
            summary: BOM 出入库流水与逐笔结余
            description: 权限 `bom:view`。入库仅展示有效（ACTIVE）单，库存调整全部展示；出库展示全部单据的全部事件，作废单的正向与冲销行成对出现（冲销行备注展示作废原因），按业务日升序计算逐笔结余。`stockQty` 与末笔 `balance` 及 v_bom_stock 恒等。BOM 不存在返回 404；存在但无有效流水返回空 flows 与 stockQty 0。
            parameters:
                - $ref: "#/components/parameters/BomCode"
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BomStockLedgerEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }

    /inbound:
        get:
            tags: [inbound]
            operationId: listInbound
            summary: 入库台账
            description: 权限 `inbound:view`。包含 active/voided，便于审计。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/InboundListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [inbound]
            operationId: createInbound
            summary: 检验入库登记
            description: 权限 `inbound:register`，默认 warehouse/super。登记人和创建时间取服务端鉴权上下文。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateInboundInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/InboundEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /inbound/{no}:
        put:
            tags: [inbound]
            operationId: updateInbound
            summary: 修正当天录入的入库
            description: 权限 `inbound:edit`，默认 warehouse/super。当天按 createdAt 的北京时间自然日判断，不按业务日期；原登记人和创建时间不变，before/after 与原因写不可变日志。
            parameters:
                - $ref: "#/components/parameters/InboundNo"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateInboundInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/InboundEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /inbound/{no}/void:
        post:
            tags: [inbound]
            operationId: voidInbound
            summary: 作废入库（当天窗口；持跨天权限可作废任意天数）
            description: 权限 `inbound:edit`，默认 warehouse/super。created_at 落在北京当天的记录可作废；受保护权限 `inbound:void-any-day`（默认仅 super，可解锁下放）可跨天作废。不是物理删除；作废后不计库存并写 before/after 审计日志与 op_log(void_inbound)；库存非负校验对跨天作废同样生效。
            parameters:
                - $ref: "#/components/parameters/InboundNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/VoidResourceInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/InboundEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /inbound/{no}/delete:
        post:
            tags: [inbound]
            operationId: deleteInbound
            summary: 删除已作废的入库记录（物理删除）
            description: 权限 `inbound:delete`，默认 warehouse/super（非受保护，super 可按需授予其他角色）。仅 VOIDED 状态可删（ACTIVE 必须先作废，作废时库存已扣回）；被库存调整单引用的单返回 409（调整单不可变，引用中的入库单永不删除）。物理删除：行与变更日志同事务删除、列表不再返回，不递增 row_version（版本链止于 VOID）；`op_log` 记 delete_inbound 与删除前快照（含作废原因），是删除后唯一残留。删错直接重建单，无恢复入口。
            parameters:
                - $ref: "#/components/parameters/InboundNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/DeleteInboundInput" }
            responses:
                "200": { $ref: "#/components/responses/SuccessWithoutData" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /stock-adjustments:
        get:
            tags: [inbound]
            operationId: listStockAdjustments
            summary: 不可变库存调整列表
            description: 权限 `inbound:view`。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/StockAdjustmentListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [inbound]
            operationId: createStockAdjustment
            summary: 新增跨日库存调整
            description: 受保护权限 `inbound:adjust`，默认仅 super（super 可解锁后授予其他角色）。只能追加；负向调整后库存不得小于 0。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateStockAdjustmentInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/StockAdjustmentEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /outbound:
        get:
            tags: [outbound]
            operationId: listOutbound
            summary: 出库单列表
            description: 权限 `outbound:view`。返回 registered/voided 单头；原数量事件和冲销事件不被改删。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OutboundListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [outbound]
            operationId: createOutbound
            summary: 登记发货
            description: 权限 `outbound:ship`，默认 warehouse/super。事务锁 BOM 和订单并重新计算可发量（桶模型：可发量 = min(当前库存, 订单剩余待交)，不按交期排队预留，先登记发货者先得）；创建 REGISTERED 单头及正向数量事件。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateOutboundInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OutboundEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /outbound/{no}/void:
        post:
            tags: [outbound]
            operationId: voidOutbound
            summary: 作废出库单
            description: 权限 `outbound:void`，默认 warehouse/super。唯一逆向操作：仅 REGISTERED 可作废（已作废 409）；追加等额负向冲销并恢复订单已发量和库存。
            parameters:
                - $ref: "#/components/parameters/OutboundNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/VoidResourceInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OutboundEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /outbound/{no}/delete:
        post:
            tags: [outbound]
            operationId: deleteOutbound
            summary: 删除已作废的出库单（物理删除）
            description: 权限 `outbound:delete`，默认 warehouse/super（非受保护，super 可按需授予其他角色）。仅 VOIDED 状态可删（作废时已追加冲销、订单已发量已恢复）；所属订单已归档返回 409（删除即断归档审计链）。物理删除：单头与状态日志、NORMAL+CORRECTION 数量流水同事务删除（零和不改变统计）、出库列表与 BOM 库存流水不再返回；不递增 row_version、不写状态日志。`op_log` 记 delete_outbound 与删除前快照（含原始发货备注、登记人/时点及作废原因）。
            parameters:
                - $ref: "#/components/parameters/OutboundNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/DeleteOutboundInput" }
            responses:
                "200": { $ref: "#/components/responses/SuccessWithoutData" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /users:
        get:
            tags: [users]
            operationId: listUsers
            summary: 用户列表
            description: 受保护权限 `permissions:view`，默认仅 super（super 可解锁后授予其他角色）。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/UserListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [users]
            operationId: createUser
            summary: 新增普通用户
            description: 受保护权限 `permissions:manage`，默认仅 super（super 可解锁后授予其他角色）。初始密码为 123456 的强哈希；不得通过接口新增 super。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateUserInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/UserEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /users/{account}:
        put:
            tags: [users]
            operationId: updateUser
            summary: 编辑用户姓名或角色
            description: 受保护权限 `permissions:manage`，默认仅 super（super 可解锁后授予其他角色）。account 不可改；销售转岗且仍负责客户时，必须原子批量移交给另一名启用销售。
            parameters:
                - $ref: "#/components/parameters/Account"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateUserInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/UserEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /users/{account}/status:
        patch:
            tags: [users]
            operationId: setUserStatus
            summary: 启用或停用用户
            description: 受保护权限 `permissions:manage`，默认仅 super（super 可解锁后授予其他角色）。super 不可停用；停用销售且仍负责客户时必须在同一事务移交。
            parameters:
                - $ref: "#/components/parameters/Account"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/SetUserStatusInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/UserEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /users/{account}/reset-password:
        post:
            tags: [users]
            operationId: resetUserPassword
            summary: 重置用户密码为初始密码
            description: 受保护权限 `permissions:manage`，默认仅 super（super 可解锁后授予其他角色）。重置为初始密码 123456；递增 token_version 使该用户旧会话立即失效。super 不可重置。
            parameters:
                - $ref: "#/components/parameters/Account"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/ResetUserPasswordInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/UserEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /roles:
        get:
            tags: [roles]
            operationId: listRoles
            summary: 固定角色目录
            description: 受保护权限 `permissions:view`，默认仅 super（super 可解锁后授予其他角色）。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/RoleListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /roles/grants:
        get:
            tags: [roles]
            operationId: listRoleGrants
            summary: 全量角色授权
            description: 受保护权限 `permissions:view`，默认仅 super（super 可解锁后授予其他角色）。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/GrantMapEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /roles/grants/log:
        get:
            tags: [roles]
            operationId: listRoleGrantLogs
            summary: 授权变更日志
            description: 受保护权限 `permissions:view`，默认仅 super（super 可解锁后授予其他角色）。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/GrantLogListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /roles/{roleId}/grants:
        put:
            tags: [roles]
            operationId: updateRoleGrant
            summary: 原子替换单个角色授权
            description: 受保护权限 `permissions:manage`，默认仅 super（super 可解锁后授予其他角色）。内置 super 授权不可改；动作必须同时包含父菜单与 view；仍受保护的码不可授予其他角色（解锁后可）。
            parameters:
                - $ref: "#/components/parameters/RoleIdParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/SaveRoleGrantInput" }
            responses:
                "200":
                    description: 成功；无变化保存不递增版本，但仍记录 no-op 安全事件。
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/RoleGrantEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /permissions/catalog:
        get:
            tags: [permissions]
            operationId: listPermissionCatalog
            summary: 权限目录与运行时受保护状态
            description: 受保护权限 `permissions:view`，默认仅 super（解锁后持码角色同权可读）。返回全量权限目录及各码当前 protected 状态，供「角色与权限」编辑器灰显与「受保护权限」管理使用。
            responses:
                "200":
                    description: 目录按 code 升序。
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/PermissionCatalogListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /permissions/catalog/log:
        get:
            tags: [permissions]
            operationId: listPermissionProtectionLogs
            summary: 保护开关审计日志
            description: 受保护权限 `permissions:view`，默认仅 super（解锁后持码角色同权可读）。解锁/加锁各写一行（含操作人、加锁清理的授权行数与客户端原因），最新在前。
            responses:
                "200":
                    description: 审计条目列表。
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ProtectionLogListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /permissions/catalog/{code}/protected:
        patch:
            tags: [permissions]
            operationId: setPermissionProtection
            summary: 切换权限码受保护状态（仅 super 角色）
            description: 仅 super 角色本身可调用（@SuperOnly，按角色直判、不校验权限码——任何权限码解锁后都可授予他人，不能用于守门）。false=解锁，随后可在 PUT /roles/{roleId}/grants 授予其他角色；true=重新加锁，同事务清理该码全部授权行并递增所有角色 grant_version（JwtStrategy 权限缓存失效，已登录角色立即失去该权限）。重复翻转返回 400。
            parameters:
                - $ref: "#/components/parameters/PermissionCode"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/SetPermissionProtectionInput" }
            responses:
                "200":
                    description: 切换后的目录条目。
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/PermissionCatalogEntryEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }

    /workbench/relations:
        get:
            tags: [workbench]
            operationId: getWorkbenchRelations
            summary: 分析页及 agent 共用的业务关系聚合
            description: |
                同时需要 menu:analytics 和 menu:workbench（super 直通），沿用 Bearer JWT。
                返回可直接渲染的 nodes/edges；nodes.facts 为 agent 可计算的原始字段，properties 为中文展示字段。
                单据、有效出库净额与当前库存在同一只读事务内顺序读取（READ COMMITTED，各语句独立快照）。
                日期含首尾：订单按 orderDate，出入库按 businessDate；范围内出库引用的历史订单也保留。
                status=all 时还纳入范围内仅有入库、没有订单的 BOM；指定 orderNo/customerCode 时不混入无关 BOM。
                completed 表示累计有效出库 >= 订单数量，含已交满归档单；archived 表示归档，可能尚未交满，两组可重叠。
                已删除订单/单据物理消失不返回；作废未删单据保留 voided 标记，qty 是原登记量，不是有效出库量。
                order.facts.shipped 与 bom.facts.stock 为当前全生命周期净额（统一视图口径），不是区间流水合计或期末历史库存。
                counts 为日期/编号条件下各状态订单数；typeCounts 为状态筛选后、类型筛选前的节点数。
                summary 在类型筛选前计算，按单位分组；已归档订单 pendingQty=0，unshippedQty 仍保留历史未发量。
                types 限定返回实体类型，边只在两端都返回时保留；facts 中被过滤的引用 ID 可以不出现在 nodes 中。
                未传 start/end 不限日期，前端默认近30天。建议 agent 带日期或业务编号缩小范围。
                过载保护：日期/编号条件下候选订单最多1000条，所选BOM最多1000条，入库/出库各最多1000条，类型筛选前关联节点最多1500个。
                超限返回400并提示缩短日期或按业务编号查询，不截断成功数据或统计；候选订单上限覆盖所有状态，隐藏类型不绕过上限。
            parameters:
                - in: query
                  name: status
                  schema: { type: string, enum: [open, completed, archived, all], default: open }
                  description: 订单范围；open 为未完成未归档。
                - in: query
                  name: start
                  schema: { type: string, format: date }
                - in: query
                  name: end
                  schema: { type: string, format: date }
                - in: query
                  name: types
                  schema: { type: string, example: 'bom,customer,order' }
                  description: 逗号分隔 bom/customer/order/inbound/outbound/person；不传为六类，空串为不显示任何类型。
                - in: query
                  name: orderNo
                  schema: { type: string, maxLength: 24 }
                  description: 精确订单号。
                - in: query
                  name: bomCode
                  schema: { type: string, maxLength: 32 }
                - in: query
                  name: customerCode
                  schema: { type: string, maxLength: 24 }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/RelationsEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /workbench/overview:
        get:
            tags: [workbench]
            operationId: getWorkbenchOverview
            summary: 工作台经营总览聚合
            description: |
                需菜单权限 `menu:workbench`（super 直通）。角色被收回「工作台」后返回 403，
                前端登录改为落地其授权内第一个页面。返回工作台读模型：products 含 v_bom_stock
                实时库存，orders 的 shipped 为 v_order_outbound_qty 净额（无流水订单缺行按 0），
                movements 按业务日聚合有效入库与出库净额（含作废冲销）；库存调整计入库存
                但不出现在出入库趋势。周期汇总、交付风险、客户排行与趋势分桶由前端派生。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/WorkbenchOverviewEnvelope" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /system-logs:
        get:
            tags: [system-logs]
            operationId: listSystemLogs
            summary: 系统日志时间线（分批追加）
            description: |
                权限 `system-logs:view`（普通可授权码，默认仅超管，可在角色与权限直接授予其他角色）。聚合四来源为统一业务事件流：op_log
                （订单创建/归档/归档回退/删除、客户创建/编辑/负责人移交（含离岗批量移交）、BOM
                创建/删除、入库创建/作废/删除、出库登记发货/作废/删除）、
                sales_order_change_log（仅 UPDATE 的编辑明细）、inbound_change_log（仅
                UPDATE 的当天修正）、stock_adjustment（库存调整，domain=inbound、
                action=adjust）。同表的 db_backup/db_restore 是系统审计动作，不进入此业务时间线。
                上述业务动作在当前留存策略下全量覆盖——订单/入库的编辑明细日志随
                订单删除而消失，属有限留存而非永久历史审计。

                分批为 (occurredAt, id) 复合游标（加载更多语义）：首批不带游标，后续
                携带上一批 nextCursor 的 at+id；两批无重叠、合集与全量一致。雪花 id 以
                十进制字符串往返（超 ±2^53 精度），不能 Number 解析。

                关键词匹配操作人姓名、目标编号、目标名称三项（LIKE）。名称命中依赖
                快照存在——存量 create_order/ship 等旧日志无名称快照，按名称搜不到属
                预期降级；按编号/操作人仍可命中，不做历史回填。时间范围按北京日界：
                today 为今天，7d/30d 均含今天共 N 个自然日，custom 含起止日期。

                操作人筛选（operator）按用户账号精确匹配（姓名可重名故不用姓名）：
                账号先解析为用户 id，四个来源表均按 operator_id 过滤，跨 op_log /
                change_log / stock_adjustment 一致生效；账号不存在返回 400。
            parameters:
                - name: domain
                  in: query
                  required: false
                  schema: { type: string, enum: [customer, order, bom, bom_structure, inbound, outbound] }
                - name: action
                  in: query
                  required: false
                  schema:
                      type: string
                      enum: [create, edit, transfer, archive, unarchive, delete, void, ship, adjust]
                - name: operator
                  in: query
                  required: false
                  schema: { type: string, maxLength: 64, description: 操作人账号（精确匹配，四来源统一按 operator_id 过滤） }
                - name: range
                  in: query
                  required: false
                  schema: { type: string, enum: [today, 7d, 30d, custom], default: today }
                - name: from
                  in: query
                  required: false
                  schema: { type: string, format: date, description: 自定义范围开始（含，北京日界） }
                - name: to
                  in: query
                  required: false
                  schema: { type: string, format: date, description: 自定义范围结束（含） }
                - name: keyword
                  in: query
                  required: false
                  schema: { type: string, maxLength: 64, description: 操作人、编号或名称 }
                - name: limit
                  in: query
                  required: false
                  schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
                - name: beforeAt
                  in: query
                  required: false
                  schema: { type: string, description: 游标：上一批末条 occurredAt（ISO 时刻） }
                - name: beforeId
                  in: query
                  required: false
                  schema: { type: string, pattern: '^[0-9]+$', description: 游标：上一批末条雪花 id（十进制串） }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/SystemLogPageEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /system/backup/catalog:
        get:
            tags: [system]
            operationId: getBackupCatalog
            summary: 备份分组目录
            description: |
                受保护权限 `system-backup:run`，默认仅 super（可解锁下放）；单独持有备份菜单码无权访问。
                返回业务域分组（key/label/tables/dependsOn）与全部分组键。完整备份＝
                目录全集（动态计算）；恢复维护期间放行（只读白名单）。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [groups, allGroupKeys]
                                properties:
                                    groups:
                                        type: array
                                        items:
                                            type: object
                                            required: [key, label, tables, dependsOn]
                                            properties:
                                                key: { type: string }
                                                label: { type: string }
                                                tables: { type: array, items: { type: string } }
                                                dependsOn: { type: array, items: { type: string } }
                                    allGroupKeys: { type: array, items: { type: string } }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /system/backup/run:
        post:
            tags: [system]
            operationId: runBackup
            summary: 执行备份并流式下载
            description: |
                受保护权限 `system-backup:run`，默认仅 super（super 可解锁后授予其他角色）。
                按分组闭包导出数据快照（zmsys-backup v1 格式，仅数据不含 DDL），
                以 application/sql 或 application/gzip 附件流式返回。响应头
                content-disposition 携带文件名。先写「发起备份」op_log(db_backup)
                再开流——该日志不是下载成功凭证。备份含口令哈希，按机密保管。
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [groups]
                            properties:
                                groups:
                                    type: array
                                    minItems: 1
                                    items: { type: string }
                                gzip: { type: boolean, default: false }
            responses:
                "200":
                    description: 备份文件流（附件）
                    content:
                        application/sql:
                            schema: { type: string, format: binary }
                        application/gzip:
                            schema: { type: string, format: binary }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "503": { $ref: "#/components/responses/Maintenance" }

    /system/restore/preview:
        post:
            tags: [system]
            operationId: previewRestore
            summary: 恢复文件预检
            description: |
                受保护权限 `system-restore:run`，默认仅 super（可解锁下放）；单独持有恢复菜单码无权访问。
                上传统一格式备份文件（512MiB 上限，gzip 按魔数识别），完整校验
                checksum/文法/schema 指纹/迁移基线后返回 meta 与 canReplace。
                只读不落任何业务数据。
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [file]
                            properties:
                                file: { type: string, format: binary }
            responses:
                "200":
                    description: 预检结果（meta + canReplace + 逐表行数）
                    content:
                        application/json:
                            schema: { type: object }
                "400": { $ref: "#/components/responses/BadRequest" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "413": { $ref: "#/components/responses/PayloadTooLarge" }

    /system/restore/run:
        post:
            tags: [system]
            operationId: runRestore
            summary: 提交恢复任务（异步）
            description: |
                受保护权限 `system-restore:run`，默认仅 super（super 可解锁后授予其他角色）。
                multipart 字段须置于文件之前：mode=merge|replace、ack（merge 须 RESTORE /
                replace 须 REPLACE）、requestKey（8-64 位提交身份）。requestKey 为幂等身份：
                同 key 同文件同模式重提返回 200 原终态；异文件/模式 409。受理返回 202 后
                系统进入维护态（非白名单请求 503）直至终态；客户端保留 requestKey 断线重查
                （GET /system/restore/jobs/key/{requestKey}）。404 查询结果表示当前未查到
                持久记录，不代表终态（原请求可能仍在上传/预检），可凭同 key 重提。
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [mode, ack, requestKey, file]
                            properties:
                                mode: { type: string, enum: [merge, replace] }
                                ack: { type: string, enum: [RESTORE, REPLACE] }
                                requestKey: { type: string, minLength: 8, maxLength: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$" }
                                file: { type: string, format: binary }
            responses:
                "200":
                    description: 同 key 重提回放既有终态
                    content:
                        application/json:
                            schema: { type: object }
                "202":
                    description: 已受理（jobId；执行期维护态，凭 key 轮询）
                    content:
                        application/json:
                            schema: { type: object }
                "400": { $ref: "#/components/responses/BadRequest" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }
                "413": { $ref: "#/components/responses/PayloadTooLarge" }
                "503": { $ref: "#/components/responses/Maintenance" }

    /system/restore/jobs/{id}:
        get:
            tags: [system]
            operationId: getRestoreJob
            summary: 按 jobId 查询恢复任务
            description: 受保护权限 `system-restore:run`，默认仅 super（可解锁下放）；维护期可查询。
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: string, pattern: "^[0-9]{1,19}$" }
            responses:
                "200":
                    description: 任务视图（内存 RUNNING/UNKNOWN 或持久终态）
                    content:
                        application/json:
                            schema: { type: object }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { description: 未查到记录（不代表终态） }

    /system/restore/jobs/key/{requestKey}:
        get:
            tags: [system]
            operationId: getRestoreJobByKey
            summary: 凭 requestKey 查询恢复任务（维护期放行）
            description: |
                受保护权限 `system-restore:run`，默认仅 super（可解锁下放）；单独持有恢复菜单码无权访问。
                断线/刷新/重登录后凭客户端自存的 requestKey 查询。恢复维护期间该端点
                放行（只读白名单）。返回 UNKNOWN 表示提交结果核实中（保持维护，禁止重跑）。
            parameters:
                - name: requestKey
                  in: path
                  required: true
                  schema: { type: string }
            responses:
                "200":
                    description: 任务视图
                    content:
                        application/json:
                            schema: { type: object }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { description: 当前未查到记录（原请求可能仍在上传或预检；可凭同 key 重提） }

    /health/live:
        get:
            tags: [health]
            operationId: healthLive
            summary: 存活探针
            description: |
                @Public，无权限要求。进程活着即 200（不触数据库）；
                恢复维护期只读白名单放行本端点。
            security: []
            responses:
                "200":
                    description: 进程存活
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/HealthEnvelope" }

    /health/ready:
        get:
            tags: [health]
            operationId: healthReady
            summary: 就绪探针
            description: |
                @Public，无权限要求。数据库探活（SELECT 1）成功返回 200；
                失败返回 503 与错误信封（数据库不可用）。
            security: []
            responses:
                "200":
                    description: 数据库可用
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/HealthEnvelope" }
                "503":
                    description: 数据库不可用
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    /ai/agent/docs:
        get:
            tags: [ai]
            operationId: getAiAgentDocs
            summary: agent 文档清单（manifest）
            description: |
                登录即可（@AuthenticatedOnly）。返回根文档正文 root（常驻注入 system prompt，
                含系统概览与「用户问什么 → 读哪篇」任务路由）与主题清单；主题正文按
                GET /ai/agent/docs/{topicId} 按需拉取。文档正文单一归属在仓库 docs/
                （docs/ai/ 三篇 + docs/business/ 复用三篇），不复制本契约的参数细节。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AiDocsManifestEnvelope" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "503": { $ref: "#/components/responses/Maintenance" }

    /ai/agent/docs/{topicId}:
        get:
            tags: [ai]
            operationId: getAiAgentDocTopic
            summary: agent 单篇主题文档
            description: |
                登录即可。topicId 见 manifest：endpoints（查询端点目录与口径）、operations
                （操作指南与前置条件）、process（业务流程）、roles（角色与权限）、analytics
                （关系数据口径）。未知 topicId 返回 404。
            parameters:
                - name: topicId
                  in: path
                  required: true
                  schema: { type: string, enum: [endpoints, operations, process, roles, analytics] }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AiDocContentEnvelope" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "404": { $ref: "#/components/responses/NotFound" }
                "503": { $ref: "#/components/responses/Maintenance" }

    /ai/agent/voided/inbound:
        get:
            tags: [ai]
            operationId: listAiVoidedInbound
            summary: 作废入库数据查询（agent）
            description: |
                权限 `inbound:view`（agent 与登录用户同权）。只返回 status=VOIDED 的入库
                台账行，附作废人/作废时间/作废原因（取该单最后一条 VOID 变更日志，与删除
                快照同源口径）；total 一并返回，超过 limit 时用 bomCode/keyword 收敛。
                全量含作废的台账仍走 GET /inbound。
            parameters:
                - name: bomCode
                  in: query
                  required: false
                  schema: { type: string, minLength: 1, maxLength: 32, description: BOM 编号精确匹配 }
                - name: keyword
                  in: query
                  required: false
                  schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[!-~]+$", description: 关键词 LIKE（入库单号/BOM 编号；可打印 ASCII） }
                - name: limit
                  in: query
                  required: false
                  schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AiVoidedInboundPageEnvelope" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "503": { $ref: "#/components/responses/Maintenance" }

    /ai/agent/voided/outbound:
        get:
            tags: [ai]
            operationId: listAiVoidedOutbound
            summary: 作废出库数据查询（agent）
            description: |
                权限 `outbound:view`（agent 与登录用户同权）。只返回 state=VOIDED 的出库单，
                附单头作废三字段（voidedBy/voidedAt/voidReason）；客户/BOM 名称用下单时冻结
                的订单快照。全量含作废的出库列表仍走 GET /outbound。
            parameters:
                - name: orderNo
                  in: query
                  required: false
                  schema: { type: string, minLength: 1, maxLength: 24, description: 订单号精确匹配 }
                - name: bomCode
                  in: query
                  required: false
                  schema: { type: string, minLength: 1, maxLength: 32, description: BOM 编号精确匹配 }
                - name: keyword
                  in: query
                  required: false
                  schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[!-~]+$", description: 关键词 LIKE（出库单号/订单号；可打印 ASCII） }
                - name: limit
                  in: query
                  required: false
                  schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AiVoidedOutboundPageEnvelope" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "503": { $ref: "#/components/responses/Maintenance" }

    /ai/agent/deleted:
        get:
            tags: [ai]
            operationId: listAiDeleted
            summary: 已删除数据查询（op_log delete_* 快照，agent）
            description: |
                权限 `system-logs:view`（普通可授权码，默认仅超管持有，可在「角色与权限」
                直接授予）。2026-10 起订单/出入库/BOM/客户删除均为物理删除，op_log 的
                delete_* 快照是唯一留存；本端点返回原始 detail（删除前全量快照，区别于
                GET /system-logs 的中文投影）。快照按保护口径不含手机号明文，但含
                ownerAccount/createdBy 等账号名。分批为 (occurredAt,id) 复合游标
                （加载更多语义，非翻页）；时间范围口径与 /system-logs 一致（北京日界）。
            parameters:
                - name: domain
                  in: query
                  required: false
                  schema: { type: string, enum: [customer, order, bom, bom_structure, inbound, outbound] }
                - name: keyword
                  in: query
                  required: false
                  schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[!-~]+$", description: 关键词 LIKE（目标编号；可打印 ASCII） }
                - name: range
                  in: query
                  required: false
                  schema: { type: string, enum: [today, 7d, 30d, custom], default: 30d }
                - name: from
                  in: query
                  required: false
                  schema: { type: string, format: date, description: range=custom 必填，包含当日 }
                - name: to
                  in: query
                  required: false
                  schema: { type: string, format: date, description: range=custom 必填，包含当日 }
                - name: limit
                  in: query
                  required: false
                  schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
                - name: beforeAt
                  in: query
                  required: false
                  schema: { type: string, description: 游标——上一批末条 occurredAt（ISO 时刻） }
                - name: beforeId
                  in: query
                  required: false
                  schema: { type: string, pattern: "^[0-9]+$", description: 游标——上一批末条雪花 id（十进制串） }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AiDeletedPageEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "503": { $ref: "#/components/responses/Maintenance" }

    /ai/chat:
        post:
            tags: [ai]
            operationId: aiChat
            summary: AI 对话（非流式，后端代理转发）
            description: |
                登录即可（@AuthenticatedOnly）。读 AI 工作台单行配置转发 OpenAI 兼容上游
                （固定 max_tokens 4096、超时 45s），按登录人记一行 ai_usage_log。未配置或
                未启用返回 503（文案引导联系超管）；上游失败返回 502。不带 Idempotency-Key
                ——重试即新请求新计费。请求体上限 20 条 × 16k 字符（字符数限制；
                JSON 字节体积仍受 Fastify 默认 1MiB bodyLimit 约束，超限 413）。
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/AiChatInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AiChatResultEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "502":
                    description: 上游失败
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ErrorEnvelope" }
                "503":
                    description: 未配置/未启用，或恢复维护中
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    /ai/chat/stream:
        post:
            tags: [ai]
            operationId: aiChatStream
            summary: AI 对话（流式 SSE 直通）
            description: |
                登录即可。请求体与 /ai/chat 相同（20 条 × 16k 字符，字符数限制；字节体积
                受 Fastify 默认 1MiB bodyLimit 约束，超限 413）；响应为 text/event-stream
                直通上游（不走 {code,data,message} 信封），请求带 stream_options.include_usage，
                末尾 usage 帧由后端捕获记账。响应头发出前上游失败返回 502 信封；发出后
                失败以 SSE `event: error`（data 为 {message}）收尾。客户端断线即中止上游
                并按 error 记账（用量未知）。上游时限 45s（低于恢复排空窗 60s）。
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/AiChatInput" }
            responses:
                "200":
                    description: "SSE 流（data: {...} 增量帧 + data: [DONE]；错误时 event: error）"
                    content:
                        text/event-stream:
                            schema: { type: string }
                "400": { $ref: "#/components/responses/BadRequest" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "502":
                    description: 上游失败（响应头未发出时）
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ErrorEnvelope" }
                "503":
                    description: 未配置/未启用，或恢复维护中
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    /ai/status:
        get:
            tags: [ai]
            operationId: aiStatus
            summary: AI 服务状态（面板状态点）
            description: |
                登录即可。只看本地配置态（enabled/configured/model），不探测上游；
                供 AI 面板状态点展示。configured = baseUrl 与 apiKey 均已配置。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AiStatusEnvelope" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "503": { $ref: "#/components/responses/Maintenance" }

    /ai/admin/settings:
        get:
            tags: [ai]
            operationId: getAiSettings
            summary: AI 工作台配置读取
            description: |
                受保护权限 `menu:ai-workbench`，默认仅 super（可解锁下放后授予其他角色；
                与前端菜单同码，解锁后页面/API 一致生效）。api_key 永不透出原文，
                只返回 apiKeySet 与脱敏 apiKeyMasked。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AiSettingsViewEnvelope" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
        put:
            tags: [ai]
            operationId: updateAiSettings
            summary: AI 工作台配置保存（部分更新）
            description: |
                受保护权限 `menu:ai-workbench`。省略字段保持原值；apiKey 空串 = 显式清除；
                首次配置必须给 baseUrl + apiKey（否则 400）。变更与业务行同事务写
                op_log(update_ai_config) 审计——快照脱敏，只记变更字段名/启用态/host/模型，
                绝不写入 key 内容。
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/AiSettingsUpdateInput" }
            responses:
                "200":
                    description: 保存后的配置视图（同 GET）
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AiSettingsViewEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "503": { $ref: "#/components/responses/Maintenance" }

    /ai/admin/test:
        post:
            tags: [ai]
            operationId: testAiConnection
            summary: AI 上游连通测试
            description: |
                受保护权限 `menu:ai-workbench`。以 max_tokens=1 的最小补全探测已保存配置
                （15s 超时）；诊断请求不写 ai_usage_log。未保存 baseUrl+apiKey 时 400。
                ok=false 时 message 携带上游状态码或网络错误摘要。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AiTestResultEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "503": { $ref: "#/components/responses/Maintenance" }

    /ai/admin/usage:
        get:
            tags: [ai]
            operationId: getAiUsage
            summary: AI 用量统计（按人/按日聚合）
            description: |
                受保护权限 `menu:ai-workbench`。按人聚合（账号/姓名/角色/请求数/三类 token/
                最近使用，按 totalTokens 降序）+ 汇总 + 按日趋势（北京日界）。失败请求计入
                requests 但 token 记 0（用量未知，见 error 口径）。
            parameters:
                - name: range
                  in: query
                  required: false
                  schema: { type: string, enum: [today, 7d, 30d, custom], default: 30d }
                - name: from
                  in: query
                  required: false
                  schema: { type: string, format: date, description: range=custom 必填，包含当日 }
                - name: to
                  in: query
                  required: false
                  schema: { type: string, format: date, description: range=custom 必填，包含当日 }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/AiUsageSummaryEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "401": { $ref: "#/components/responses/Unauthorized" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "503": { $ref: "#/components/responses/Maintenance" }

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    parameters:
        IdempotencyKey:
            name: Idempotency-Key
            in: header
            required: true
            description: 8–128 个可见 ASCII 字符；同一次逻辑请求的网络重试必须复用同一个值。
            schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[!-~]+$" }
        OrderNo:
            name: orderNo
            in: path
            required: true
            schema: { type: string, pattern: "^ZM[0-9]{6}[0-9]{3,}$" }
        BomCode:
            name: code
            in: path
            required: true
            description: 品类前缀 + 至少 3 位序号，前缀 XK2/XK3/KW/KWO/AQ/KD/KQ/XK3W/XK3P，如 XK2001、KW001、KWO001、AQ001、KD001、KQ001
            schema: { type: string, pattern: "^(XK3W|XK3P|XK2|XK3|KWO|KW|AQ|KD|KQ)[0-9]{3,}$" }
        CustomerCode:
            name: code
            in: path
            required: true
            schema: { type: string, pattern: "^CUS-[0-9]{4,}$" }
        InboundNo:
            name: no
            in: path
            required: true
            schema: { type: string, pattern: "^RK[0-9]{6}[0-9]{2,}$" }
        OutboundNo:
            name: no
            in: path
            required: true
            schema: { type: string, pattern: "^CK[0-9]{6}[0-9]{2,}$" }
        Account:
            name: account
            in: path
            required: true
            schema: { type: string, pattern: "^[A-Za-z0-9_]{3,64}$" }
        RoleIdParam:
            name: roleId
            in: path
            required: true
            schema: { $ref: "#/components/schemas/RoleId" }
        PermissionCode:
            name: code
            in: path
            required: true
            description: 权限码，如 `menu:system-backup`、`orders:delete`（含冒号，URL 编码传入）
            schema: { type: string, pattern: "^[a-z0-9-]+(:[a-z0-9-]+)?$" }

    responses:
        SuccessWithoutData:
            description: 成功
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/NullEnvelope" }
        BadRequest:
            description: 参数或业务格式校验失败
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        PayloadTooLarge:
            description: 上传文件超 512MiB 或解压内容/单行超限
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        Maintenance:
            description: 系统恢复维护中（非只读白名单请求一律拒绝；终端态后自动解除）
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        Unauthorized:
            description: JWT 缺失、无效、过期、版本失效或账号已停用
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        Forbidden:
            description: 当前实时角色授权不包含所需权限码
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        NotFound:
            description: 资源不存在
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        Conflict:
            description: expectedVersion 过期、状态竞争、幂等键冲突、库存变化或唯一约束冲突
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    schemas:
        Envelope:
            type: object
            required: [code, data, message]
            properties:
                code: { type: integer }
                data: true
                message: { type: string }

        ErrorEnvelope:
            type: object
            required: [code, data, message]
            properties:
                code: { type: integer, minimum: 400 }
                data: { type: "null" }
                message: { type: string }

        NullEnvelope:
            type: object
            required: [code, data, message]
            properties:
                code: { type: integer, const: 0 }
                data: { type: "null" }
                message: { type: string, const: ok }

        RoleId:
            type: string
            enum: [super, admin, warehouse, sales, staff]

        CreateRoleId:
            type: string
            enum: [admin, warehouse, sales, staff]

        WbUser:
            type: object
            required: [version, name, account, role, active, last, createdAt]
            properties:
                version: { type: integer, minimum: 1 }
                name: { type: string, minLength: 1, maxLength: 20 }
                account: { type: string, pattern: "^[A-Za-z0-9_]{3,64}$" }
                role: { $ref: "#/components/schemas/RoleId" }
                active: { type: boolean }
                last: { type: string, description: 最近登录展示值；从未登录为破折号 }
                createdAt: { type: string, format: date-time, description: 创建时间 }
                updatedAt:
                    type: string
                    format: date-time
                    description: 最近一次资料/状态/密码变更时间；恒有值（Prisma 层变更时刷新）

        LoginInput:
            type: object
            additionalProperties: false
            required: [account, password]
            properties:
                account: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, format: password, minLength: 1, maxLength: 128 }

        ChangePasswordInput:
            type: object
            additionalProperties: false
            required: [oldPassword, newPassword]
            properties:
                oldPassword: { type: string, format: password, minLength: 1, maxLength: 128 }
                newPassword: { type: string, format: password, minLength: 6, maxLength: 128 }

        LoginResult:
            type: object
            required: [accessToken, user]
            properties:
                accessToken: { type: string }
                user: { $ref: "#/components/schemas/WbUser" }

        ProfileResult:
            type: object
            required: [user, grant, protectedCodes]
            properties:
                user: { $ref: "#/components/schemas/WbUser" }
                grant: { $ref: "#/components/schemas/RoleGrant" }
                protectedCodes:
                    type: array
                    uniqueItems: true
                    items: { type: string }
                    description: 当前受保护权限码（运行时真源）；字典兜底值见前端 data/permissions.ts

        RoleDef:
            type: object
            required: [id, name]
            properties:
                id: { $ref: "#/components/schemas/RoleId" }
                name: { type: string }
                locked: { type: boolean }

        RoleGrant:
            type: object
            required: [version, menus, actions]
            properties:
                version: { type: integer, minimum: 1 }
                menus:
                    type: array
                    uniqueItems: true
                    items: { type: string }
                actions:
                    type: object
                    additionalProperties:
                        type: array
                        uniqueItems: true
                        items: { type: string }

        SaveRoleGrantInput:
            type: object
            additionalProperties: false
            required: [grant, expectedVersion, note]
            properties:
                grant: { $ref: "#/components/schemas/RoleGrant" }
                expectedVersion: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 500 }

        GrantLogEntry:
            type: object
            required: [time, user, text]
            properties:
                time: { type: string }
                user: { type: string }
                text: { type: string }

        PermissionCatalogEntry:
            type: object
            required: [code, kind, menuKey, label, protected]
            properties:
                code: { type: string }
                kind: { type: string, enum: [MENU, ACTION] }
                menuKey: { type: string }
                actionId: { type: [string, "null"], description: 仅 ACTION 条目携带 }
                label: { type: string }
                protected: { type: boolean, description: true=受保护（默认仅 super）；运行时可由 super 切换 }

        SetPermissionProtectionInput:
            type: object
            additionalProperties: false
            required: [protected]
            properties:
                protected: { type: boolean, description: true=加锁（默认仅超管）；false=解锁（可授予其他角色） }
                reason: { type: string, maxLength: 500, description: 变更原因，记入保护开关日志 }

        Order:
            type: object
            required: [version, orderNo, customer, customerCode, bomCode, qty, outbound, orderDate, deliverDate, remark, lifecycleStatus, createdBy, createdAt]
            properties:
                version: { type: integer, minimum: 1 }
                orderNo: { type: string }
                customer: { type: string, description: 下单时客户名称快照 }
                customerCode: { type: string }
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                outbound: { type: integer, minimum: 0, description: 有效出库净额 }
                orderDate: { type: string, format: date }
                deliverDate: { type: string, format: date, description: 交货日期（单个日历日，排序/逾期口径） }
                remark: { type: string }
                lifecycleStatus: { type: string, enum: [active, archived] }
                createdBy: { type: string, description: 创建人姓名（审计展示，不随编辑变化） }
                createdAt: { type: string, format: date-time, description: 创建时刻 }
                archivedAt: { type: string, format: date-time, description: 仅归档终态返回 }
                archivedBy: { type: string, description: 归档操作人姓名 }
                archivedByAccount: { type: string, description: 归档操作人账号（仅归档终态返回），前端归档回退入口判等用 }
                archiveReason: { type: string, description: 归档备注（选填） }

        CreateOrderInput:
            type: object
            additionalProperties: false
            required: [customerCode, bomCode, qty, deliverDate, orderDate, remark]
            properties:
                customerCode: { type: string }
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                deliverDate: { type: string, format: date }
                orderDate: { type: string, format: date }
                remark: { type: string, maxLength: 2000 }

        UpdateOrderInput:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            minProperties: 2
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                customerCode: { type: string, pattern: "^CUS-[0-9]{4,}$", description: 仅净出库为 0 且无未删除出库单时可改；null 视为未提供 }
                bomCode: { type: string, minLength: 1, maxLength: 32, description: 仅净出库为 0 且无未删除出库单时可改，服务端重冻快照；null 视为未提供 }
                qty: { type: integer, minimum: 1 }
                deliverDate: { type: string, format: date }
                remark: { type: string, maxLength: 2000 }

        ArchiveOrderInput:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 500, description: 归档备注（选填） }

        UnarchiveOrderInput:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 500, description: 回退备注（选填） }

        DeleteOrderInput:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            properties:
                expectedVersion: { type: integer, minimum: 1 }

        DeleteCustomerInput:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            properties:
                expectedVersion: { type: integer, minimum: 1 }

        DeleteInboundInput:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            properties:
                expectedVersion: { type: integer, minimum: 1 }

        DeleteOutboundInput:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            properties:
                expectedVersion: { type: integer, minimum: 1 }

        Customer:
            type: object
            required: [version, code, name, contact, phone, province, city, district, town, address, cooperation, owner, ownerAccount, createdBy, payTerms, created]
            properties:
                version: { type: integer, minimum: 1 }
                code: { type: string }
                name: { type: string, minLength: 4, maxLength: 80 }
                contact: { type: string, minLength: 1, maxLength: 32 }
                phone: { type: string, pattern: "^1[0-9]{2}\\*{4}[0-9]{4}$" }
                province: { type: string }
                city: { type: string }
                district: { type: string }
                town: { type: string }
                address: { type: string }
                cooperation: { type: string, enum: [合作中, 待跟进] }
                owner: { type: string }
                ownerAccount: { type: string }
                createdBy: { type: string, description: 创建人姓名（created_by，建档后不变） }
                payTerms: { type: string }
                created: { type: string, format: date-time, description: 建档时刻（ISO 8601 带时区） }

        CreateCustomerInput:
            type: object
            additionalProperties: false
            required: [name, contact, phone, province, city, district, town, address, ownerAccount, payTerms]
            properties:
                name: { type: string, minLength: 4, maxLength: 80 }
                contact: { type: string, minLength: 1, maxLength: 32, description: 客户方联系人姓名 }
                phone: { type: string, pattern: "^1[0-9]{10}$" }
                province: { type: string, maxLength: 64, description: 可空，未填写传空串 }
                city: { type: string, maxLength: 64, description: 可空，未填写传空串 }
                district: { type: string, maxLength: 64 }
                town: { type: string, maxLength: 96 }
                address: { type: string, maxLength: 300, description: 可空，未填写传空串 }
                ownerAccount: { type: string, description: 启用中的销售或超级管理员账号 }
                payTerms: { type: string, maxLength: 160 }

        UpdateCustomerInput:
            type: object
            additionalProperties: false
            required: [expectedVersion, name, contact, phone, province, city, district, town, address, ownerAccount, payTerms]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                name: { type: string, minLength: 4, maxLength: 80 }
                contact: { type: string, minLength: 1, maxLength: 32, description: 客户方联系人姓名 }
                phone: { type: string, pattern: "^(|1[0-9]{10})$", description: 空字符串表示不修改 }
                province: { type: string, maxLength: 64, description: 可空，未填写传空串 }
                city: { type: string, maxLength: 64, description: 可空，未填写传空串 }
                district: { type: string, maxLength: 64 }
                town: { type: string, maxLength: 96 }
                address: { type: string, maxLength: 300, description: 可空，未填写传空串 }
                ownerAccount: { type: string, description: 启用中的销售或超级管理员账号 }
                payTerms: { type: string, maxLength: 160 }

        CustomerOwnerOption:
            type: object
            required: [name, account]
            properties:
                name: { type: string }
                account: { type: string }

        CustomerPhone:
            type: object
            required: [phone]
            properties:
                phone: { type: string, pattern: "^1[0-9]{10}$", description: 完整手机号，仅超管或客户当前负责人可获取 }

        BomCatalogNode:
            type: object
            required: [id, parentId, kind, name, key, multi, qty, items]
            description: 目录树节点；分区（section）为纯展示节点（不挂物料、不提供全选，只能为根），分组（group）挂可选物料、亦可挂子分组（parentId 关联，分支可见层数含物料层最多 5 层）。目录接口全量下发：停用节点/物料带 status=false 标记（启用省略），停用项仅供管理页展示与历史归属匹配，不可再选（可选 = 自身∧祖先启用）
            properties:
                id: { type: string }
                parentId: { type: [string, "null"] }
                kind: { type: string, enum: [section, group] }
                name: { type: string }
                key: { type: [string, "null"], description: 分组稳定标识（model 用于型号派生）；分区为 null }
                multi: { type: [boolean, "null"], description: 分组选择语义（false 单选 / true 多选）；分区为 null }
                qty: { type: [boolean, "null"], description: 分组数量语义（true 时选中项可携带 1-99 数量，如琴键开关的扣板/连锁片/静片/动片）；分区为 null }
                status: { type: boolean, description: 仅停用（隐藏）节点返回 false——整支对新建档不可选但历史归属仍匹配；启用省略 }
                items:
                    type: array
                    description: 分区恒为空数组
                    items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string }, status: { type: boolean, description: 仅停用（隐藏）物料返回 false；启用省略 } } }

        BomCategory:
            type: object
            required: [key, name, codePrefix, rowVersion, groups]
            properties:
                key: { type: string }
                name: { type: string }
                codePrefix: { type: string }
                rowVersion: { type: integer, minimum: 1, description: 品类目录整树乐观锁版本——任一分区/分组/物料/顺序/状态/规则变更在同事务 +1（结构维护保存携带期望值比对） }
                seqWidth: { type: integer, minimum: 3, maximum: 8 }
                status:
                    type: boolean
                    description: 仅停用品类返回 false（仅作分组的目录容器品类，被启用品类 childCategories 引用，随接口下发供合并目录，不在建档下拉出现）；启用品类无此字段
                childCategories:
                    type: array
                    items: { type: string }
                    description: 标记该品类建档必须传子品类 key（如跌倒开关的微动开关类型、旋转XK3 的焊线工艺），建档时将该子品类完整物料目录并入校验（不引用任何已建 BOM）；普通品类无此字段
                groups: { type: array, items: { $ref: "#/components/schemas/BomCatalogNode" } }

        StructureOperation:
            type: object
            additionalProperties: false
            required: [type]
            description: 单个结构操作（十态；targetId/groupId/parentId 兼容已存节点 id 与同批草稿 tempId）；按 type 的必填字段约束由服务层校验，缺字段返回 400。rename/move/remove 受引用守卫约束（被既有 BOM 明细引用的物料/分组 → 400）
            properties:
                type: { type: string, enum: [add_section, add_group, add_item, hide, restore, reorder, set_rules, rename, move, remove] }
                tempId: { type: string, maxLength: 64, description: 新增节点/物料的草稿标识（同批唯一，供后续操作引用） }
                name: { type: string, maxLength: 64, description: 新增/rename 的目标名称（同品类内分区与分组不能重名，物料按组内唯一） }
                parentId: { type: [string, "null"], description: add_group 与 move 分组：null/省略 = 挂品类根，否则为已存分区 id 或同批草稿分区 tempId；move 物料：必填目标分组 id }
                groupId: { type: string, description: add_item/set_rules：已存分组 id 或同批草稿分组 tempId }
                multi: { type: boolean }
                qty: { type: boolean }
                targetType: { type: string, enum: [section, group, item] }
                targetId: { type: string, description: hide/restore/reorder/rename/move/remove：已存节点/物料 id 或同批草稿 tempId }
                direction: { type: string, enum: [up, down] }
                items:
                    type: array
                    maxItems: 200
                    description: add_group 专属：随组新建的物料
                    items: { type: object, additionalProperties: false, required: [tempId, name], properties: { tempId: { type: string, maxLength: 64 }, name: { type: string, maxLength: 64 } } }

        ApplyBomStructureInput:
            type: object
            additionalProperties: false
            required: [categoryKey, expectedRowVersion, operations]
            properties:
                categoryKey: { type: string, maxLength: 40 }
                expectedRowVersion: { type: integer, minimum: 1, description: 期望的品类目录版本（乐观锁），不一致即 409 }
                operations:
                    type: array
                    minItems: 1
                    maxItems: 200
                    items: { $ref: "#/components/schemas/StructureOperation" }

        BomStructureApplyResult:
            type: object
            required: [rowVersion]
            properties:
                rowVersion: { type: integer, description: 保存后的新目录版本 }
                hiddenUsageCount: { type: integer, description: 本次隐藏的物料仍被既有 BOM 明细引用的总行数（提示不阻断——隐藏不影响旧档案） }

        DraftItem:
            type: object
            additionalProperties: false
            required: [tempId, name]
            properties:
                tempId: { type: string, maxLength: 64 }
                name: { type: string, maxLength: 64 }

        DraftNode:
            type: object
            additionalProperties: false
            required: [kind, tempId, name]
            description: 新建品类的草稿节点（平铺形态，tempId 关联分区父子与组内物料）；SECTION 纯展示，GROUP 挂根或分区（parentTempId），multi/qty 缺省按 false
            properties:
                kind: { type: string, enum: [SECTION, GROUP] }
                tempId: { type: string, maxLength: 64 }
                name: { type: string, maxLength: 64 }
                parentTempId: { type: [string, "null"], description: GROUP 专属：所属分区 tempId；null/省略 = 挂品类根 }
                multi: { type: boolean }
                qty: { type: boolean }
                items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/DraftItem" } }

        CreateBomCategoryInput:
            type: object
            additionalProperties: false
            required: [name, codePrefix, groups]
            properties:
                name: { type: string, maxLength: 64 }
                codePrefix: { type: string, pattern: "^[A-Z0-9]{1,16}$", description: BOM 编码前缀（1-16 位大写字母/数字）；不得与既有前缀构成数字延长关系 }
                seqWidth: { type: integer, minimum: 3, maximum: 8, description: BOM 编码序号宽度，缺省 3 }
                types:
                    type: array
                    maxItems: 12
                    description: 可选下属类型（目录容器品类）：创建后主品类登记 child_categories 成为复合品类
                    items:
                        type: object
                        additionalProperties: false
                        required: [name, codePrefix]
                        properties:
                            name: { type: string, maxLength: 64 }
                            codePrefix: { type: string, pattern: "^[A-Z0-9]{1,16}$" }
                groups:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/DraftNode" }

        BomStructureCategoryCreated:
            type: object
            required: [key, name, codePrefix, rowVersion]
            properties:
                key: { type: string, description: 后端生成的品类稳定 key }
                name: { type: string }
                codePrefix: { type: string }
                rowVersion: { type: integer, description: 新品类初始版本恒 1 }
                types:
                    type: array
                    description: 带下属类型创建时附类型清单（目录容器品类）
                    items:
                        type: object
                        required: [key, name, codePrefix, rowVersion]
                        properties:
                            key: { type: string }
                            name: { type: string }
                            codePrefix: { type: string }
                            rowVersion: { type: integer }

        BomItemView:
            type: object
            required: [materialId, groupKey, groupName, name, quantity]
            description: 建档冻结明细，按 position 排序返回
            properties:
                materialId: { type: string }
                groupKey: { type: string }
                groupName: { type: string }
                name: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 99, description: 冻结数量（qty 分组 1-99，其余恒 1） }

        Bom:
            type: object
            required: [code, name, items, spec, remark, creator, created, unit]
            properties:
                code: { type: string }
                name: { type: string }
                items: { type: array, items: { $ref: "#/components/schemas/BomItemView" } }
                spec: { type: string, description: "摘要（“组名：物料名 ×N”以 “ · ” 连接，数量 1 省略 ×N）" }
                remark: { type: string, description: "建档备注（物料构成之外的工艺差异，参与判重指纹）；空串 = 无备注" }
                creator: { type: string, description: 建档人姓名（sys_user.name） }
                created: { type: string, format: date-time, description: 建档时刻（ISO 8601 带时区） }
                unit: { type: string }

        CreateBomInput:
            type: object
            additionalProperties: false
            required: [name, materialItemIds]
            properties:
                name: { type: string, description: 必须匹配启用的后端品类名称 }
                materialItemIds:
                    type: array
                    minItems: 1
                    maxItems: 200
                    description: 选中物料 id（正十进制 BIGINT 数字串）；服务端去重后按“物料 id + 数量”集合判重
                    items: { type: string, pattern: "^[0-9]+$" }
                quantities:
                    type: object
                    description: 数量分组（qty=true）选中项的数量表（物料 id → 1-99 整数）；缺省按 1；非数量分组携带非 1 数量将被拒绝
                    additionalProperties: { type: integer, minimum: 1, maximum: 99 }
                childCategory:
                    type: string
                    maxLength: 40
                    description: 品类子选 key（品类标记 childCategories 时必填，如跌倒开关的微动开关类型 kd-new-micro / kd-old-micro、旋转XK3 的焊线工艺 xk3-wire / xk3-plug）；该子品类完整物料目录并入校验范围

                remark:
                    type: string
                    maxLength: 500
                    description: 建档备注（trim 后存储）：物料构成之外的工艺差异（如“镀锡：触点是反的”），参与判重指纹——同构成不同备注 = 不同 BOM；缺省为空串

        InboundRow:
            type: object
            required: [no, bomCode, qty, date, time, inspector, status, version, createdAt]
            properties:
                no: { type: string }
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                time: { type: string }
                inspector: { type: string }
                remark: { type: string }
                status: { type: string, enum: [active, voided] }
                version: { type: integer, minimum: 1 }
                createdAt: { type: string, format: date-time }
                updatedBy: { type: string }
                updatedAt: { type: string, format: date-time }

        CreateInboundInput:
            type: object
            additionalProperties: false
            required: [bomCode, qty, date, remark]
            properties:
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                remark: { type: string, maxLength: 500 }

        UpdateInboundInput:
            type: object
            additionalProperties: false
            required: [expectedVersion, bomCode, qty, date, remark, reason]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                remark: { type: string, maxLength: 500 }
                reason: { type: string, minLength: 2, maxLength: 500 }

        VoidResourceInput:
            type: object
            additionalProperties: false
            required: [expectedVersion, reason]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 2, maxLength: 500 }

        StockAdjustmentRow:
            type: object
            required: [no, bomCode, qtyDelta, date, time, operator, reason]
            properties:
                no: { type: string }
                bomCode: { type: string }
                qtyDelta: { type: integer, not: { const: 0 } }
                date: { type: string, format: date }
                time: { type: string }
                operator: { type: string }
                reason: { type: string }
                relatedInboundNo: { type: string }

        CreateStockAdjustmentInput:
            type: object
            additionalProperties: false
            required: [bomCode, qtyDelta, date, reason]
            properties:
                bomCode: { type: string }
                qtyDelta: { type: integer, not: { const: 0 } }
                date: { type: string, format: date }
                reason: { type: string, minLength: 2, maxLength: 500 }
                relatedInboundNo: { type: string }

        OutboundRow:
            type: object
            required: [no, orderNo, customer, customerCode, bomCode, qty, date, time, operator, state, version]
            properties:
                no: { type: string }
                orderNo: { type: string }
                customer: { type: string }
                customerCode: { type: string }
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                time: { type: string }
                operator: { type: string }
                remark: { type: string }
                state: { type: string, enum: [registered, voided] }
                version: { type: integer, minimum: 1 }
                voidReason: { type: string }

        CreateOutboundInput:
            type: object
            additionalProperties: false
            required: [orderNo, qty, date, remark]
            properties:
                orderNo: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                remark: { type: string, maxLength: 500 }

        CreateUserInput:
            type: object
            additionalProperties: false
            required: [name, account, role]
            properties:
                name: { type: string, minLength: 1, maxLength: 20 }
                account: { type: string, pattern: "^[A-Za-z0-9_]{3,64}$" }
                role: { $ref: "#/components/schemas/CreateRoleId" }

        UpdateUserInput:
            type: object
            additionalProperties: false
            required: [expectedVersion, name, role]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                name: { type: string, minLength: 1, maxLength: 20 }
                role: { $ref: "#/components/schemas/RoleId" }
                replacementOwnerAccount: { type: string, description: 销售离岗且仍有客户时必填 }
                transferReason: { type: string, minLength: 2, maxLength: 500 }

        SetUserStatusInput:
            type: object
            additionalProperties: false
            required: [expectedVersion, active]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                active: { type: boolean }
                replacementOwnerAccount: { type: string, description: 停用销售且仍有客户时必填 }
                transferReason: { type: string, minLength: 2, maxLength: 500 }

        ResetUserPasswordInput:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            properties:
                expectedVersion: { type: integer, minimum: 1 }

        LoginEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/LoginResult" }, message: { const: ok } }
        ProfileEnvelope:
            allOf:
