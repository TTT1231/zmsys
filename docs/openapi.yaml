openapi: 3.1.0
info:
    title: 众茂生产系统 API
    version: 0.2.0
    description: |
        后端实现基线。修改接口时必须同步 `src/api/types.ts`、`mocks/request/` 与本文件。

        ## 鉴权与授权
        - 登录以账号和密码换取 JWT。JWT 本身不存数据库，后端用密钥验证签名、有效期、签发者和受众。
        - JWT 至少包含 `sub`（用户 id 字符串）、`ver`（签发时的 token_version）、`iat`、`exp`、`jti`。
        - 除登录和幂等退出外，每次请求均按 `sub` 查询当前 `sys_user`，校验启用状态及 `ver=token_version`，并使用数据库中的当前角色和实时授权；不得信任旧角色 claim。
        - 改密、停用和角色变更会递增 token_version。改密成功后旧 JWT 立即失效，客户端清除 token 并重新登录。
        - 每个端点都校验其描述中的权限码；前端菜单和按钮隐藏不是安全边界。

        ## 数据一致性
        - 响应统一为 `{code, data, message}`；成功 `code=0`，失败 code 与 HTTP 4xx/5xx 一致。
        - 创建、取消、删除、作废、库存调整及打印类 POST 必须携带 `Idempotency-Key`。同一用户、操作和 key 的相同请求重放原成功响应；请求体不同返回 409。
        - 可变资源使用 `expectedVersion` 做乐观锁；版本或并发业务状态冲突返回 409。
        - 业务编码由后端通过 `biz_sequence` 事务取号，禁止使用 `MAX(code)+1`。
        - 库存 = 有效入库合计 + 库存调整合计 - 有效出库净额。出库登记、作废、打印与订单取消按固定顺序加行锁并在一个事务提交。
        - 业务日期使用 `yyyy-MM-dd`；系统时间使用带时区 ISO 8601，数据库保存 UTC。
        - 工作台数据由 `/workbench/overview` 聚合端点统一供给（订单/台账契约当前无分页，仍返回完整计算窗口）；后续启用服务端分页时，不能以分页局部数据在派生侧计算全局库存。
servers:
    - url: /api
      description: Vite 代理或 MSW
security:
    - bearerAuth: []

tags:
    - name: auth
      description: JWT 会话与个人资料
    - name: orders
      description: 销售订单、取消与删除
    - name: customers
      description: 客户档案与负责人候选
    - name: boms
      description: 成品/BOM 档案与后端规格目录
    - name: inbound
      description: 成品入库、当天修正和库存调整
    - name: outbound
      description: 出库登记、打印、作废与紧急撤销
    - name: users
      description: 系统用户与离岗移交
    - name: roles
      description: 固定角色、实时授权与授权日志
    - name: workbench
      description: 工作台经营总览聚合

paths:
    /auth/login:
        post:
            tags: [auth]
            operationId: login
            summary: 账号密码登录
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/LoginInput" }
            responses:
                "200":
                    description: 登录成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/LoginEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }

    /auth/logout:
        post:
            tags: [auth]
            operationId: logout
            summary: 幂等退出
            description: JWT 不在数据库保存；端点始终允许客户端完成本地 token 清理，即使 token 已过期也返回成功。
            security: []
            responses:
                "200": { $ref: "#/components/responses/SuccessWithoutData" }

    /auth/password:
        put:
            tags: [auth]
            operationId: changePassword
            summary: 自助修改密码
            description: 修改密码不是首次登录强制操作。服务端验证旧密码，更新强哈希并递增 token_version；成功后当前及其他旧 JWT 全部失效，用户重新登录。
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/ChangePasswordInput" }
            responses:
                "200": { $ref: "#/components/responses/SuccessWithoutData" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "401": { $ref: "#/components/responses/Unauthorized" }

    /auth/profile:
        get:
            tags: [auth]
            operationId: getProfile
            summary: 当前用户与实时角色授权
            description: 姓名、角色、状态等资料为管理员域，本人只读；修改姓名走用户管理接口 PUT /users/{account}。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ProfileEnvelope" }
                "401": { $ref: "#/components/responses/Unauthorized" }

    /orders:
        get:
            tags: [orders]
            operationId: listOrders
            summary: 销售订单列表
            description: 权限 `orders:view`。取消订单仍返回用于历史审计。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OrderListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [orders]
            operationId: createOrder
            summary: 新建销售订单
            description: 权限 `orders:create`。客户名称和 BOM 快照由服务端查询；订单号按 orderDate 每日事务取号。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateOrderInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OrderEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /orders/{orderNo}:
        put:
            tags: [orders]
            operationId: updateOrder
            summary: 修改销售订单
            description: 权限 `orders:edit`。未发货订单可改数量/交货日期/备注，新数量不得小于该订单有效出库净额；已发货（有效出库净额 > 0）订单数量与交货日期锁定，仅可修改备注；已取消/已归档订单不可修改。删除走专用端点 POST /orders/{orderNo}/delete，归档走 POST /orders/{orderNo}/archive。
            parameters:
                - $ref: "#/components/parameters/OrderNo"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateOrderInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OrderEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /orders/{orderNo}/cancel:
        post:
            tags: [orders]
            operationId: cancelOrder
            summary: 取消全部剩余未发数量
            description: 权限 `orders:cancel`。保留已打印发货数量；若存在已登记未打印的出库单，必须先作废。已全部发货的订单没有剩余量可取消。取消后不再参与欠量、合作状态或库存分配。
            parameters:
                - $ref: "#/components/parameters/OrderNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CancelOrderInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OrderEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /orders/{orderNo}/archive:
        post:
            tags: [orders]
            operationId: archiveOrder
            summary: 归档订单（终态）
            description: 受保护权限 `orders:archive`，仅 super。收尾已完成、部分发货或已取消的订单使其退出活跃视图：归档后订单从销售订单页移入归档订单页，仅供查询，不可修改/取消/删除，剩余欠量（若有）不再安排交付。未发货的 ACTIVE 订单不可归档（手误单走取消/删除）；存在已登记未打印的出库单必须先作废或打印。归档为最终终态，不可恢复；归档人、归档时间与备注（选填）随行落库并写 change_log ARCHIVE 事件与 op_log 供审计。幂等（Idempotency-Key）。
            parameters:
                - $ref: "#/components/parameters/OrderNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/ArchiveOrderInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OrderEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /orders/{orderNo}/delete:
        post:
            tags: [orders]
            operationId: deleteOrder
            summary: 删除完全未发货的销售订单
            description: 受保护权限 `orders:delete`，仅 super。用于清理手误创建的订单：累计已发必须为 0，且不得存在任何出库单（含已作废）引用该订单，否则返回 409。删除为物理移除：订单行与其变更日志同事务删除，`op_log` 记录删除事件与订单快照（含取消审计三要素与 BOM 冻结名称/规格，可独立还原删除前形态）；删除后订单不再出现在列表中。删除与取消、出库登记、打印竞争同一订单锁，先提交者生效。
            parameters:
                - $ref: "#/components/parameters/OrderNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/DeleteOrderInput" }
            responses:
                "200": { $ref: "#/components/responses/SuccessWithoutData" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /customers:
        get:
            tags: [customers]
            operationId: listCustomers
            summary: 客户档案列表
            description: 权限 `customers:view`，仅 super/admin/sales。手机号只返回掩码；合作状态按近 6 个日历月的活动订单派生。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/CustomerListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [customers]
            operationId: createCustomer
            summary: 新建客户档案
            description: 权限 `customers:create`。负责人必须是启用中的销售；客户编码全局事务取号。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateCustomerInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/CustomerEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /customers/{code}:
        put:
            tags: [customers]
            operationId: updateCustomer
            summary: 编辑客户档案
            description: 权限 `customers:edit`。客户不可删除；负责人变化写历史。phone 为空表示保留原号码。
            parameters:
                - $ref: "#/components/parameters/CustomerCode"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateCustomerInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/CustomerEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /customer-owner-options:
        get:
            tags: [customers]
            operationId: listCustomerOwnerOptions
            summary: 客户负责人候选
            description: 权限 `customers:view`。仅返回启用中销售与超级管理员的 name/account，不暴露用户管理信息。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/CustomerOwnerOptionListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /bom-categories:
        get:
            tags: [boms]
            operationId: listBomCategories
            summary: 后端权威 BOM 品类与物料目录
            description: 权限 `bom:view`。返回 7 品类及分区/分组/可选物料树；跌倒开关品类额外下发 childCategories 标记（须从列表品类中选一个已建 BOM 作为子件）；前端不得自行决定有效品类、目录结构或编码前缀。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BomCategoryListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /boms:
        get:
            tags: [boms]
            operationId: listBoms
            summary: BOM/成品档案列表
            description: 权限 `bom:view`。明细、modelCode 与摘要全部取自建档冻结快照，不依赖当前目录。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BomListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [boms]
            operationId: createBom
            summary: 新建唯一 BOM（品类 + 选中物料集合）
            description: 权限 `bom:create`。服务端按品类目录校验（ids 非空、去重、归属且品类/分区/分组/物料启用、单选组最多 1 项）；品类标记 childCategories 时 childCategory 必填（如跌倒开关选微动开关类型），该子品类的完整物料目录并入校验范围。规范化物料集合（BigInt 十进制、去重、数值升序 JSON）的 SHA-256 命中相同品类即 409 并返回已有 bomCode，输入顺序与重复 id 不影响指纹。同幂等键同请求摘要重放原成功响应，同键异内容 409。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateBomInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BomEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /boms/{code}/delete:
        post:
            tags: [boms]
            operationId: deleteBom
            summary: 删除未被引用的 BOM
            description: 受保护权限 `bom:delete`，仅 super。用于清理手误建档：不得被任何销售订单引用（含已取消订单），且不得存在入库或库存调整流水，否则返回 409。删除为物理移除：明细行与 BOM 行同事务删除，`op_log` 记录 delete_bom 事件与删除前档案快照；删除后档案不再出现在列表中。删除与订单新建、入库登记竞争同一 BOM 行锁，先提交者生效。BOM 建档后不可修改，无乐观锁版本，请求体为空。
            parameters:
                - $ref: "#/components/parameters/BomCode"
                - $ref: "#/components/parameters/IdempotencyKey"
            responses:
                "200": { $ref: "#/components/responses/SuccessWithoutData" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /bom-stocks:
        get:
            tags: [boms]
            operationId: listBomStocks
            summary: BOM 当前库存余量聚合
            description: 权限 `bom:view`。口径同 v_bom_stock：有效入库 + 库存调整 − 未作废出库；仅返回存在流水的 bomCode，无流水者由前端按 0 展示。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/BomStockEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /inbound:
        get:
            tags: [inbound]
            operationId: listInbound
            summary: 入库台账
            description: 权限 `inbound:view`。包含 active/voided，便于审计。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/InboundListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [inbound]
            operationId: createInbound
            summary: 检验入库登记
            description: 权限 `inbound:register`，默认 warehouse/super。登记人和创建时间取服务端鉴权上下文。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateInboundInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/InboundEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /inbound/{no}:
        put:
            tags: [inbound]
            operationId: updateInbound
            summary: 修正当天录入的入库
            description: 权限 `inbound:edit`，默认 warehouse/super。当天按 createdAt 的北京时间自然日判断，不按业务日期；原登记人和创建时间不变，before/after 与原因写不可变日志。
            parameters:
                - $ref: "#/components/parameters/InboundNo"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateInboundInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/InboundEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /inbound/{no}/void:
        post:
            tags: [inbound]
            operationId: voidInbound
            summary: 作废当天录入的入库
            description: 权限 `inbound:edit`，默认 warehouse/super。不是物理删除；作废后不计库存并写 before/after 审计日志。
            parameters:
                - $ref: "#/components/parameters/InboundNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/VoidResourceInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/InboundEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /stock-adjustments:
        get:
            tags: [inbound]
            operationId: listStockAdjustments
            summary: 不可变库存调整列表
            description: 权限 `inbound:view`。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/StockAdjustmentListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [inbound]
            operationId: createStockAdjustment
            summary: 新增跨日库存调整
            description: 受保护权限 `inbound:adjust`，仅 super。只能追加；负向调整后库存不得小于 0。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateStockAdjustmentInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/StockAdjustmentEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /outbound:
        get:
            tags: [outbound]
            operationId: listOutbound
            summary: 出库单列表
            description: 权限 `outbound:view`。返回 registered/printed/voided 单头；原数量事件和冲销事件不被改删。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OutboundListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [outbound]
            operationId: createOutbound
            summary: 登记发货
            description: 权限 `outbound:ship`，默认 warehouse/super。事务锁 BOM 和订单并重新计算可发量；创建 REGISTERED 单头及正向数量事件。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateOutboundInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OutboundEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /outbound/{no}/void:
        post:
            tags: [outbound]
            operationId: voidOutbound
            summary: 作废未打印出库
            description: 权限 `outbound:void`，默认 warehouse/super。仅 REGISTERED 可操作；追加等额负向冲销并恢复订单已发量和库存。
            parameters:
                - $ref: "#/components/parameters/OutboundNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/VoidResourceInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OutboundEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /outbound/{no}/print:
        post:
            tags: [outbound]
            operationId: printOutbound
            summary: 正式打印并安排发货
            description: 权限 `outbound:print`，默认 admin/super。首次打印把 REGISTERED 置为 PRINTED；重打生成下一打印版本且必须说明原因。订单后来取消剩余量不影响历史已打印出库的重打。打印就是系统正式放行点，不另设司机或签字确认状态。
            parameters:
                - $ref: "#/components/parameters/OutboundNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/PrintOutboundInput" }
            responses:
                "200":
                    description: 返回已落库的打印版本、出库状态及与服务端审计日志完全一致的文档快照；客户端只据此渲染。
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OutboundPrintEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /outbound/{no}/emergency-void:
        post:
            tags: [outbound]
            operationId: emergencyVoidOutbound
            summary: 紧急撤销已打印出库
            description: 受保护权限 `outbound:emergency-void`，仅 super。必须确认货物尚未离开且全部纸质单已作废；货物已离开后只能走销售退货。
            parameters:
                - $ref: "#/components/parameters/OutboundNo"
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/EmergencyVoidOutboundInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/OutboundEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /users:
        get:
            tags: [users]
            operationId: listUsers
            summary: 用户列表
            description: 受保护权限 `permissions:view`，仅 super。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/UserListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }
        post:
            tags: [users]
            operationId: createUser
            summary: 新增普通用户
            description: 受保护权限 `permissions:manage`，仅 super。初始密码为 123456 的强哈希；不得通过接口新增 super。
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateUserInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/UserEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "409": { $ref: "#/components/responses/Conflict" }

    /users/{account}:
        put:
            tags: [users]
            operationId: updateUser
            summary: 编辑用户姓名或角色
            description: 受保护权限 `permissions:manage`，仅 super。account 不可改；销售转岗且仍负责客户时，必须原子批量移交给另一名启用销售。
            parameters:
                - $ref: "#/components/parameters/Account"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateUserInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/UserEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /users/{account}/status:
        patch:
            tags: [users]
            operationId: setUserStatus
            summary: 启用或停用用户
            description: 受保护权限 `permissions:manage`，仅 super。super 不可停用；停用销售且仍负责客户时必须在同一事务移交。
            parameters:
                - $ref: "#/components/parameters/Account"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/SetUserStatusInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/UserEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /users/{account}/reset-password:
        post:
            tags: [users]
            operationId: resetUserPassword
            summary: 重置用户密码为初始密码
            description: 受保护权限 `permissions:manage`，仅 super。重置为初始密码 123456；递增 token_version 使该用户旧会话立即失效。super 不可重置。
            parameters:
                - $ref: "#/components/parameters/Account"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/ResetUserPasswordInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/UserEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /roles:
        get:
            tags: [roles]
            operationId: listRoles
            summary: 固定角色目录
            description: 受保护权限 `permissions:view`，仅 super。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/RoleListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /roles/grants:
        get:
            tags: [roles]
            operationId: listRoleGrants
            summary: 全量角色授权
            description: 受保护权限 `permissions:view`，仅 super。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/GrantMapEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /roles/grants/log:
        get:
            tags: [roles]
            operationId: listRoleGrantLogs
            summary: 授权变更日志
            description: 受保护权限 `permissions:view`，仅 super。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/GrantLogListEnvelope" }
                "403": { $ref: "#/components/responses/Forbidden" }

    /roles/{roleId}/grants:
        put:
            tags: [roles]
            operationId: updateRoleGrant
            summary: 原子替换单个角色授权
            description: 受保护权限 `permissions:manage`，仅 super。内置 super 授权不可改；动作必须同时包含父菜单与 view；受保护动作不可授予其他角色。
            parameters:
                - $ref: "#/components/parameters/RoleIdParam"
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/SaveRoleGrantInput" }
            responses:
                "200":
                    description: 成功；无变化保存不递增版本，但仍记录 no-op 安全事件。
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/RoleGrantEnvelope" }
                "400": { $ref: "#/components/responses/BadRequest" }
                "403": { $ref: "#/components/responses/Forbidden" }
                "404": { $ref: "#/components/responses/NotFound" }
                "409": { $ref: "#/components/responses/Conflict" }

    /workbench/overview:
        get:
            tags: [workbench]
            operationId: getWorkbenchOverview
            summary: 工作台经营总览聚合
            description: |
                登录即可访问（各角色公共首页）。返回工作台读模型：products 含 v_bom_stock
                实时库存，orders 的 shipped 为 v_order_outbound_qty 净额（无流水订单缺行按 0），
                movements 按业务日聚合有效入库与出库净额（含作废冲销）；库存调整计入库存
                但不出现在出入库趋势。周期汇总、交付风险、客户排行与趋势分桶由前端派生。
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/WorkbenchOverviewEnvelope" }
                "401": { $ref: "#/components/responses/Unauthorized" }

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    parameters:
        IdempotencyKey:
            name: Idempotency-Key
            in: header
            required: true
            description: 8–128 个可见 ASCII 字符；同一次逻辑请求的网络重试必须复用同一个值。
            schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[!-~]+$" }
        OrderNo:
            name: orderNo
            in: path
            required: true
            schema: { type: string, pattern: "^ZM[0-9]{6}[0-9]{3,}$" }
        BomCode:
            name: code
            in: path
            required: true
            schema: { type: string, pattern: "^ZM[A-Z0-9]{2,6}[0-9]{3,}$" }
        CustomerCode:
            name: code
            in: path
            required: true
            schema: { type: string, pattern: "^CUS-[0-9]{4,}$" }
        InboundNo:
            name: no
            in: path
            required: true
            schema: { type: string, pattern: "^RK[0-9]{6}[0-9]{2,}$" }
        OutboundNo:
            name: no
            in: path
            required: true
            schema: { type: string, pattern: "^CK[0-9]{6}[0-9]{2,}$" }
        Account:
            name: account
            in: path
            required: true
            schema: { type: string, pattern: "^[A-Za-z0-9_]{3,64}$" }
        RoleIdParam:
            name: roleId
            in: path
            required: true
            schema: { $ref: "#/components/schemas/RoleId" }

    responses:
        SuccessWithoutData:
            description: 成功
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/NullEnvelope" }
        BadRequest:
            description: 参数或业务格式校验失败
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        Unauthorized:
            description: JWT 缺失、无效、过期、版本失效或账号已停用
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        Forbidden:
            description: 当前实时角色授权不包含所需权限码
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        NotFound:
            description: 资源不存在
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        Conflict:
            description: expectedVersion 过期、状态竞争、幂等键冲突、库存变化或唯一约束冲突
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    schemas:
        Envelope:
            type: object
            required: [code, data, message]
            properties:
                code: { type: integer }
                data: true
                message: { type: string }

        ErrorEnvelope:
            type: object
            required: [code, data, message]
            properties:
                code: { type: integer, minimum: 400 }
                data: { type: "null" }
                message: { type: string }

        NullEnvelope:
            type: object
            required: [code, data, message]
            properties:
                code: { type: integer, const: 0 }
                data: { type: "null" }
                message: { type: string, const: ok }

        RoleId:
            type: string
            enum: [super, admin, warehouse, sales, staff]

        CreateRoleId:
            type: string
            enum: [admin, warehouse, sales, staff]

        WbUser:
            type: object
            required: [version, name, account, role, active, last, createdAt]
            properties:
                version: { type: integer, minimum: 1 }
                name: { type: string, minLength: 1, maxLength: 20 }
                account: { type: string, pattern: "^[A-Za-z0-9_]{3,64}$" }
                role: { $ref: "#/components/schemas/RoleId" }
                active: { type: boolean }
                last: { type: string, description: 最近登录展示值；从未登录为破折号 }
                createdAt: { type: string, format: date-time, description: 创建时间 }
                updatedAt:
                    type: string
                    format: date-time
                    description: 最近一次资料/状态/密码变更时间；从未变更为 NULL

        LoginInput:
            type: object
            additionalProperties: false
            required: [account, password]
            properties:
                account: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, format: password, minLength: 1, maxLength: 128 }

        ChangePasswordInput:
            type: object
            additionalProperties: false
            required: [oldPassword, newPassword]
            properties:
                oldPassword: { type: string, format: password, minLength: 1, maxLength: 128 }
                newPassword: { type: string, format: password, minLength: 6, maxLength: 128 }

        LoginResult:
            type: object
            required: [accessToken, user]
            properties:
                accessToken: { type: string }
                user: { $ref: "#/components/schemas/WbUser" }

        ProfileResult:
            type: object
            required: [user, grant]
            properties:
                user: { $ref: "#/components/schemas/WbUser" }
                grant: { $ref: "#/components/schemas/RoleGrant" }

        RoleDef:
            type: object
            required: [id, name]
            properties:
                id: { $ref: "#/components/schemas/RoleId" }
                name: { type: string }
                locked: { type: boolean }

        RoleGrant:
            type: object
            required: [version, menus, actions]
            properties:
                version: { type: integer, minimum: 1 }
                menus:
                    type: array
                    uniqueItems: true
                    items: { type: string }
                actions:
                    type: object
                    additionalProperties:
                        type: array
                        uniqueItems: true
                        items: { type: string }

        SaveRoleGrantInput:
            type: object
            additionalProperties: false
            required: [grant, expectedVersion, note]
            properties:
                grant: { $ref: "#/components/schemas/RoleGrant" }
                expectedVersion: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 500 }

        GrantLogEntry:
            type: object
            required: [time, user, text]
            properties:
                time: { type: string }
                user: { type: string }
                text: { type: string }

        Order:
            type: object
            required: [version, orderNo, customer, customerCode, bomCode, qty, outbound, orderDate, deliverDate, remark, lifecycleStatus]
            properties:
                version: { type: integer, minimum: 1 }
                orderNo: { type: string }
                customer: { type: string, description: 下单时客户名称快照 }
                customerCode: { type: string }
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                outbound: { type: integer, minimum: 0, description: 有效出库净额 }
                orderDate: { type: string, format: date }
                deliverDate: { type: string, format: date, description: 交货日期（单个日历日，排序/逾期口径） }
                remark: { type: string }
                lifecycleStatus: { type: string, enum: [active, cancelled, archived] }
                cancelledAt: { type: string, format: date-time, description: 实际取消过才返回（含取消后归档的订单） }
                cancelledBy: { type: string }
                cancelReason: { type: string }
                archivedAt: { type: string, format: date-time, description: 仅归档终态返回 }
                archivedBy: { type: string, description: 归档操作人姓名 }
                archiveReason: { type: string, description: 归档备注（选填） }

        CreateOrderInput:
            type: object
            additionalProperties: false
            required: [customerCode, bomCode, qty, deliverDate, orderDate, remark]
            properties:
                customerCode: { type: string }
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                deliverDate: { type: string, format: date }
                orderDate: { type: string, format: date }
                remark: { type: string, maxLength: 2000 }

        UpdateOrderInput:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            minProperties: 2
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                qty: { type: integer, minimum: 1 }
                deliverDate: { type: string, format: date }
                remark: { type: string, maxLength: 2000 }

        CancelOrderInput:
            type: object
            additionalProperties: false
            required: [expectedVersion, reason]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 2, maxLength: 500 }

        ArchiveOrderInput:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 500, description: 归档备注（选填） }

        DeleteOrderInput:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            properties:
                expectedVersion: { type: integer, minimum: 1 }

        Customer:
            type: object
            required: [version, code, name, contact, phone, province, city, district, town, address, cooperation, owner, ownerAccount, payTerms, created]
            properties:
                version: { type: integer, minimum: 1 }
                code: { type: string }
                name: { type: string, minLength: 4, maxLength: 80 }
                contact: { type: string, minLength: 1, maxLength: 32 }
                phone: { type: string, pattern: "^1[0-9]{2}\\*{4}[0-9]{4}$" }
                province: { type: string }
                city: { type: string }
                district: { type: string }
                town: { type: string }
                address: { type: string }
                cooperation: { type: string, enum: [合作中, 待跟进] }
                owner: { type: string }
                ownerAccount: { type: string }
                payTerms: { type: string }
                created: { type: string, format: date }

        CreateCustomerInput:
            type: object
            additionalProperties: false
            required: [name, contact, phone, province, city, district, town, address, ownerAccount, payTerms]
            properties:
                name: { type: string, minLength: 4, maxLength: 80 }
                contact: { type: string, minLength: 1, maxLength: 32, description: 客户方联系人姓名 }
                phone: { type: string, pattern: "^1[0-9]{10}$" }
                province: { type: string, maxLength: 64, description: 可空，未填写传空串 }
                city: { type: string, maxLength: 64, description: 可空，未填写传空串 }
                district: { type: string, maxLength: 64 }
                town: { type: string, maxLength: 96 }
                address: { type: string, maxLength: 300, description: 可空，未填写传空串 }
                ownerAccount: { type: string, description: 启用中的销售或超级管理员账号 }
                payTerms: { type: string, maxLength: 160 }

        UpdateCustomerInput:
            type: object
            additionalProperties: false
            required: [expectedVersion, name, contact, phone, province, city, district, town, address, ownerAccount, payTerms]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                name: { type: string, minLength: 4, maxLength: 80 }
                contact: { type: string, minLength: 1, maxLength: 32, description: 客户方联系人姓名 }
                phone: { type: string, pattern: "^(|1[0-9]{10})$", description: 空字符串表示不修改 }
                province: { type: string, maxLength: 64, description: 可空，未填写传空串 }
                city: { type: string, maxLength: 64, description: 可空，未填写传空串 }
                district: { type: string, maxLength: 64 }
                town: { type: string, maxLength: 96 }
                address: { type: string, maxLength: 300, description: 可空，未填写传空串 }
                ownerAccount: { type: string, description: 启用中的销售或超级管理员账号 }
                payTerms: { type: string, maxLength: 160 }

        CustomerOwnerOption:
            type: object
            required: [name, account]
            properties:
                name: { type: string }
                account: { type: string }

        BomCatalogNode:
            type: object
            required: [id, parentId, kind, name, key, multi, qty, items]
            description: 目录树节点；分区（section）为纯展示节点（不挂物料、不提供全选），分组（group）挂可选物料
            properties:
                id: { type: string }
                parentId: { type: [string, "null"] }
                kind: { type: string, enum: [section, group] }
                name: { type: string }
                key: { type: [string, "null"], description: 分组稳定标识（model 用于型号派生）；分区为 null }
                multi: { type: [boolean, "null"], description: 分组选择语义（false 单选 / true 多选）；分区为 null }
                qty: { type: [boolean, "null"], description: 分组数量语义（true 时选中项可携带 1-99 数量，如琴键开关的扣板/连锁片/静片/动片）；分区为 null }
                items:
                    type: array
                    description: 分区恒为空数组
                    items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }

        BomCategory:
            type: object
            required: [key, name, codePrefix, groups]
            properties:
                key: { type: string }
                name: { type: string }
                codePrefix: { type: string }
                seqWidth: { type: integer, minimum: 3, maximum: 8 }
                childCategories:
                    type: array
                    items: { type: string }
                    description: 标记该品类建档必须从列表品类中选择一个已建 BOM 作为子件（如跌倒开关嵌入微动开关）；普通品类无此字段
                groups: { type: array, items: { $ref: "#/components/schemas/BomCatalogNode" } }

        BomItemView:
            type: object
            required: [materialId, groupKey, groupName, name, quantity]
            description: 建档冻结明细，按 position 排序返回
            properties:
                materialId: { type: string }
                groupKey: { type: string }
                groupName: { type: string }
                name: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 99, description: 冻结数量（qty 分组 1-99，其余恒 1） }

        Bom:
            type: object
            required: [code, name, modelCode, items, spec, remark, created, unit]
            properties:
                code: { type: string }
                name: { type: string }
                modelCode: { type: string, description: model 组选中项名称（品类无 model 组时为空串） }
                items: { type: array, items: { $ref: "#/components/schemas/BomItemView" } }
                spec: { type: string, description: "摘要（“组名：物料名 ×N”以 “ · ” 连接，数量 1 省略 ×N）" }
                remark: { type: string, description: "建档备注（物料构成之外的工艺差异，参与判重指纹）；空串 = 无备注" }
                created: { type: string, format: date }
                unit: { type: string }

        CreateBomInput:
            type: object
            additionalProperties: false
            required: [name, materialItemIds]
            properties:
                name: { type: string, description: 必须匹配启用的后端品类名称 }
                materialItemIds:
                    type: array
                    minItems: 1
                    maxItems: 200
                    description: 选中物料 id（正十进制 BIGINT 数字串）；服务端去重后按“物料 id + 数量”集合判重
                    items: { type: string, pattern: "^[0-9]+$" }
                quantities:
                    type: object
                    description: 数量分组（qty=true）选中项的数量表（物料 id → 1-99 整数）；缺省按 1；非数量分组携带非 1 数量将被拒绝
                    additionalProperties: { type: integer, minimum: 1, maximum: 99 }
                childCategory:
                    type: string
                    maxLength: 40
                    description: 品类子选 key（品类标记 childCategories 时必填，如跌倒开关的微动开关类型 new-micro-switch / old-micro-switch）；该子品类完整物料目录并入校验范围

                remark:
                    type: string
                    maxLength: 500
                    description: 建档备注（trim 后存储）：物料构成之外的工艺差异（如“镀锡：触点是反的”），参与判重指纹——同构成不同备注 = 不同 BOM；缺省为空串

        InboundRow:
            type: object
            required: [no, bomCode, qty, date, time, inspector, status, version, createdAt]
            properties:
                no: { type: string }
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                time: { type: string }
                inspector: { type: string }
                remark: { type: string }
                status: { type: string, enum: [active, voided] }
                version: { type: integer, minimum: 1 }
                createdAt: { type: string, format: date-time }
                updatedBy: { type: string }
                updatedAt: { type: string, format: date-time }

        CreateInboundInput:
            type: object
            additionalProperties: false
            required: [bomCode, qty, date, remark]
            properties:
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                remark: { type: string, maxLength: 500 }

        UpdateInboundInput:
            type: object
            additionalProperties: false
            required: [expectedVersion, bomCode, qty, date, remark, reason]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                remark: { type: string, maxLength: 500 }
                reason: { type: string, minLength: 2, maxLength: 500 }

        VoidResourceInput:
            type: object
            additionalProperties: false
            required: [expectedVersion, reason]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 2, maxLength: 500 }

        StockAdjustmentRow:
            type: object
            required: [no, bomCode, qtyDelta, date, time, operator, reason]
            properties:
                no: { type: string }
                bomCode: { type: string }
                qtyDelta: { type: integer, not: { const: 0 } }
                date: { type: string, format: date }
                time: { type: string }
                operator: { type: string }
                reason: { type: string }
                relatedInboundNo: { type: string }

        CreateStockAdjustmentInput:
            type: object
            additionalProperties: false
            required: [bomCode, qtyDelta, date, reason]
            properties:
                bomCode: { type: string }
                qtyDelta: { type: integer, not: { const: 0 } }
                date: { type: string, format: date }
                reason: { type: string, minLength: 2, maxLength: 500 }
                relatedInboundNo: { type: string }

        OutboundRow:
            type: object
            required: [no, orderNo, customer, customerCode, bomCode, qty, date, time, operator, state, version, printVersion]
            properties:
                no: { type: string }
                orderNo: { type: string }
                customer: { type: string }
                customerCode: { type: string }
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                time: { type: string }
                operator: { type: string }
                remark: { type: string }
                state: { type: string, enum: [registered, printed, voided] }
                version: { type: integer, minimum: 1 }
                printVersion: { type: integer, minimum: 0 }
                voidReason: { type: string }

        CreateOutboundInput:
            type: object
            additionalProperties: false
            required: [orderNo, qty, date, remark]
            properties:
                orderNo: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                remark: { type: string, maxLength: 500 }

        PrintOutboundInput:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 500, description: 首次打印可空；重打至少 2 字 }

        EmergencyVoidOutboundInput:
            type: object
            additionalProperties: false
            required: [expectedVersion, reason, goodsNotDeparted, paperInvalidated]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 2, maxLength: 500 }
                goodsNotDeparted: { type: boolean, const: true }
                paperInvalidated: { type: boolean, const: true }

        OutboundPrintResult:
            type: object
            required: [outbound, printVersion, document]
            properties:
                outbound: { $ref: "#/components/schemas/OutboundRow" }
                printVersion: { type: integer, minimum: 1 }
                document: { $ref: "#/components/schemas/OutboundPrintDocument" }

        OutboundPrintDocument:
            type: object
            required: [no, printVersion, orderNo, customer, customerCode, bomCode, bomSpec, qty, date, operator, remark, printedBy, printedAt]
            properties:
                no: { type: string }
                printVersion: { type: integer, minimum: 1 }
                orderNo: { type: string }
                customer: { type: string }
                customerCode: { type: string }
                bomCode: { type: string }
                bomSpec: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                operator: { type: string, description: 出库登记人 }
                remark: { type: string }
                printedBy: { type: string }
                printedAt: { type: string, format: date-time }

        CreateUserInput:
            type: object
            additionalProperties: false
            required: [name, account, role]
            properties:
                name: { type: string, minLength: 1, maxLength: 20 }
                account: { type: string, pattern: "^[A-Za-z0-9_]{3,64}$" }
                role: { $ref: "#/components/schemas/CreateRoleId" }

        UpdateUserInput:
            type: object
            additionalProperties: false
            required: [expectedVersion, name, role]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                name: { type: string, minLength: 1, maxLength: 20 }
                role: { $ref: "#/components/schemas/RoleId" }
                replacementOwnerAccount: { type: string, description: 销售离岗且仍有客户时必填 }
                transferReason: { type: string, minLength: 2, maxLength: 500 }

        SetUserStatusInput:
            type: object
            additionalProperties: false
            required: [expectedVersion, active]
            properties:
                expectedVersion: { type: integer, minimum: 1 }
                active: { type: boolean }
                replacementOwnerAccount: { type: string, description: 停用销售且仍有客户时必填 }
                transferReason: { type: string, minLength: 2, maxLength: 500 }

        ResetUserPasswordInput:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            properties:
                expectedVersion: { type: integer, minimum: 1 }

        LoginEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/LoginResult" }, message: { const: ok } }
        ProfileEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/ProfileResult" }, message: { const: ok } }
        OrderEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/Order" }, message: { const: ok } }
        OrderListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/Order" } }, message: { const: ok } }
        CustomerEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/Customer" }, message: { const: ok } }
        CustomerListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/Customer" } }, message: { const: ok } }
        CustomerOwnerOptionListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/CustomerOwnerOption" } }, message: { const: ok } }
        BomEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/Bom" }, message: { const: ok } }
        BomListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/Bom" } }, message: { const: ok } }
        BomCategoryListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/BomCategory" } }, message: { const: ok } }
        BomStockEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/BomStockMap" }, message: { const: ok } }
        BomStockMap:
            type: object
            description: bomCode → 当前库存余量
            additionalProperties: { type: integer }
        InboundEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/InboundRow" }, message: { const: ok } }
        InboundListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/InboundRow" } }, message: { const: ok } }
        StockAdjustmentEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/StockAdjustmentRow" }, message: { const: ok } }
        StockAdjustmentListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/StockAdjustmentRow" } }, message: { const: ok } }
        OutboundEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/OutboundRow" }, message: { const: ok } }
        OutboundListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/OutboundRow" } }, message: { const: ok } }
        OutboundPrintEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/OutboundPrintResult" }, message: { const: ok } }
        UserEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/WbUser" }, message: { const: ok } }
        UserListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/WbUser" } }, message: { const: ok } }
        RoleListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/RoleDef" } }, message: { const: ok } }
        RoleGrantEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/RoleGrant" }, message: { const: ok } }
        GrantMapEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: object, additionalProperties: { $ref: "#/components/schemas/RoleGrant" } }, message: { const: ok } }
        GrantLogListEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { type: array, items: { $ref: "#/components/schemas/GrantLogEntry" } }, message: { const: ok } }
        WorkbenchOverviewEnvelope:
            allOf:
                - $ref: "#/components/schemas/Envelope"
                - type: object
                  properties: { code: { const: 0 }, data: { $ref: "#/components/schemas/WorkbenchData" }, message: { const: ok } }
        WorkbenchData:
            type: object
            required: [asOf, unit, products, orders, movements]
            properties:
                asOf: { type: string, format: date, description: 业务截至日（北京日） }
                unit: { type: string, description: 全部 BOM 单位一致时取该值，混合时为“多单位” }
                products: { type: array, items: { $ref: "#/components/schemas/WorkbenchProduct" } }
                orders: { type: array, items: { $ref: "#/components/schemas/WorkbenchOrder" } }
                movements: { type: array, items: { $ref: "#/components/schemas/WorkbenchMovement" } }
        WorkbenchProduct:
            type: object
            required: [code, category, model, spec, unit, stock]
            properties:
                code: { type: string }
                category: { type: string }
                model: { type: string, description: 型号组选中项（建档冻结快照，无则空串） }
                spec: { type: string, description: “组名：物料名 ×N” 摘要，按冻结 position 排序 }
                unit: { type: string }
                stock: { type: integer, description: v_bom_stock 口径，无流水 BOM 为 0 }
        WorkbenchOrder:
            type: object
            required: [no, customerCode, customer, bomCode, date, due, qty, shipped]
            properties:
                no: { type: string }
                customerCode: { type: string }
                customer: { type: string }
                bomCode: { type: string }
                date: { type: string, format: date, description: 下单日期 }
                due: { type: string, format: date, description: 交货日期 }
                qty: { type: integer, minimum: 1 }
                shipped: { type: integer, minimum: 0, description: 有效出库净额（v_order_outbound_qty） }
                cancelled: { type: boolean, description: 仅已取消订单携带 }
        WorkbenchMovement:
            type: object
            required: [date, bomCode, inbound, outbound]
            properties:
                date: { type: string, format: date, description: 业务日期 }
                bomCode: { type: string }
                inbound: { type: integer, minimum: 0, description: 有效检验入库合计 }
                outbound: { type: integer, description: 出库净额（含作废冲销，跨日冲销当天可能为负） }
