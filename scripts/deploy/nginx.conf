# 前端容器 nginx 配置：托管 Vite 构建产物，/api 反代到 compose 里的 backend 服务。
# backend 是 docker-compose 服务名，仅在 compose 网络内可解析，不要单独 docker run 此镜像。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # vite 产物文件名带内容 hash，可永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 每次回源校验：发版后用户 F5/导航即拿新页面（配合前端 VersionCheck 检测）；
    # location / 的 try_files 回退到 /index.html 会内部重定向到此精确匹配，SPA 路由同样生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 与 dev 下 vite proxy 行为一致：/api 前缀原样转发（后端路由自带 /api 前缀）。
    # 备份/恢复大文件：总请求体 513m = 512MiB 文件 + multipart 字段/边界余量，
    # 后端文件上限仍为 512MiB；流式备份/完整预检/断点轮询放宽读写超时
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 513m;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # SPA history 路由：静态文件不存在的路径一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
