# 一条命令起全套:docker compose up -d --build
# 浏览器访问 http://<服务器IP> 即可:前端 80 端口,/api 由 nginx 反代到 backend,同域无跨域。
#
# 凭据(ZM_DB_ROOT_PASSWORD / ZM_DB_PASSWORD / JWT_SECRET)从本目录 .env 读取,
# 不落仓库;首次部署在服务器上用 openssl rand 生成后写入。
services:
  frontend:
    build: .
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ../zmsys-backend
      # 腾讯云内网 npm 镜像加速依赖安装,异地构建可用 --build-arg 覆盖回官方源
      args:
        NPM_REGISTRY: https://mirrors.cloud.tencent.com/npm/
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5000"
      # 环境变量名对齐 prisma7.config.ts / src/configuration 实际读取的 DB_USERNAME、DB_DATABASE
      DB_HOST: db
      DB_PORT: "3306"
      DB_USERNAME: zm
      DB_PASSWORD: ${ZM_DB_PASSWORD}
      DB_DATABASE: zmdb
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      JWT_ISSUER: zmsys-backend
      JWT_AUDIENCE: zmsys-admin
      SNOWFLAKE_WORKER_ID: "1"
      # 同域反代下浏览器同源请求也会带 Origin 头,把站点 origin 加入白名单
      CORS_ORIGINS: http://123.206.117.152
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${ZM_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: zmdb
      MYSQL_USER: zm
      MYSQL_PASSWORD: ${ZM_DB_PASSWORD}
    # 库表用 utf8mb4;表结构由 backend 启动时的 prisma migrate deploy 从空库建起
    #(不挂 initdb.d 基线 SQL:迁移链已完整,基线建表反而会与之冲突)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  mysql-data:
