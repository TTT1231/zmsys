openapi: 3.1.0
info:
    title: 智造管理系统 API
    version: 0.1.0
    description: |
        前后端对接契约。与以下三处保持一致，修改时须同步：
        - TS 类型：`src/api/types.ts`（契约类型中心）
        - Mock 实现：`src/mocks/request/`（可执行契约，MSW handlers）

        ## 全局约定
        - **统一响应信封**：`{code, data, message}`；`code=0` 成功，非 0 业务失败（与 HTTP 状态码一致，业务错误用 4xx）。
        - **鉴权**：除 `POST /auth/login` 外全部需要 `Authorization: Bearer <accessToken>`；token 失效返回 401（登录失败用 400，避免与 401 混淆）。
        - **业务编码即 key**（db-scheme.md）：订单用 `order_no`、客户用 `customer_code`、BOM 用 `bom_code`、台账用 `no`、用户用 `account`；雪花 id 不出后端；`account` 创建后不可改。
        - **库存无独立端点**：`stock = Σ入库 − Σ出库`，由前端基于两本台账推导；后端出库时按交期顺序做可发量校验。
        - **统计前端算**：工作台派生视图（待发货/缺口/趋势/TOP 客户）由前端基于各资源数据计算，后端只提供基础 CRUD。
        - 日期均为 `yyyy-MM-dd`，时间 `HH:mm`（本地时区）。
servers:
    - url: /api
      description: 开发环境（Vite 代理 / MSW 拦截）
security:
    - bearerAuth: []

tags:
    - name: auth
    - name: orders
    - name: customers
    - name: boms
    - name: inbound
    - name: outbound
    - name: users
    - name: roles
    - name: system

paths:
    /auth/login:
        post:
            tags: [auth]
            summary: 登录（无需鉴权）
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/LoginInput" }
            responses:
                "200":
                    description: 登录成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  accessToken: { type: string }
                                                  user: { $ref: "#/components/schemas/WbUser" }
                "400":
                    description: 账号或密码错误 / 账号被停用
                    content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }

    /auth/logout:
        post:
            tags: [auth]
            summary: 登出（客户端清除 token）
            responses:
                "200":
                    description: 成功
                    content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }

    /auth/profile:
        get:
            tags: [auth]
            summary: 当前登录用户信息 + 角色授权
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/ProfileResult" }
                "401":
                    description: token 失效
                    content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }
        put:
            tags: [auth]
            summary: 个人中心：更新自己的姓名
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name]
                            properties:
                                name: { type: string, description: 新姓名（1-20 字符）, example: 张三 }
            responses:
                "200":
                    description: 成功（返回脱敏后的用户信息）
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/WbUser" }
                "400":
                    description: 姓名为空 / 超过 20 字符
                    content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }
                "401":
                    description: token 失效
                    content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }

    /orders:
        get:
            tags: [orders]
            summary: 销售订单列表
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/Order" } }
        post:
            tags: [orders]
            summary: 新建销售订单（order_no 由服务端生成）
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateOrderInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/Order" }

    /orders/{orderNo}:
        put:
            tags: [orders]
            summary: 修改订单（改数量必须附 ≥4 字理由）
            parameters:
                - name: orderNo
                  in: path
                  required: true
                  schema: { type: string }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateOrderInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/Order" }
                "400":
                    description: 校验失败（如理由不足 4 字）
                    content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }

    /customers:
        get:
            tags: [customers]
            summary: 客户列表
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        post:
            tags: [customers]
            summary: 新建客户（customer_code 服务端生成；phone 为完整号码，掩码展示由服务端生成）
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateCustomerInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/Customer" }

    /boms:
        get:
            tags: [boms]
            summary: BOM 列表
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/Bom" } }
        post:
            tags: [boms]
            summary: 新建 BOM（bom_code 按 ZM+品类码及品类序号宽度生成；品类模板由前端常量维护）
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateBomInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/Bom" }

    /inbound:
        get:
            tags: [inbound]
            summary: 入库台账（只增不改）
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/InboundRow" } }
        post:
            tags: [inbound]
            summary: 检验入库登记
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateInboundInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/InboundRow" }
                "400":
                    description: 校验失败（成品不存在 / 数量非法）

    /outbound:
        get:
            tags: [outbound]
            summary: 出库台账（只增不改）
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/OutboundRow" } }
        post:
            tags: [outbound]
            summary: 登记发货（超出可发库存被拦截）
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateOutboundInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/OutboundRow" }
                "400":
                    description: 校验失败（可发库存已变化等）

    /users:
        get:
            tags: [users]
            summary: 用户列表
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/WbUser" } }
        post:
            tags: [users]
            summary: 新增用户（初始密码 123456，首次登录改密）
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateUserInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/WbUser" }
                "400":
                    description: 账号已存在 / 账号格式不合法（字母数字下划线 ≥3 位）

    /users/{account}:
        put:
            tags: [users]
            summary: 编辑用户（account 不可改；super 角色不可变更）
            parameters:
                - name: account
                  in: path
                  required: true
                  schema: { type: string }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateUserInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/WbUser" }

    /users/{account}/status:
        patch:
            tags: [users]
            summary: 启用 / 停用用户（停用不删除；super 不可停用）
            parameters:
                - name: account
                  in: path
                  required: true
                  schema: { type: string }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [active]
                            properties:
                                active: { type: boolean }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/WbUser" }

    /roles:
        get:
            tags: [roles]
            summary: 角色定义（含内置标记）
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/RoleDef" } }

    /roles/grants:
        get:
            tags: [roles]
            summary: 全量角色授权（权限矩阵 / 角色编辑页聚合读取）
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              additionalProperties: { $ref: "#/components/schemas/RoleGrant" }

    /roles/grants/log:
        get:
            tags: [roles]
            summary: 授权变更日志
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/GrantLogEntry" } }

    /roles/{roleId}/grants:
        put:
            tags: [roles]
            summary: 保存单角色授权（super 内置角色不可改）
            parameters:
                - name: roleId
                  in: path
                  required: true
                  schema: { $ref: "#/components/schemas/RoleId" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [grant]
                            properties:
                                grant: { $ref: "#/components/schemas/RoleGrant" }
                                note:
                                    type: string
                                    description: 变更说明（前端 diff 生成），服务端记入授权日志
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/RoleGrant" }
                "403":
                    description: 超级管理员为内置角色，授权不可修改

    /system-events:
        get:
            tags: [system]
            summary: 系统事件列表
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/SystemEvent" } }

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer

    schemas:
        Envelope:
            type: object
            required: [code, data, message]
            properties:
                code: { type: integer, description: 0 成功，非 0 失败 }
                message: { type: string }
                data: {}

        RoleId:
            type: string
            enum: [super, admin, warehouse, sales, staff]

        RoleDef:
            type: object
            properties:
                id: { $ref: "#/components/schemas/RoleId" }
                name: { type: string, example: 仓管 }
                locked:
                    type: boolean
                    description: 内置角色（super），授权不可编辑

        RoleGrant:
            type: object
            description: 一个角色的授权（对应 sys_grant 按 role 下发的行集）
            required: [menus, actions]
            properties:
                menus:
                    type: array
                    items: { type: string }
                    description: 可见菜单 key（含子菜单 key）
                actions:
                    type: object
                    additionalProperties:
                        type: array
                        items: { type: string }
                    description: 菜单 → 动作 id 列表（如 outbound → [view, ship]）

        GrantLogEntry:
            type: object
            properties:
                time: { type: string, example: "09-08 20:01" }
                user: { type: string }
                text: { type: string }

        LoginInput:
            type: object
            required: [account, password]
            properties:
                account: { type: string, example: li_xiaomei }
                password: { type: string, format: password }

        ProfileResult:
            type: object
            properties:
                user: { $ref: "#/components/schemas/WbUser" }
                grant: { $ref: "#/components/schemas/RoleGrant" }

        WbUser:
            type: object
            description: 用户（对应 sys_user；不含密码）
            properties:
                id: { type: integer, description: 演示用自增；真实后端不出雪花 id }
                name: { type: string }
                account: { type: string }
                role: { $ref: "#/components/schemas/RoleId" }
                active: { type: boolean }
                last: { type: string, example: "09-08 20:01", description: 最近登录 }

        Order:
            type: object
            properties:
                orderNo: { type: string, example: ZM260903086 }
                customer: { type: string }
                customerCode: { type: string }
                bomCode: { type: string }
                qty: { type: integer }
                outbound: { type: integer, description: 累计已出库数量 }
                orderDate: { type: string, format: date }
                deliverStart: { type: string, format: date, description: 交货起始日期 }
                deliverEnd: { type: string, format: date, description: 交货截止日期（排序/逾期口径） }
                remark: { type: string }

        CreateOrderInput:
            type: object
            required: [customerCode, customer, bomCode, qty, deliverStart, deliverEnd, orderDate]
            properties:
                customerCode: { type: string }
                customer: { type: string }
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                deliverStart: { type: string, format: date }
                deliverEnd: { type: string, format: date }
                orderDate: { type: string, format: date }
                remark: { type: string }

        UpdateOrderInput:
            type: object
            properties:
                qty: { type: integer, minimum: 1 }
                deliverStart: { type: string, format: date }
                deliverEnd: { type: string, format: date }
                remark: { type: string }
                reason: { type: string, description: 修改数量时必填，≥4 字 }

        Customer:
            type: object
            properties:
                code: { type: string, example: CUS-1024 }
                name: { type: string }
                contact: { type: string }
                phone: { type: string, example: "138****6821", description: 掩码展示 }
                phoneFull: { type: string, description: 完整号码（有权限可见） }
                region: { type: string, example: 华东 }
                city: { type: string }
                address: { type: string }
                status: { type: string, enum: [合作中, 待跟进] }
                owner: { type: string, description: 所属销售 }
                payTerms: { type: string, example: 月结 30 天 }
                created: { type: string, format: date }

        CreateCustomerInput:
            type: object
            required: [name, contact, phone, region, address]
            properties:
                name: { type: string, minLength: 4 }
                contact: { type: string }
                phone: { type: string, pattern: "^1\\d{10}$" }
                region: { type: string }
                address: { type: string }
                remark: { type: string }

        Bom:
            type: object
            properties:
                code: { type: string, example: ZMXK2001 }
                name: { type: string, example: 旋转开关, description: 品类 }
                modelCode: { type: string, example: 2-1 }
                specs:
                    type: object
                    additionalProperties: { type: string }
                    description: 品类规格键值对（对应库表 spec JSON）
                spec: { type: string, description: 规格摘要（列表/搜索用） }
                created: { type: string, format: date }
                unit: { type: string, example: 个 }

        CreateBomInput:
            type: object
            required: [name, modelCode, specs]
            properties:
                name: { type: string, description: 品类名，须在前端品类模板中存在 }
                modelCode: { type: string }
                specs:
                    type: object
                    additionalProperties: { type: string }

        InboundRow:
            type: object
            properties:
                no: { type: string, example: RK-20260908-0025 }
                bomCode: { type: string }
                qty: { type: integer }
                date: { type: string, format: date }
                time: { type: string, example: "10:40" }
                inspector: { type: string, description: 检验登记人姓名 }
                remark: { type: string }

        CreateInboundInput:
            type: object
            required: [bomCode, qty, date, inspector]
            properties:
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                inspector: { type: string }
                remark: { type: string }

        OutboundRow:
            type: object
            properties:
                no: { type: string, example: CK-20260908-0019 }
                orderNo: { type: string }
                customer: { type: string }
                customerCode: { type: string }
                bomCode: { type: string }
                qty: { type: integer }
                date: { type: string, format: date }
                time: { type: string }
                operator: { type: string }
                remark: { type: string }

        CreateOutboundInput:
            type: object
            required: [orderNo, qty, date, operator]
            properties:
                orderNo: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                operator: { type: string }
                remark: { type: string }

        CreateUserInput:
            type: object
            required: [name, account, role]
            properties:
                name: { type: string }
                account: { type: string, pattern: "^[A-Za-z0-9_]{3,}$" }
                role: { $ref: "#/components/schemas/RoleId" }

        UpdateUserInput:
            type: object
            required: [name, role]
            properties:
                name: { type: string }
                role: { $ref: "#/components/schemas/RoleId" }

        SystemEvent:
            type: object
            properties:
                level: { type: string, example: 高优先级 }
                levelTone: { type: string, enum: [danger, warning, info, neutral] }
                module: { type: string }
                item: { type: string }
                ref: { type: string }
                found: { type: string, example: "09-05 10:12" }
                state: { type: string }
                open: { type: boolean }
