openapi: 3.1.0
info:
    title: 智造管理系统 API
    version: 0.1.0
    description: |
        前后端对接契约。与以下三处保持一致，修改时须同步：
        - TS 类型：`src/api/types.ts`（契约类型中心）
        - Mock 实现：`src/mocks/request/`（可执行契约，MSW handlers）

        ## 全局约定
        - **统一响应信封**：`{code, data, message}`；`code=0` 成功，非 0 业务失败（与 HTTP 状态码一致，业务错误用 4xx）。
        - **鉴权**：除 `POST /auth/login` 外全部需要 `Authorization: Bearer <accessToken>`；token 失效返回 401（登录失败用 400，避免与 401 混淆）。JWT 只携带身份（userId + 角色），权限实时查 sys_grant。
        - **写操作按权限码校验 403**（各端点 description 标注 required 权限码）；**GET 端点登录即可读**（view 权限仅控制前端菜单可见性）。勾选菜单授权即蕴含其 view 动作。
        - **业务编码即 key**（db-scheme.md）：订单用 `order_no`、客户用 `customer_code`、BOM 用 `bom_code`、台账用 `no`、用户用 `account`；雪花 id 不出后端；`account` 创建后不可改。
        - **库存无独立端点**：`stock = Σ入库 − Σ出库`，由前端基于两本台账推导；后端出库时按交期顺序做可发量校验（事务内完成，防并发超卖）。
        - **统计前端算**：工作台派生视图（待发货/缺口/趋势/TOP 客户）由前端基于各资源数据计算，后端只提供基础 CRUD。
        - **操作留痕**：仅三种写操作记 op_log——登记发货、新建客户、新建销售订单（见 db-scheme §2.4）；权限变更记 sys_grant_log（§2.3）。
        - 日期均为 `yyyy-MM-dd`，时间 `HH:mm`（本地时区）。
servers:
    - url: /api
      description: 开发环境（Vite 代理 / MSW 拦截）
security:
    - bearerAuth: []

tags:
    - name: auth
    - name: orders
    - name: customers
    - name: boms
    - name: inbound
    - name: outbound
    - name: users
    - name: roles

paths:
    /auth/login:
        post:
            tags: [auth]
            summary: 登录（无需鉴权）
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/LoginInput" }
            responses:
                "200":
                    description: 登录成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  accessToken: { type: string }
                                                  user: { $ref: "#/components/schemas/WbUser" }
                "400":
                    description: 账号或密码错误 / 账号被停用
                    content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }

    /auth/logout:
        post:
            tags: [auth]
            summary: 登出（客户端清除 token）
            responses:
                "200":
                    description: 成功
                    content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }

    /auth/password:
        put:
            tags: [auth]
            summary: 修改自己的密码（不强制；初始密码 123456 建议尽快修改）
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [oldPassword, newPassword]
                            properties:
                                oldPassword: { type: string, format: password }
                                newPassword: { type: string, format: password, minLength: 6, description: 新密码（≥6 位） }
            responses:
                "200":
                    description: 成功（修改后当前 token 保持有效，用户可继续使用）
                    content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }
                "400":
                    description: 旧密码错误 / 新密码短于 6 位

    /auth/profile:
        get:
            tags: [auth]
            summary: 当前登录用户信息 + 角色授权
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/ProfileResult" }
                "401":
                    description: token 失效
                    content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }
        put:
            tags: [auth]
            summary: 个人中心：更新自己的姓名
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name]
                            properties:
                                name: { type: string, description: 新姓名（1-20 字符）, example: 张三 }
            responses:
                "200":
                    description: 成功（返回脱敏后的用户信息）
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/WbUser" }
                "400":
                    description: 姓名为空 / 超过 20 字符
                    content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }
                "401":
                    description: token 失效
                    content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }

    /orders:
        get:
            tags: [orders]
            summary: 销售订单列表
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/Order" } }
        post:
            tags: [orders]
            summary: 新建销售订单（order_no 由服务端生成；记 op_log）
            description: '**required 权限**：`orders:create`（默认 admin / sales）。校验 customerCode、bomCode 存在，deliverEnd ≥ deliverStart。'
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateOrderInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/Order" }
                "400":
                    description: 校验失败（客户或成品不存在 / 交货截止早于起始 / 数量非法）

    /orders/{orderNo}:
        put:
            tags: [orders]
            summary: 修改订单（订单不可删除；新数量必须 ≥ 累计已发）
            description: '**required 权限**：`orders:edit`（默认 admin / sales）。'
            parameters:
                - name: orderNo
                  in: path
                  required: true
                  schema: { type: string }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateOrderInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/Order" }
                "400":
                    description: 校验失败（新数量低于累计已发 / 交货截止早于起始 / 数量非法）
                    content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }

    /customers:
        get:
            tags: [customers]
            summary: 客户列表（cooperation 由服务端聚合派生：近 6 个月有订单 = 合作中）
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        post:
            tags: [customers]
            summary: 新建客户（customer_code 服务端生成；phone 为完整号码，掩码由服务端生成；记 op_log）
            description: '**required 权限**：`customers:create`（默认 admin / sales）。'
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateCustomerInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/Customer" }
                "400":
                    description: 校验失败（名称少于 4 字 / 手机号格式错 / 负责人不存在或非销售角色）

    /customers/{code}:
        put:
            tags: [customers]
            summary: 编辑客户档案（联系人/电话/行政区划/详细地址/付款条件/负责人；客户不可删除）
            description: '**required 权限**：`customers:create`（与新建同权，默认 admin / sales）。'
            parameters:
                - name: code
                  in: path
                  required: true
                  schema: { type: string, description: customer_code }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateCustomerInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/Customer" }
                "400":
                    description: 校验失败（同新建）
                "404":
                    description: 客户不存在

    /boms:
        get:
            tags: [boms]
            summary: BOM 列表
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/Bom" } }
        post:
            tags: [boms]
            summary: 新建 BOM（bom_code 按 ZM+品类码及品类序号宽度生成；品类模板由前端常量维护，必填项不作服务端强校验）
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateBomInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/Bom" }
                "400":
                    description: 校验失败（品类不存在 / 型号或规格为空）

    /inbound:
        get:
            tags: [inbound]
            summary: 入库台账（只增不改）
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/InboundRow" } }
        post:
            tags: [inbound]
            summary: 检验入库登记（登记人取当前登录用户，不经请求体）
            description: '**required 权限**：`inbound:register`（默认 warehouse；super 全量）。'
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateInboundInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/InboundRow" }
                "400":
                    description: 校验失败（成品不存在 / 数量非法）

    /outbound:
        get:
            tags: [outbound]
            summary: 出库台账（只增不改）
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/OutboundRow" } }
        post:
            tags: [outbound]
            summary: 登记发货（超出可发库存被拦截；操作人取当前登录用户；记 op_log）
            description: '**required 权限**：`outbound:ship`（默认 warehouse；super 全量）。'
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateOutboundInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/OutboundRow" }
                "400":
                    description: 校验失败（可发库存已变化等）

    /users:
        get:
            tags: [users]
            summary: 用户列表
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/WbUser" } }
        post:
            tags: [users]
            summary: 新增用户（初始密码统一 123456）
            description: '**required 权限**：`permissions:manage`（默认 super）。'
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateUserInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/WbUser" }
                "400":
                    description: 账号已存在 / 账号格式不合法（字母数字下划线 ≥3 位）

    /users/{account}:
        put:
            tags: [users]
            summary: 编辑用户（account 不可改；super 角色不可变更）
            description: '**required 权限**：`permissions:manage`（默认 super）。'
            parameters:
                - name: account
                  in: path
                  required: true
                  schema: { type: string }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/UpdateUserInput" }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/WbUser" }

    /users/{account}/status:
        patch:
            tags: [users]
            summary: 启用 / 停用用户（停用不删除；super 不可停用）
            description: '**required 权限**：`permissions:manage`（默认 super）。'
            parameters:
                - name: account
                  in: path
                  required: true
                  schema: { type: string }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [active]
                            properties:
                                active: { type: boolean }
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/WbUser" }

    /roles:
        get:
            tags: [roles]
            summary: 角色定义（含内置标记）
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/RoleDef" } }

    /roles/grants:
        get:
            tags: [roles]
            summary: 全量角色授权（权限矩阵 / 角色编辑页聚合读取）
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              additionalProperties: { $ref: "#/components/schemas/RoleGrant" }

    /roles/grants/log:
        get:
            tags: [roles]
            summary: 授权变更日志
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: "#/components/schemas/GrantLogEntry" } }

    /roles/{roleId}/grants:
        put:
            tags: [roles]
            summary: 保存单角色授权（super 内置角色不可改；写 sys_grant_log）
            description: '**required 权限**：`permissions:manage`（默认 super）。'
            parameters:
                - name: roleId
                  in: path
                  required: true
                  schema: { $ref: "#/components/schemas/RoleId" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [grant]
                            properties:
                                grant: { $ref: "#/components/schemas/RoleGrant" }
                                note:
                                    type: string
                                    description: 变更说明（前端 diff 生成），服务端记入授权日志
            responses:
                "200":
                    description: 成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/Envelope"
                                    - type: object
                                      properties:
                                          data: { $ref: "#/components/schemas/RoleGrant" }
                "403":
                    description: 超级管理员为内置角色，授权不可修改

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer

    schemas:
        Envelope:
            type: object
            required: [code, data, message]
            properties:
                code: { type: integer, description: 0 成功，非 0 失败 }
                message: { type: string }
                data: {}

        RoleId:
            type: string
            enum: [super, admin, warehouse, sales, staff]

        RoleDef:
            type: object
            properties:
                id: { $ref: "#/components/schemas/RoleId" }
                name: { type: string, example: 仓管 }
                locked:
                    type: boolean
                    description: 内置角色（super），授权不可编辑

        RoleGrant:
            type: object
            description: 一个角色的授权（对应 sys_grant 按 role 下发的行集）
            required: [menus, actions]
            properties:
                menus:
                    type: array
                    items: { type: string }
                    description: 可见菜单 key（含子菜单 key）
                actions:
                    type: object
                    additionalProperties:
                        type: array
                        items: { type: string }
                    description: 菜单 → 动作 id 列表（如 outbound → [view, ship]）

        GrantLogEntry:
            type: object
            properties:
                time: { type: string, example: "09-08 20:01" }
                user: { type: string }
                text: { type: string }

        LoginInput:
            type: object
            required: [account, password]
            properties:
                account: { type: string, example: li_xiaomei }
                password: { type: string, format: password }

        ProfileResult:
            type: object
            properties:
                user: { $ref: "#/components/schemas/WbUser" }
                grant: { $ref: "#/components/schemas/RoleGrant" }

        WbUser:
            type: object
            description: 用户（对应 sys_user；不含密码）
            properties:
                id: { type: integer, description: 演示用自增；真实后端不出雪花 id }
                name: { type: string }
                account: { type: string }
                role: { $ref: "#/components/schemas/RoleId" }
                active: { type: boolean }
                last: { type: string, example: "09-08 20:01", description: 最近登录 }

        Order:
            type: object
            properties:
                orderNo: { type: string, example: ZM260903086 }
                customer: { type: string }
                customerCode: { type: string }
                bomCode: { type: string }
                qty: { type: integer }
                outbound: { type: integer, description: 累计已出库数量 }
                orderDate: { type: string, format: date }
                deliverStart: { type: string, format: date, description: 交货起始日期 }
                deliverEnd: { type: string, format: date, description: 交货截止日期（排序/逾期口径） }
                remark: { type: string }

        CreateOrderInput:
            type: object
            required: [customerCode, customer, bomCode, qty, deliverStart, deliverEnd, orderDate]
            properties:
                customerCode: { type: string }
                customer: { type: string }
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                deliverStart: { type: string, format: date }
                deliverEnd: { type: string, format: date }
                orderDate: { type: string, format: date }
                remark: { type: string }

        UpdateOrderInput:
            type: object
            description: 订单不可删除；qty 变更时服务端校验新数量 ≥ 累计已发数量（Order.outbound）
            properties:
                qty: { type: integer, minimum: 1 }
                deliverStart: { type: string, format: date }
                deliverEnd: { type: string, format: date }
                remark: { type: string }

        Customer:
            type: object
            properties:
                code: { type: string, example: CUS-1024 }
                name: { type: string }
                contact: { type: string }
                phone: { type: string, example: "138****6821", description: 掩码展示；完整号仅入库存储，API 一律不返回 }
                province: { type: string, example: 广东省 }
                city: { type: string, example: 深圳市 }
                district: { type: string, example: 南山区, description: 县/区，直筒子市可空 }
                town: { type: string, example: 粤海街道, description: 乡镇/街道，可空 }
                address: { type: string, example: 示例街道 88 号, description: 详细地址，跟在四级行政区划之后 }
                cooperation: { type: string, enum: [合作中, 待跟进], description: 聚合派生——近 6 个月有订单为合作中，否则待跟进（不落库） }
                owner: { type: string, description: 所属销售姓名（后端 join） }
                payTerms: { type: string, example: 月结 30 天 }
                created: { type: string, format: date }

        CreateCustomerInput:
            type: object
            required: [name, contact, phone, province, city, address, ownerAccount]
            properties:
                name: { type: string, minLength: 4 }
                contact: { type: string }
                phone: { type: string, pattern: "^1\\d{10}$" }
                province: { type: string, description: 省/直辖市（行政区划级联选择） }
                city: { type: string }
                district: { type: string, description: 县/区，可空 }
                town: { type: string, description: 乡镇/街道，可空 }
                address: { type: string }
                ownerAccount: { type: string, description: 所属销售账号（sys_user.account，须为 role=sales 的在职用户） }
                payTerms: { type: string, description: 付款条件，可空 }

        UpdateCustomerInput:
            type: object
            required: [name, contact, province, city, address, ownerAccount]
            properties:
                name: { type: string, minLength: 4 }
                contact: { type: string }
                phone: { type: string, pattern: "^1\\d{10}$", description: 留空表示不修改；填了则校验并替换 }
                province: { type: string }
                city: { type: string }
                district: { type: string }
                town: { type: string }
                address: { type: string }
                ownerAccount: { type: string }
                payTerms: { type: string }

        Bom:
            type: object
            properties:
                code: { type: string, example: ZMXK2001 }
                name: { type: string, example: 旋转开关, description: 品类 }
                modelCode: { type: string, example: 2-1 }
                specs:
                    type: object
                    additionalProperties: { type: string }
                    description: 品类规格键值对（对应库表 spec JSON）
                spec: { type: string, description: 规格摘要（列表/搜索用） }
                created: { type: string, format: date }
                unit: { type: string, example: 个 }

        CreateBomInput:
            type: object
            required: [name, modelCode, specs]
            properties:
                name: { type: string, description: 品类名，须在前端品类模板中存在 }
                modelCode: { type: string }
                specs:
                    type: object
                    additionalProperties: { type: string }

        InboundRow:
            type: object
            properties:
                no: { type: string, example: RK-20260910-0001 }
                bomCode: { type: string }
                qty: { type: integer }
                date: { type: string, format: date }
                time: { type: string, example: "10:40" }
                inspector: { type: string, description: 检验登记人姓名（服务端取当前登录用户，join sys_user） }
                remark: { type: string }

        CreateInboundInput:
            type: object
            required: [bomCode, qty, date]
            properties:
                bomCode: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                remark: { type: string }

        OutboundRow:
            type: object
            properties:
                no: { type: string, example: CK-20260910-0001 }
                orderNo: { type: string }
                customer: { type: string }
                customerCode: { type: string }
                bomCode: { type: string }
                qty: { type: integer }
                date: { type: string, format: date }
                time: { type: string }
                operator: { type: string, description: 操作人姓名（服务端取当前登录用户，join sys_user） }
                remark: { type: string }

        CreateOutboundInput:
            type: object
            required: [orderNo, qty, date]
            properties:
                orderNo: { type: string }
                qty: { type: integer, minimum: 1 }
                date: { type: string, format: date }
                remark: { type: string }

        CreateUserInput:
            type: object
            required: [name, account, role]
            properties:
                name: { type: string, minLength: 1, maxLength: 20, description: 姓名（1-20 字符） }
                account: { type: string, pattern: "^[A-Za-z0-9_]{3,}$" }
                role: { $ref: "#/components/schemas/RoleId" }

        UpdateUserInput:
            type: object
            required: [name, role]
            properties:
                name: { type: string, minLength: 1, maxLength: 20, description: 姓名（1-20 字符） }
                role: { $ref: "#/components/schemas/RoleId" }
