<svg viewBox="0 0 480 400" fill="none" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <defs>
    <radialGradient id="lg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景光晕与轨道 -->
  <ellipse cx="225" cy="290" rx="185" ry="135" fill="url(#lg)"/>
  <ellipse cx="225" cy="300" rx="195" ry="60" transform="rotate(-10 225 300)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2.5" stroke-dasharray="2 9"/>

  <!-- 托盘/平台 -->
  <path d="M85 352 L225 271 L366 352 L225 433 Z" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M85 352 L225 433 L225 447 L85 366 Z" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M225 433 L366 352 L366 366 L225 447 Z" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- 箱 A（左下，顶面被 C 遮住） -->
  <path d="M114.6 250 L170 282 L170 346 L114.6 314 Z" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.5"/>
  <path d="M170 282 L225.4 250 L225.4 314 L170 346 Z" fill="#ffffff" fill-opacity="0.11" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.5"/>
  <!-- 箱 A 侧面标签 -->
  <path d="M126 257 L154 273 L154 295 L126 279 Z" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M130 265 L146 274 M130 273 L140 279" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>

  <!-- 箱 B（右下） -->
  <path d="M280.8 218 L336.2 250 L280.8 282 L225.4 250 Z" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.5"/>
  <path d="M225.4 250 L280.8 282 L280.8 346 L225.4 314 Z" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.5"/>
  <path d="M280.8 282 L336.2 250 L336.2 314 L280.8 346 Z" fill="#ffffff" fill-opacity="0.11" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.5"/>

  <!-- 箱 C（堆在 A 上） -->
  <path d="M170 154 L225.4 186 L170 218 L114.6 186 Z" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.5"/>
  <path d="M114.6 186 L170 218 L170 282 L114.6 250 Z" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.5"/>
  <path d="M170 218 L225.4 186 L225.4 250 L170 282 Z" fill="#ffffff" fill-opacity="0.11" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2.5"/>
