  <path d="M142.3 170 L197.7 202 M142.3 202 L142.3 266" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- 左上角小箱 -->
  <path d="M95 134 L114.1 145 L95 156 L75.9 145 Z" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M75.9 145 L95 156 L95 178 L75.9 167 Z" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M95 156 L114.1 145 L114.1 167 L95 178 Z" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>

  <!-- 单据（订单）与勾选徽章 -->
  <rect x="308" y="76" width="88" height="108" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2.5"/>
  <rect x="330" y="66" width="44" height="20" rx="7" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2.5"/>
  <path d="M322 104 L382 104 M322 124 L372 124 M322 144 L360 144" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
  <circle cx="396" cy="184" r="14" fill="#6ee7b7" stroke="#ffffff" stroke-width="3.5"/>
  <path d="M389.5 183.5 L394.5 188.5 L402.5 178.5" stroke="#065f46" stroke-width="3"/>

  <!-- 单据 → 箱子的流转虚线 -->
  <path d="M308 170 C 264 196, 238 126, 188 146" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="4 7"/>
  <path d="M198 143 L188 146 L196 154" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5"/>

  <!-- 点缀星点 -->
  <path d="M111 108 H125 M118 101 V115" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.5"/>
  <path d="M387 248 H397 M392 243 V253" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="152" cy="92" r="3" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="402" cy="150" r="2.5" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="96" cy="238" r="2" fill="#ffffff" fill-opacity="0.4"/>
</svg>
