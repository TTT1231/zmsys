<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light" />
        <title>众茂生产</title>
        <!-- 启动画面样式必须内联:Tailwind 产物 CSS 加载完成前它是页面上唯一的视觉 -->
        <style>
            /* 全屏加载画面不产生滚动条(对齐 vben:body 去 margin + 画布固定满视口) */
            html,
            body {
                margin: 0;
            }
            #boot {
                height: 100dvh;
                overflow: hidden;
                display: grid;
                place-items: center;
                background: #f5f7fb;
            }
            html.dark #boot {
                background: #10141d;
            }
            /* vben 式方块弹跳 loader(内联版,与 index.css 的 loader-jump-ani 同源)。
         全屏启动场景用大尺寸(对齐 vben 的 48px 量级),醒目直观 */
            #boot-loader {
                position: relative;
                width: 44px;
                height: 60px;
            }
            #boot-cube {
                position: absolute;
                top: 0;
                left: 0;
                width: 44px;
                height: 44px;
                border-radius: 5px;
                background: #4f46e5;
                animation: boot-jump 0.5s linear infinite;
            }
            html.dark #boot-cube {
                background: #6366f1;
            }
            html.dark #boot-shadow {
                background: rgba(99, 102, 241, 0.5);
            }
            #boot-shadow {
                position: absolute;
                right: 0;
                bottom: 0;
                left: 0;
                margin: 0 auto;
                width: 44px;
                height: 4px;
                border-radius: 50%;
                background: rgba(79, 70, 229, 0.5);
                animation: boot-shadow 0.5s linear infinite;
            }
            @keyframes boot-jump {
                15% {
                    border-bottom-right-radius: 5px;
                }
                25% {
                    transform: translateY(8px) rotate(22.5deg);
                }
                50% {
                    border-bottom-right-radius: 35px;
                    transform: translateY(16px) scale(1, 0.9) rotate(45deg);
                }
                75% {
                    transform: translateY(8px) rotate(67.5deg);
                }
                100% {
                    transform: translateY(0) rotate(90deg);
                }
            }
            @keyframes boot-shadow {
                0%,
                100% {
                    transform: scale(1, 1);
                }
                50% {
                    transform: scale(1.2, 1);
                }
            }
            #boot-inner {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }
            #boot-name {
                font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
                font-size: 13px;
                color: #667085;
            }
            html.dark #boot-name {
                color: #9aa6ba;
            }
        </style>
        <script>
            /* FOUC 防护（与 src/context/usePreferences.ts 同源）：产物 CSS 加载前先按已存偏好
               给 <html> 打暗色类，暗色用户冷加载不再白闪；读取失败按浅色启动 */
            try {
                var bootPrefs = JSON.parse(localStorage.getItem("zmsys.preferences") || "{}");
                var bootDark =
                    bootPrefs.themeMode === "dark" ||
                    (bootPrefs.themeMode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
                if (bootDark) document.documentElement.classList.add("dark");
            } catch (bootError) {
                /* localStorage 不可用（隐私模式等）时按浅色启动 */
            }
        </script>
    </head>
    <body>
        <!-- 静态启动画面:MSW worker 启动完成前兜底,React createRoot().render() 会整体替换。
         与应用内 PageLoading 一致:方块弹跳 + 统一"加载中…"提示 -->
        <div id="root">
            <div id="boot">
                <div id="boot-inner">
                    <div id="boot-loader">
                        <span id="boot-cube"></span>
                        <span id="boot-shadow"></span>
                    </div>
                    <div id="boot-name" role="status">加载中…</div>
                </div>
            </div>
        </div>
        <noscript>智造管理系统需要启用 JavaScript 才能运行。</noscript>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
