  });
  document.addEventListener('dblclick',e=>{const row=e.target.closest('[data-order]');if(row)openOrder(row.dataset.order);});
  document.addEventListener('mouseover',e=>{const row=e.target.closest('#rows [data-order]');if(row)setHover(row.dataset.order);});
  $('rows').addEventListener('mouseleave',()=>setHover(null));
  $('rows').addEventListener('focusin',e=>{const row=e.target.closest('[data-order]');if(row)setHover(row.dataset.order);});
  $('rows').addEventListener('focusout',()=>setHover(null));
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if($('order-dialog').open||$('date-dialog').open)return;if(state.selectedBom)closeInspector();return;}
    const row=e.target.closest('[data-order]');if(!row||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();
    const ordered=rows.filter(r=>r.kind==='order').map(r=>r.order),index=ordered.findIndex(o=>o.id===row.dataset.order),next=ordered[index+(e.key==='ArrowDown'?1:-1)];if(!next)return;
    selectOrder(next.id,true);const selector=mobile.matches?'#mobile-list':'#rows';document.querySelector(`${selector} [data-order="${next.id}"]`)?.focus({preventScroll:true});
  });
  $('search').oninput=e=>{clearTimeout(searchTimer);state.query=e.target.value;searchTimer=setTimeout(()=>{state.selectedBom=null;state.selectedOrder=null;render();document.querySelector('.gantt-scroll').scrollTop=0;saveLocation();},160);};
  $('sort').onchange=e=>{state.sort=e.target.value;render();document.querySelector('.gantt-scroll').scrollTop=0;saveLocation();};
  $('previous').onclick=()=>{state.start-=1;render();};
  $('next').onclick=()=>{state.end+=1;render();};
  $('today').onclick=()=>{state.start=TODAY-7;state.end=TODAY+7;document.querySelector('.gantt-scroll').scrollLeft=0;render();};
  $('date-range').onclick=()=>{$('date-start').value=iso(state.start);$('date-end').value=iso(state.end);$('date-end').setCustomValidity('');$('date-dialog').showModal();};
  $('close-date').onclick=()=>$('date-dialog').close();
  $('date-form').onsubmit=e=>{e.preventDefault();const from=day($('date-start').value),to=day($('date-end').value);if(to<from){$('date-end').setCustomValidity('结束日期不能早于开始日期');$('date-end').reportValidity();return;}state.start=from;state.end=to;state.selectedBom=null;state.selectedOrder=null;$('date-dialog').close();render();document.querySelector('.gantt-scroll').scrollLeft=0;};
  $('date-end').oninput=()=>$('date-end').setCustomValidity('');
  $('clear-filters').onclick=clearFilters;$('clear-active-filters').onclick=clearFilters;
  const scroll=document.querySelector('.gantt-scroll');scroll.onscroll=()=>{cancelAnimationFrame(scrollFrame);scrollFrame=requestAnimationFrame(()=>renderViewport());clearTimeout(saveTimer);saveTimer=setTimeout(saveLocation,180);};
  $('mobile-list').onscroll=()=>{clearTimeout(saveTimer);saveTimer=setTimeout(saveLocation,180);};
  const observer=new ResizeObserver(()=>{chart?.resize();if(rows.length>80)renderViewport(true);});observer.observe($('chart-surface'));
  mobile.addEventListener('change',()=>render());
  window.addEventListener('hashchange',()=>{readLocation();const top=state.top,left=state.left,mobileTop=state.mobileTop;$('search').value=state.query;render();scroll.scrollTop=top;scroll.scrollLeft=left;$('mobile-list').scrollTop=mobileTop;renderViewport(true);});
  window.addEventListener('pagehide',()=>{saveLocation();clearTimeout(searchTimer);clearTimeout(saveTimer);observer.disconnect();parentThemeObserver?.disconnect();chart?.dispose();});
  readLocation();applyTheme();const restoredTop=state.top,restoredLeft=state.left,restoredMobile=state.mobileTop;render();scroll.scrollTop=restoredTop;scroll.scrollLeft=restoredLeft;$('mobile-list').scrollTop=restoredMobile;renderViewport(true);saveLocation();
})();
</script>
</body>
</html>
