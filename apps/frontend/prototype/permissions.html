<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>用户与权限 · 智造管理系统（权限原型）</title>
<style>
  :root {
    --font-sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-strong: #3730a3;
    --primary-soft: #eef2ff;
    --primary-border: #c7d2fe;
    --success: #047857;
    --success-soft: #ecfdf3;
    --warning: #b45309;
    --warning-soft: #fff7ed;
    --danger: #b42318;
    --danger-soft: #fef3f2;
    --ink: #101828;
    --muted: #667085;
    --subtle: #667085;
    --line: #e4e7ec;
    --line-strong: #d0d5dd;
    --canvas: #f5f7fb;
    --td: #344054;
    --row-hover: #f8f9ff;
    --r-btn: 10px;
    --r-card: 14px;
    --r-panel: 18px;
    --shadow-xs: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-card: 0 2px 6px rgba(16, 24, 40, .04);
    --shadow-modal: 0 18px 45px rgba(16, 24, 40, .12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--canvas);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* ============ 布局 ============ */
  .app { display: flex; min-height: 100dvh; }

  /* ---- 预览侧边栏（复刻系统侧边栏，实时反映当前角色菜单） ---- */
  .preview-sidebar {
    position: sticky; top: 0; height: 100dvh; width: 232px; flex-shrink: 0;
    display: flex; flex-direction: column; overflow-y: auto;
    background: linear-gradient(to bottom, #101828, #162033);
    box-shadow: 8px 0 30px rgba(16, 24, 40, .08);
  }
  .preview-badge {
    margin: 14px 14px 4px; padding: 5px 10px;
    border: 1px dashed rgba(199, 210, 254, .55); border-radius: 999px;
    color: #c7d2fe; font-size: 11px; letter-spacing: .08em;
    display: flex; align-items: center; gap: 6px; justify-content: center;
  }
  .preview-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #818cf8; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .preview-role {
    margin: 8px 14px 10px; padding: 9px 12px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.06);
    color: #fff;
  }
  .preview-role .cap { font-size: 10.5px; letter-spacing: .06em; color: #aeb8c8; }
  .preview-role .name { margin-top: 2px; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .preview-role .name::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #818cf8; }
  .preview-nav { padding: 4px 10px 16px; flex: 1; }
  .preview-group { padding: 12px 10px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #7a8699; }
  .preview-item {
    display: flex; align-items: center; gap: 10px; min-height: 40px;
    padding: 0 10px; border-radius: 10px; color: #aeb8c8; font-size: 13px;
  }
  .preview-item.active {
    background: linear-gradient(to right, rgba(99,102,241,.3), rgba(79,70,229,.16));
    color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 0 #818cf8;
  }
  .preview-item svg { flex-shrink: 0; }
  .preview-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview-item .tag {
    flex-shrink: 0; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 500;
    background: rgba(99,102,241,.18); color: #c7d2fe; white-space: nowrap;
  }
  .preview-empty { padding: 18px 12px; color: #7a8699; font-size: 12px; }
  .preview-foot {
    margin: 0 14px 16px; padding: 10px 12px; border-radius: 12px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; gap: 10px;
  }
  .preview-foot .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;
  }
  .preview-foot .who { color: #fff; font-size: 12.5px; font-weight: 600; line-height: 1.3; }
  .preview-foot .sub { color: #aeb8c8; font-size: 11px; }

  /* ---- 主区 ---- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 30; height: 64px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 0 24px; border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.88); backdrop-filter: blur(18px) saturate(1.5);
  }
  .topbar .search {
    display: flex; align-items: center; gap: 8px; width: 300px; min-height: 42px;
    padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-btn);
    color: var(--muted); font-size: 13px; text-align: left; background: #fff;
  }
  .topbar .me { display: flex; align-items: center; gap: 10px; }
  .topbar .me .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;
  }
  .topbar .me .name { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
  .topbar .me .sub { font-size: 11px; color: var(--muted); }
  .content { max-width: 1280px; width: 100%; margin: 0 auto; padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 20px; }

  /* ---- Page heading ---- */
  .heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .heading .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--primary); }
  .heading h1 { margin: 4px 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  .heading p { margin: 0; color: var(--muted); font-size: 13px; max-width: 620px; }
  .heading .actions { display: flex; gap: 10px; }

  /* ---- KPI ---- */
  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kpi {
    position: relative; overflow: hidden; min-height: 74px;
    display: flex; flex-direction: column; justify-content: center;
    border: 1px solid rgba(228,231,236,.7); border-radius: var(--r-card);
    background: rgba(255,255,255,.9); padding: 12px 16px; box-shadow: var(--shadow-xs);
  }
  .kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: #c7d2fe; }
  .kpi .label { font-size: 11.5px; color: var(--muted); }
  .kpi .value { font-size: 20px; font-weight: 700; margin-left: 4px; }
  .kpi .unit { font-size: 11.5px; color: var(--subtle); margin-left: 4px; }

  /* ---- Tabs ---- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tab-btn {
    position: relative; border: 0; background: none; padding: 10px 14px 12px;
    font-size: 14px; color: var(--muted); border-radius: 8px 8px 0 0;
  }
  .tab-btn:hover { color: var(--ink); background: var(--row-hover); }
  .tab-btn.active { color: var(--primary-strong); font-weight: 600; }
  .tab-btn.active::after {
    content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px;
    background: var(--primary); border-radius: 2px;
  }
  .tab-btn .count {
    margin-left: 6px; padding: 0 6px; border-radius: 999px; font-size: 11px;
    background: var(--primary-soft); color: var(--primary-strong); font-weight: 600;
  }
  .tab-panel { display: none; flex-direction: column; gap: 20px; }
  .tab-panel.active { display: flex; }

  /* ---- 通用面板 ---- */
  .panel {
    border: 1px solid var(--line); border-radius: var(--r-panel);
    background: rgba(255,255,255,.97); box-shadow: var(--shadow-card); overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: linear-gradient(to bottom, #fff, #fcfcfd);
  }
  .panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .panel-head .hint { font-size: 12px; color: var(--muted); }
  .panel-body { padding: 18px 20px; }

  /* ---- 按钮 ---- */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; min-height: 38px;
    padding: 0 14px; border-radius: var(--r-btn); border: 1px solid var(--line);
    background: #fff; color: var(--td); font-size: 13px; font-weight: 500;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--line-strong); background: #fafafe; }
  .btn-primary {
    border-color: var(--primary); background: var(--primary); color: #fff;
    box-shadow: 0 4px 12px rgba(79,70,229,.28);
  }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn-sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
  .btn-link {
    border: 0; background: none; padding: 4px 6px; border-radius: 6px;
    color: var(--primary); font-size: 12.5px; font-weight: 500;
  }
  .btn-link:hover { background: var(--primary-soft); }
  .btn-link.danger { color: var(--danger); }
  .btn-link.danger:hover { background: var(--danger-soft); }

  /* ---- 提示条 ---- */
  .notice {
    display: flex; gap: 10px; align-items: flex-start;
    border: 1px solid var(--primary-border); background: var(--primary-soft);
    border-radius: 12px; padding: 11px 14px; font-size: 12.5px; color: var(--primary-strong);
  }
  .notice.warn { border-color: #fde0b2; background: var(--warning-soft); color: var(--warning); }
  .notice b { font-weight: 600; }

  /* ---- 角色授权布局 ---- */
  .roles-layout { display: grid; grid-template-columns: 264px 1fr; gap: 20px; align-items: start; }
  .role-card {
    display: block; width: 100%; text-align: left; border: 1px solid var(--line);
    border-radius: 12px; background: #fff; padding: 12px 14px; transition: all .15s;
  }
  .role-card + .role-card { margin-top: 8px; }
  .role-card:hover { border-color: var(--primary-border); background: var(--row-hover); }
  .role-card.active {
    border-color: var(--primary); background: var(--primary-soft);
    box-shadow: 0 0 0 1px var(--primary);
  }
  .role-card .top { display: flex; align-items: center; gap: 8px; }
  .role-card .rname { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .role-card .lock {
    margin-left: auto; color: var(--muted); display: inline-flex; align-items: center; gap: 3px;
    font-size: 10.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; background: #f8fafc;
  }
  .role-card .rcount { margin-top: 7px; font-size: 11.5px; color: var(--subtle); display: flex; align-items: center; gap: 5px; }

  .grant-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: linear-gradient(to bottom, #fff, #fcfcfd);
  }
  .grant-toolbar .who { display: flex; align-items: baseline; gap: 8px; }
  .grant-toolbar .who b { font-size: 15px; font-weight: 600; }
  .grant-toolbar .who span { font-size: 12px; color: var(--muted); }
  .grant-toolbar .ops { display: flex; gap: 8px; }

  .tree-row { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 2px 8px; border-radius: 8px; }
  .tree-row:hover { background: var(--row-hover); }
  .tree-row .icon { color: var(--muted); display: inline-flex; }
  .tree-row .label { font-size: 13.5px; color: var(--ink); }
  .tree-children { margin-left: 26px; border-left: 1px dashed var(--line); padding-left: 6px; }
  .tree-row.disabled { opacity: .5; pointer-events: none; }
  input[type="checkbox"] { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }

  .action-group { padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .action-group:last-child { border-bottom: 0; padding-bottom: 0; }
  .action-group .g-head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .action-group .g-head .g-name { font-size: 13px; font-weight: 600; }
  .action-group .g-head .g-sub { font-size: 11.5px; color: var(--subtle); }
  .action-group.disabled { opacity: .45; pointer-events: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-check { position: relative; display: inline-flex; }
  .chip-check input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .chip-check span {
    display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 999px; background: #fff;
    font-size: 12.5px; color: var(--td); transition: all .12s;
  }
  .chip-check span::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--line-strong); transition: all .12s;
  }
  .chip-check input:checked + span {
    border-color: var(--primary-border); background: var(--primary-soft);
    color: var(--primary-strong); font-weight: 600;
  }
  .chip-check input:checked + span::before { background: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.15); }

  .member-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px dashed var(--line); }
  .member-row:last-child { border-bottom: 0; }
  .member-row .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: var(--primary-soft); color: var(--primary-strong);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
  }
  .member-row .m-name { font-size: 13px; font-weight: 500; }
  .member-row .m-sub { font-size: 11.5px; color: var(--muted); }

  /* ---- 表格 ---- */
  table.grid { width: 100%; border-collapse: collapse; }
  table.grid th {
    background: #f8fafc; text-align: left; font-size: 12px; color: var(--muted);
    font-weight: 600; padding: 10px 20px; white-space: nowrap;
  }
  table.grid th:first-child, table.grid td:first-child { padding-left: 20px; }
  table.grid th:last-child, table.grid td:last-child { padding-right: 20px; }
  table.grid td { padding: 12px 16px; border-top: 1px solid rgba(228,231,236,.7); font-size: 13px; color: var(--td); vertical-align: middle; }
  table.grid tbody tr { transition: background .12s; }
  table.grid tbody tr:hover { background: var(--row-hover); }
  .cell-user { display: flex; align-items: center; gap: 10px; }
  .cell-user .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: var(--primary-soft); color: var(--primary-strong);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;
  }
  .cell-user .n { font-weight: 600; color: var(--ink); font-size: 13px; }
  .cell-user .s { font-size: 11.5px; color: var(--muted); }

  .badge {
    display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 500; white-space: nowrap;
  }
  .badge.indigo { background: var(--primary-soft); color: var(--primary-strong); }
  .badge.green { background: var(--success-soft); color: var(--success); }
  .badge.gray { background: #f2f4f7; color: var(--muted); }
  .badge.amber { background: var(--warning-soft); color: var(--warning); }
  .badge.red { background: var(--danger-soft); color: var(--danger); }

  .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: relative; z-index: 1; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong);
    transition: all .15s;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.2); transition: all .15s;
  }
  .switch input:checked + .track { background: var(--success); }
  .switch input:checked + .track::after { transform: translateX(16px); }
  .switch.disabled { opacity: .45; pointer-events: none; }

  /* ---- 矩阵 ---- */
  .matrix-wrap { overflow-x: auto; }
  table.matrix { width: 100%; border-collapse: collapse; min-width: 860px; }
  table.matrix th, table.matrix td { border: 1px solid var(--line); padding: 9px 12px; font-size: 12.5px; }
  table.matrix thead th { background: #f8fafc; color: var(--muted); font-weight: 600; text-align: center; }
  table.matrix tbody th { background: #fcfcfd; text-align: left; font-weight: 600; white-space: nowrap; }
  table.matrix td { text-align: center; vertical-align: middle; min-width: 128px; }
  .mx-none { color: #c0c5cf; font-size: 11.5px; }
  .mx-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .mx-tag {
    padding: 1px 7px; border-radius: 6px; font-size: 11px; background: var(--primary-soft); color: var(--primary-strong);
  }
  .mx-tag.view { background: #f2f4f7; color: var(--muted); }
  .mx-tag.print { background: var(--accent-soft, #e0f2fe); color: #0284c7; }
  .mx-all { color: var(--success); font-weight: 600; font-size: 12px; }

  /* ---- 日志 ---- */
  .log-row { display: flex; gap: 12px; padding: 10px 4px; border-bottom: 1px dashed var(--line); align-items: flex-start; }
  .log-row:last-child { border-bottom: 0; }
  .log-row .t { flex-shrink: 0; width: 108px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .log-row .u { flex-shrink: 0; width: 64px; font-size: 12px; font-weight: 600; }
  .log-row .x { font-size: 12.5px; color: var(--td); line-height: 1.55; }
  .log-row .x .diff-add { color: var(--success); }
  .log-row .x .diff-del { color: var(--danger); text-decoration: line-through; }

  /* ---- 弹窗 / Toast ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 90; background: rgba(15,23,42,.48);
    backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.open { display: flex; }
  .modal {
    width: min(460px, 100%); background: #fff; border-radius: var(--r-card);
    box-shadow: var(--shadow-modal); padding: 22px 24px;
  }
  .modal h3 { margin: 0 0 16px; font-size: 16px; font-weight: 700; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 500; color: var(--td); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; min-height: 40px; border: 1px solid var(--line-strong); border-radius: var(--r-btn);
    padding: 0 12px; font-size: 13.5px; font-family: inherit; color: var(--ink); background: #fff;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--primary-border); border-color: var(--primary); }
  .field .err { border-color: var(--danger); }
  .field .msg { margin-top: 4px; font-size: 11.5px; color: var(--danger); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  .toast-wrap { position: fixed; right: 20px; bottom: 20px; z-index: 99; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    display: flex; align-items: center; gap: 9px; padding: 11px 16px; border-radius: 12px;
    background: #101828; color: #fff; font-size: 13px; box-shadow: var(--shadow-modal);
    animation: slide-in .22s ease; max-width: 380px;
  }
  .toast.ok::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #34d399; flex-shrink: 0; }
  .toast.info::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #818cf8; flex-shrink: 0; }
  @keyframes slide-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  @media (max-width: 1180px) {
    .preview-sidebar { display: none; }
    .roles-layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .topbar .search { display: none; }
    .content { padding: 16px 14px 40px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- 实时预览：当前所选角色登录后看到的侧边栏菜单 -->
  <aside class="preview-sidebar" aria-label="菜单实时预览">
    <div class="preview-badge"><span class="dot"></span>菜单实时预览</div>
    <div class="preview-role">
      <div class="cap">当前预览角色</div>
      <div class="name" id="previewRoleName">—</div>
    </div>
    <nav class="preview-nav" id="previewNav"></nav>
    <div class="preview-foot">
      <span class="avatar" id="previewFootAvatar">系</span>
      <div>
        <div class="who" id="previewFootWho">系统管理员</div>
        <div class="sub" id="previewFootSub">超级管理员</div>
      </div>
    </div>
  </aside>

  <div class="main">

<script>
/* =========================================================
 * 权限原型 · 数据层
 * 菜单目录（MENU_CATALOG / ACTION_CATALOG）= 前端代码维护的"字典"
 * 角色授权（GRANTS）= "数据"，原型存 localStorage，模拟后端库
 * ========================================================= */

const MENU_CATALOG = [
  { key: "workbench",  label: "工作台",     icon: "grid",     group: "业务导航", path: "/workbench" },
  { key: "orders",     label: "销售订单",   icon: "order",    group: "业务导航", path: "/orders" },
  { key: "customers",  label: "客户档案",   icon: "users",    group: "业务导航", path: "/customers" },

  { key: "inbound",    label: "成品入库",   icon: "package",  group: "业务导航", path: "/inbound" },
  { key: "outbound",   label: "成品出库",   icon: "truck",    group: "业务导航", path: "/outbound" },

const ACTION_CATALOG = {
  orders:     [{ id: "view", label: "查看" }, { id: "create", label: "新建订单" }, { id: "edit", label: "编辑订单" }],
  customers:  [{ id: "view", label: "查看" }, { id: "create", label: "新建客户" }, { id: "edit", label: "编辑客户" }],
  bom:        [{ id: "view", label: "查看" }, { id: "create", label: "新建 BOM" }, { id: "edit", label: "编辑 / 版本维护" }],
  inbound:    [{ id: "view", label: "查看台账" }, { id: "register", label: "检验入库" }, { id: "edit", label: "更正记录" }],
  outbound:   [{ id: "view", label: "查看台账" }, { id: "ship", label: "登记发货" }, { id: "edit", label: "更正记录" }, { id: "print", label: "打印出库单" }],
  permissions:[{ id: "view", label: "查看" }, { id: "manage", label: "用户与角色管理" }],
};

const ACTION_SHORT = { create: "新建", edit: "编辑", register: "入库", ship: "发货", print: "打印", manage: "管理" };

const ROLES = [
  { id: "super",     name: "超级管理员", locked: true },
  { id: "admin",     name: "管理员" },
  { id: "warehouse", name: "仓管" },
  { id: "sales",     name: "销售" },
  { id: "staff",     name: "员工" },
];

const ROLE_IDS = ROLES.map((r) => r.id);

/* 默认授权 = AGENTS.md 权限矩阵（menus 含子菜单页；actions 按 [menu]: [actionId] 存放） */
function buildDefaultGrants() {
  const all = (menu) => ACTION_CATALOG[menu].map((a) => a.id);
  return {
    super: {
      menus: ["workbench", "orders", "customers", "bom", "inbound", "outbound", "permissions", "permissions-accounts", "permissions-roles", "permissions-matrix"],
      actions: Object.fromEntries(Object.keys(ACTION_CATALOG).map((m) => [m, all(m)])),
    },
    admin: {
      menus: ["workbench", "orders", "customers", "bom", "inbound", "outbound"],
      actions: { orders: all("orders"), customers: all("customers"), bom: all("bom"), inbound: ["view"], outbound: ["view", "print"] },
    },
    warehouse: {
      menus: ["workbench", "orders", "bom", "inbound", "outbound"],
      actions: { orders: ["view"], bom: ["view"], inbound: ["view", "register", "edit"], outbound: ["view", "ship", "edit"] },
    },
    sales: {
      menus: ["workbench", "orders", "customers", "bom", "inbound", "outbound"],
      actions: { orders: all("orders"), customers: all("customers"), bom: all("bom"), inbound: ["view"], outbound: ["view"] },
    },
    staff: {
      menus: ["workbench", "orders", "bom", "inbound", "outbound"],
      actions: { orders: ["view"], bom: ["view"], inbound: ["view"], outbound: ["view"] },
    },
  };
}

/* ---------- 状态 ---------- */
const LS_KEY = "zm-permissions-prototype";
const DEFAULT_GRANTS = buildDefaultGrants();

let grants = loadGrants();
let users = [
  { id: 1, name: "系统管理员", account: "sys_admin",    role: "super",     active: true,  last: "09-07 08:12" },
  { id: 2, name: "李晓梅",     account: "li_xiaomei",   role: "admin",     active: true,  last: "09-07 09:40" },
  { id: 3, name: "陈志强",     account: "chen_zhiqiang",role: "admin",     active: true,  last: "09-06 17:22" },
  { id: 4, name: "周丽",       account: "zhou_li",      role: "warehouse", active: true,  last: "09-07 08:55" },
  { id: 5, name: "王师傅",     account: "wang_shifu",   role: "warehouse", active: true,  last: "09-05 16:03" },
  { id: 6, name: "赵师傅",     account: "zhao_shifu",   role: "warehouse", active: true,  last: "09-04 11:20" },
  { id: 7, name: "陈洁",       account: "chen_jie",     role: "sales",     active: true,  last: "09-07 09:12" },
];

/* 系统事件：与 store.systemEvents 种子一致（现有用户与权限页内容，权限改造后保留） */
const SYSTEM_EVENTS = [
  { level: "高优先级", tone: "danger",  module: "物料与 BOM", item: "订单引用的 BOM 版本信息缺失", ref: "ZM260830081", found: "09-04 16:20", state: "待核对", open: true },
  { level: "业务校验", tone: "warning", module: "成品出库",   item: "超出可发库存的发货被拦截",     ref: "ZM260903086", found: "09-05 10:12", state: "已拦截", open: true },
  { level: "配置变更", tone: "info",    module: "系统管理",   item: "检验员角色菜单权限变更",       ref: "ROLE-INSPECTOR", found: "09-05 09:30", state: "已生效", open: true },
  { level: "提示",     tone: "gray",    module: "客户档案",   item: "疑似重复客户资料待合并",       ref: "CUS-0906", found: "09-03 14:05", state: "待核对", open: false },
];

let logs = [
  { time: "09-05 09:30", user: "系统管理员", text: "角色【仓管】菜单权限变更：新增【成品出库 · 登记发货 / 更正记录】，保留【打印出库单】未授权" },
  { time: "09-04 16:20", user: "系统管理员", text: "角色【员工】授权确认：仅保留查看类权限，移除全部写操作" },
  { time: "09-02 11:05", user: "系统管理员", text: "新增用户【赵师傅】，分配角色【仓管】（检验岗）" },
];

let activeRole = "warehouse";   // 当前编辑 / 预览的角色（默认仓管，矩阵内容最丰富）
let draft = null;               // 当前角色编辑中的授权副本
let editingUserId = null;       // 弹窗编辑的用户 id（null = 新增）

function loadGrants() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      const merged = buildDefaultGrants();
      ROLE_IDS.forEach((id) => { if (saved[id]) merged[id] = saved[id]; });
      return merged;
    }
  } catch (e) { /* 忽略损坏数据 */ }
  return buildDefaultGrants();
}

/* ---------- 工具 ---------- */
const $ = (sel) => document.querySelector(sel);
const clone = (o) => JSON.parse(JSON.stringify(o));
const roleName = (id) => ROLES.find((r) => r.id === id).name;
const menuLabel = (key) => {
  const m = MENU_CATALOG.find((x) => x.key === key);
  if (m) return m.label;
  for (const parent of MENU_CATALOG) {
    const c = (parent.children || []).find((x) => x.key === key);
    if (c) return `${parent.label} · ${c.label}`;
  }
  return key;
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

const ICONS = {
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  order: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  layers: '<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
  package: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.27 6.96 8.73 5.05 8.73-5.05"/><path d="M12 22.08V12"/>',
  truck: '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
};
const icon = (name, size = 18) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.grid}</svg>`;

function toast(text, tone = "ok") {
  const el = document.createElement("div");
  el.className = `toast ${tone}`;
  el.textContent = text;
  $("#toastWrap").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 320); }, 2600);
}

const nowStamp = () => {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `09-07 ${p(d.getHours())}:${p(d.getMinutes())}`;
};

/* ---------- 渲染：预览侧边栏 ---------- */
function menuTag(menuKey, grant) {
  if (menuKey === "workbench") return "专属视图";
  const acts = ACTION_CATALOG[menuKey];
  if (!acts) return "";
  const chosen = grant.actions[menuKey] || [];
  if (!chosen.length) return "";
  const nonView = acts.filter((a) => a.id !== "view" && chosen.includes(a.id));
  if (!nonView.length) return "只读";
  if (nonView.length === acts.length - 1) return "全部权限";
  const names = nonView.map((a) => ACTION_SHORT[a.id] || a.label).join(" / ");
  return names.length > 7 ? "查看+" + names.slice(0, 6) + "…" : "查看+" + names;
}

function renderPreview() {
  const grant = draft || grants[activeRole];
  const role = ROLES.find((r) => r.id === activeRole);
  $("#previewRoleName").textContent = role.name;
  $("#previewFootSub").textContent = role.name;

  const visible = MENU_CATALOG.filter((m) => grant.menus.includes(m.key));
  const groups = ["业务导航", "系统设置"];
  let html = "";
  let first = true;
  for (const group of groups) {
    let items = visible.filter((m) => m.group === group);
    if (!items.length) continue;
    html += `<div class="preview-group">${group}</div>`;
    // 仓管角色的订单菜单沿用现网别名「待发货订单」，并保留「变更记录」说明项（非路由页）
    if (activeRole === "warehouse" && group === "业务导航") {
      items = items.map((m) => (m.key === "orders" ? { ...m, label: "待发货订单" } : m));
      items.push({ key: "changelog", label: "变更记录", icon: "list", group });
    }
    for (const item of items) {
      const tag = item.key === "changelog" ? "说明" : menuTag(item.key, grant);
      html += `
        <div class="preview-item ${first ? "active" : ""}">
          ${icon(item.icon)}
          <span class="label">${esc(item.label)}</span>
          ${tag ? `<span class="tag">${esc(tag)}</span>` : ""}
        </div>`;
      first = false;
    }
  }
  if (!visible.length) html = `<div class="preview-empty">该角色暂无任何可见菜单</div>`;
  $("#previewNav").innerHTML = html;
}

/* ---------- 渲染：角色列表 ---------- */
function renderRoleCards() {
  $("#roleCards").innerHTML = ROLES.map((r) => {
    const count = users.filter((u) => u.role === r.id).length;
    return `
      <button type="button" class="role-card ${r.id === activeRole ? "active" : ""}" onclick="selectRole('${r.id}')" ${r.locked ? 'title="内置角色，不可修改授权"' : ""}>
        <span class="top">
          <span class="rname">${esc(r.name)}</span>
          ${r.locked ? `<span class="lock">${icon("shield", 11)}内置</span>` : ""}
        </span>
        <span class="rcount">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          成员 ${count} 人 · 菜单 ${grants[r.id].menus.length} 项
        </span>
      </button>`;
  }).join("");
  $("#roleCountHint").textContent = `共 ${ROLES.length} 个角色`;
}

/* ---------- 渲染：授权编辑区 ---------- */
function renderGrantEditor() {
  const role = ROLES.find((r) => r.id === activeRole);
  const locked = role.locked;
  $("#grantRoleName").textContent = role.name;
  $("#grantRoleDesc").textContent = locked ? "内置角色 · 授权固定，仅可查看" : (draft ? "编辑中（未保存）" : "已保存生效");
  $("#btnSave").disabled = locked;
  $("#btnReset").disabled = locked;
  $("#btnSave").textContent = draft ? "保存授权" : "已保存";
  $("#btnSave").classList.toggle("btn-primary", !locked);

  const grant = draft || grants[activeRole];
  const disabledCls = locked ? "disabled" : "";
  let html = "";

  /* 菜单权限树 */
  html += `<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div style="font-size:13px;font-weight:600">菜单权限</div>
      ${locked ? "" : `<label style="font-size:12px;color:var(--primary);font-weight:500;display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" onchange="toggleAllMenus(this.checked)" ${MENU_CATALOG.every((m) => grant.menus.includes(m.key)) ? "checked" : ""} />全选
      </label>`}
    </div>
    <div style="border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fdfdff">`;

  for (const menu of MENU_CATALOG) {
    const checked = grant.menus.includes(menu.key);
    const childKeys = (menu.children || []).map((c) => c.key);
    const childChecked = childKeys.filter((k) => grant.menus.includes(k)).length;
    const indeterminate = childKeys.length > 0 && childChecked > 0 && childChecked < childKeys.length;
    html += `
      <div class="tree-row ${disabledCls}">
        <input type="checkbox" ${checked ? "checked" : ""} ${indeterminate ? 'data-ind="1"' : ""} data-menu="${menu.key}" onchange="toggleMenu('${menu.key}', this.checked)" />
        <span class="icon">${icon(menu.icon)}</span>
        <span class="label">${esc(menu.label)}</span>
      </div>`;
    if (childKeys.length) {
      html += `<div class="tree-children">`;
      for (const child of menu.children) {
        html += `
          <div class="tree-row ${disabledCls}">
            <input type="checkbox" ${grant.menus.includes(child.key) ? "checked" : ""} data-menu="${child.key}" onchange="toggleMenu('${child.key}', this.checked)" />
            <span class="label" style="font-size:12.5px;color:var(--td)">└ ${esc(child.label)}</span>
          </div>`;
      }
      html += `</div>`;
    }
  }
  html += `</div></div>`;

  /* 操作权限 */
  html += `<div>
    <div style="font-size:13px;font-weight:600;margin-bottom:10px">操作权限（按钮 / 动作级）</div>
    <div style="border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fdfdff">`;
  for (const menu of MENU_CATALOG) {
    const acts = ACTION_CATALOG[menu.key];
    if (!acts) continue;
    const menuOn = grant.menus.includes(menu.key);
    const chosen = grant.actions[menu.key] || [];
    html += `<div class="action-group ${menuOn && !locked ? "" : "disabled"}">
      <div class="g-head">
        <span class="icon" style="color:var(--muted);display:inline-flex">${icon(menu.icon, 15)}</span>
        <span class="g-name">${esc(menu.label)}</span>
        ${menuOn ? "" : `<span class="g-sub">（菜单未授权）</span>`}
      </div>
      <div class="chips">
        ${acts.map((a) => `
          <label class="chip-check">
            <input type="checkbox" ${chosen.includes(a.id) ? "checked" : ""} data-menu="${menu.key}" data-action="${a.id}" onchange="toggleAction('${menu.key}', '${a.id}', this.checked)" />
            <span>${esc(a.label)}</span>
          </label>`).join("")}
      </div>
    </div>`;
  }
  html += `</div></div>`;

  /* 成员 */
  const members = users.filter((u) => u.role === activeRole);
  html += `<div>
    <div style="font-size:13px;font-weight:600;margin-bottom:4px">该角色成员（${members.length}）</div>
    ${members.length ? members.map((u) => `
      <div class="member-row">
        <span class="avatar">${esc(u.name.slice(0, 1))}</span>
        <span>
          <span class="m-name">${esc(u.name)}</span>
          <span class="m-sub" style="display:block">${esc(u.account)}</span>
        </span>
        ${u.active ? '<span class="badge green" style="margin-left:auto">启用</span>' : '<span class="badge gray" style="margin-left:auto">已停用</span>'}
      </div>`).join("") : `<div style="font-size:12.5px;color:var(--subtle);padding:8px 0">暂无成员，可在「账号管理」中分配。</div>`}
  </div>`;

  $("#grantBody").innerHTML = html;
  // 父节点半选态
  document.querySelectorAll('input[data-ind="1"]').forEach((el) => { el.indeterminate = true; });
}

/* ---------- 渲染：矩阵 ---------- */
function renderMatrix() {
  const rows = MENU_CATALOG.filter((m) => m.key !== "workbench" && !m.key.startsWith("permissions-"));
  let html = `<tr><th style="text-align:left">模块 \\ 角色</th>${ROLES.map((r) => `<th>${esc(r.name)}</th>`).join("")}</tr>`;
  for (const menu of rows) {
    html += `<tr><th>${esc(menu.label)}</th>`;
    for (const role of ROLES) {
      const g = grants[role.id];
      if (!g.menus.includes(menu.key)) { html += `<td><span class="mx-none">—</span></td>`; continue; }
      const acts = ACTION_CATALOG[menu.key];
      if (!acts) { html += `<td><span class="mx-tag view">可见</span></td>`; continue; }
      const chosen = g.actions[menu.key] || [];
      const nonView = acts.filter((a) => a.id !== "view" && chosen.includes(a.id));
      if (!nonView.length) { html += `<td><span class="mx-tag view">只读</span></td>`; continue; }
      if (nonView.length === acts.length - 1) { html += `<td><span class="mx-all">全部权限</span></td>`; continue; }
      html += `<td><span class="mx-tags">${nonView.map((a) => `<span class="mx-tag ${a.id === "print" ? "print" : ""}">${esc(a.label)}</span>`).join("")}</span></td>`;
    }
    html += `</tr>`;
  }
  $("#matrixTable").innerHTML = html;
}

/* ---------- 渲染：用户表 ---------- */
function renderUsers() {
  $("#userRows").innerHTML = users.map((u) => `
    <tr>
      <td>
        <div class="cell-user">
          <span class="avatar">${esc(u.name.slice(0, 1))}</span>
          <span><span class="n">${esc(u.name)}</span><span class="s" style="display:block">ID ${String(u.id).padStart(3, "0")}</span></span>
        </div>
      </td>
      <td><span class="badge indigo">${esc(roleName(u.role))}</span></td>
      <td class="tnum" style="color:var(--muted)">${esc(u.account)}</td>
      <td>
        <label class="switch ${u.role === "super" ? "disabled" : ""}" title="${u.role === "super" ? "超级管理员不可停用" : ""}">
          <input type="checkbox" ${u.active ? "checked" : ""} ${u.role === "super" ? "disabled" : ""} onchange="toggleUser(${u.id}, this.checked)" />
          <span class="track"></span>
        </label>
      </td>
      <td class="tnum" style="color:var(--muted);font-size:12.5px">${esc(u.last)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn-link" type="button" onclick="openUserModal(${u.id})">编辑</button>
        <button class="btn-link" type="button" onclick="resetPwd(${u.id})">重置密码</button>
        ${u.role === "super" ? "" : `<button class="btn-link danger" type="button" onclick="toggleUser(${u.id}, ${u.active ? "false" : "true"})">${u.active ? "停用" : "启用"}</button>`}
      </td>
    </tr>`).join("");
  $("#userCount").textContent = users.length;
  $("#kpiUsers").textContent = users.length;
  $("#kpiRoles").textContent = new Set(users.map((u) => u.role)).size;
}

/* ---------- 渲染：日志 ---------- */
function renderLogs() {
  $("#logRows").innerHTML = logs.slice(0, 8).map((l) => `
    <div class="log-row">
      <span class="t">${esc(l.time)}</span>
      <span class="u">${esc(l.user)}</span>
      <span class="x">${l.text}</span>
    </div>`).join("");
}

/* ---------- 渲染：系统事件 ---------- */
const STATE_TONE = { 待核对: "amber", 已拦截: "red", 已生效: "green" };
function renderEvents() {
  $("#eventRows").innerHTML = SYSTEM_EVENTS.map((e) => `
    <tr>
      <td><span class="badge ${e.tone}">${esc(e.level)}</span></td>
      <td>${esc(e.module)}</td>
      <td>${esc(e.item)}</td>
      <td class="tnum" style="color:#475467;font-size:12.5px;font-weight:500">${esc(e.ref)}</td>
      <td class="tnum" style="color:var(--muted);font-size:12.5px">${esc(e.found)}</td>
      <td><span class="badge ${STATE_TONE[e.state] || "gray"}">${esc(e.state)}</span></td>
    </tr>`).join("");
  $("#kpiEvents").textContent = SYSTEM_EVENTS.filter((e) => e.open).length;
  $("#eventCountHint").textContent = `待处理 ${SYSTEM_EVENTS.filter((e) => e.open).length} / ${SYSTEM_EVENTS.length}`;
}

function renderAll() {
  renderRoleCards();
  renderGrantEditor();
  renderPreview();
  renderMatrix();
  renderUsers();
  renderEvents();
  renderLogs();
}

/* ---------- 交互：角色授权 ---------- */
function selectRole(id) {
  if (id === activeRole) return;
  if (draft && !confirm("当前角色有未保存的授权修改，切换后将丢弃。确认切换？")) return;
  activeRole = id;
  draft = null;
  renderRoleCards();
  renderGrantEditor();
  renderPreview();
}

function ensureDraft() {
  if (!draft) draft = clone(grants[activeRole]);
  return draft;
}

function toggleMenu(key, checked) {
  const d = ensureDraft();
  const menu = MENU_CATALOG.find((m) => m.key === key);
  const keys = menu.children ? [key, ...menu.children.map((c) => c.key)] : [key];
  keys.forEach((k) => {
    d.menus = checked ? Array.from(new Set([...d.menus, k])) : d.menus.filter((m) => m !== k);
  });
  // 勾选菜单时默认给"查看"；取消菜单清空操作权限
  if (menu.key === key) {
    const acts = ACTION_CATALOG[key];
    if (acts) {
      if (checked) {
        const cur = d.actions[key] || [];
        if (!cur.length) d.actions[key] = ["view"];
      } else {
        d.actions[key] = [];
      }
    }
  } else {
    // 子菜单勾选 → 父菜单可见
    const parent = MENU_CATALOG.find((m) => (m.children || []).some((c) => c.key === key));
    if (parent && checked && !d.menus.includes(parent.key)) d.menus.push(parent.key);
  }
  refreshDraftUI();
}

function toggleAllMenus(checked) {
  const d = ensureDraft();
  d.menus = checked ? MENU_CATALOG.flatMap((m) => [m.key, ...(m.children || []).map((c) => c.key)]) : [];
  d.actions = checked
    ? Object.fromEntries(Object.entries(ACTION_CATALOG).map(([m, acts]) => [m, acts.map((a) => a.id)]))
    : Object.fromEntries(Object.keys(ACTION_CATALOG).map((m) => [m, []]));
  refreshDraftUI();
}

function toggleAction(menuKey, actionId, checked) {
  const d = ensureDraft();
  const cur = d.actions[menuKey] || [];
  d.actions[menuKey] = checked ? [...cur, actionId] : cur.filter((a) => a !== actionId);
  // 勾选操作 → 菜单可见（含父级）
  if (checked) {
    if (!d.menus.includes(menuKey)) d.menus.push(menuKey);
    const parent = MENU_CATALOG.find((m) => (m.children || []).some((c) => c.key === menuKey));
    if (parent && !d.menus.includes(parent.key)) d.menus.push(parent.key);
  }
  refreshDraftUI();
}

function refreshDraftUI() {
  renderGrantEditor();
  renderPreview();
  $("#btnSave").textContent = "保存授权";
  $("#btnSave").classList.add("btn-primary");
  $("#btnSave").disabled = ROLES.find((r) => r.id === activeRole).locked;
}

function resetDraft() {
  draft = clone(DEFAULT_GRANTS[activeRole]);
  refreshDraftUI();
  toast("已恢复为默认授权（尚未保存）", "info");
}

function diffText(before, after) {
  const add = [], del = [];
  const menuAdded = after.menus.filter((m) => !before.menus.includes(m)).map(menuLabel);
  const menuDel = before.menus.filter((m) => !after.menus.includes(m)).map(menuLabel);
  if (menuAdded.length) add.push(`菜单【${menuAdded.join("、")}】`);
  if (menuDel.length) del.push(`菜单【${menuDel.join("、")}】`);
  for (const m of Object.keys(ACTION_CATALOG)) {
    const nameOf = (id) => (ACTION_CATALOG[m].find((a) => a.id === id) || {}).label || id;
    const aAdd = (after.actions[m] || []).filter((x) => !(before.actions[m] || []).includes(x)).map(nameOf);
    const aDel = (before.actions[m] || []).filter((x) => !(after.actions[m] || []).includes(x)).map(nameOf);
    if (aAdd.length) add.push(`${menuLabel(m)}：${aAdd.join("、")}`);
    if (aDel.length) del.push(`${menuLabel(m)}：${aDel.join("、")}`);
  }
  let text = "";
  if (add.length) text += `<span class="diff-add">新增 ${add.join("；")}</span>`;
  if (add.length && del.length) text += "，";
  if (del.length) text += `<span class="diff-del">移除 ${del.join("；")}</span>`;
  return text || "无变化";
}

function saveGrant() {
  const role = ROLES.find((r) => r.id === activeRole);
  if (role.locked || !draft) return;
  const diff = diffText(grants[activeRole], draft); // 先对比再覆盖，否则永远"无变化"
  grants[activeRole] = clone(draft);
  localStorage.setItem(LS_KEY, JSON.stringify(grants));
  logs.unshift({
    time: nowStamp(),
    user: "系统管理员",
    text: `角色【${role.name}】授权变更：${diff || "无变化"}（保存后即时生效）`,
  });
  draft = null;
  renderAll();
  toast(`角色【${role.name}】授权已保存并即时生效`);
}

/* ---------- 交互：用户 ---------- */
function toggleUser(id, active) {
  const u = users.find((x) => x.id === id);
  if (!u || u.role === "super") return;
  u.active = active;
  logs.unshift({ time: nowStamp(), user: "系统管理员", text: `用户【${u.name}】${active ? "启用" : "停用"}` });
  renderAll();
  toast(`用户【${u.name}】已${active ? "启用" : "停用"}`, active ? "ok" : "info");
}

function resetPwd(id) {
  const u = users.find((x) => x.id === id);
  toast(`已重置【${u.name}】的密码：Zm@${Math.random().toString(36).slice(2, 8)}（演示）`, "info");
}

function openUserModal(id) {
  editingUserId = id ?? null;
  $("#fRole").innerHTML = ROLES.map((r) => `<option value="${r.id}">${esc(r.name)}</option>`).join("");
  if (id) {
    const u = users.find((x) => x.id === id);
    $("#userModalTitle").textContent = "编辑用户";
    $("#fName").value = u.name;
    $("#fAccount").value = u.account;
    $("#fRole").value = u.role;
    $("#fRole").disabled = u.role === "super";
  } else {
    $("#userModalTitle").textContent = "新增用户";
    $("#fName").value = "";
    $("#fAccount").value = "";
    $("#fRole").value = "staff";
    $("#fRole").disabled = false;
  }
  $("#fName").classList.remove("err");
  $("#fAccount").classList.remove("err");
  $("#fNameMsg").style.display = "none";
  $("#fAccountMsg").style.display = "none";
  $("#userOverlay").classList.add("open");
  setTimeout(() => $("#fName").focus(), 60);
}

function closeUserModal() {
  $("#userOverlay").classList.remove("open");
  editingUserId = null;
}

function submitUser() {
  const name = $("#fName").value.trim();
  const account = $("#fAccount").value.trim();
  const role = $("#fRole").value;
  let ok = true;
  $("#fName").classList.toggle("err", !name);
  $("#fNameMsg").style.display = name ? "none" : "block";
  if (!name) ok = false;
  const accountOk = /^[A-Za-z0-9_]{3,}$/.test(account) && !users.some((u) => u.account === account && u.id !== editingUserId);
  $("#fAccount").classList.toggle("err", !accountOk);
  $("#fAccountMsg").style.display = accountOk ? "none" : "block";
  $("#fAccountMsg").textContent = /^[A-Za-z0-9_]{3,}$/.test(account) ? "账号已存在" : "账号需为字母 / 数字 / 下划线";
  if (!accountOk) ok = false;
  if (!ok) return;

  if (editingUserId) {
    const u = users.find((x) => x.id === editingUserId);
    const roleChanged = u.role !== role;
    u.name = name; u.account = account;
    if (!$("#fRole").disabled) u.role = role;
    logs.unshift({ time: nowStamp(), user: "系统管理员", text: `编辑用户【${name}】${roleChanged ? `，角色调整为【${roleName(role)}】` : ""}` });
    toast(`用户【${name}】已更新`);
  } else {
    users.push({ id: Math.max(...users.map((u) => u.id)) + 1, name, account, role, active: true, last: "—" });
    logs.unshift({ time: nowStamp(), user: "系统管理员", text: `新增用户【${name}】，分配角色【${roleName(role)}】` });
    toast(`用户【${name}】已创建，初始密码已生成`);
  }
  closeUserModal();
  renderAll();
}

/* ---------- Tabs ---------- */
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("active", p.id === `tab-${btn.dataset.tab}`));
  });
});

/* Esc 关闭弹窗 */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#userOverlay").classList.contains("open")) closeUserModal();
});
$("#userOverlay").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) closeUserModal();
});

/* ---------- 启动 ---------- */
renderAll();
</script>
</body>
</html>
